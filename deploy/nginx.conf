# Nginx config for app.sbinsights.co — reverse proxy + TLS termination.
# Placed at /etc/nginx/sites-available/app.sbinsights.co.
# Symlink to sites-enabled/ to activate.
#
# Initial state (HTTP only) for Let's Encrypt challenge. After certbot
# runs (05_nginx_https.sh), certbot adds the TLS server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name app.sbinsights.co;

    # Larger uploads for file imports (OCS catalog xlsx files are ~7MB)
    client_max_body_size 50M;

    # Generous timeouts — some imports take 30-60s
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # /healthz is fast (no DB hit) — good for load balancers / monitoring.
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        access_log off;
    }
}
