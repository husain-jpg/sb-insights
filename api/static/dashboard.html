<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SB Insights</title>
<style>
  :root {
    --bg: #0a0e0c;
    --bg-elev: #111815;
    --bg-elev-2: #17201c;
    --bg-elev-3: #1d2823;
    --border: #1f2a25;
    --border-strong: #2a3832;
    --text: #e8ebe9;
    --text-dim: #8a9690;
    --text-faint: #5a655f;
    --accent: #7dd67a;
    --warning: #e8b447;
    --critical: #e85a5a;
    --info: #6aa6d6;
    --purple: #b07fd1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
  }
  aside {
    width: 220px;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    position: sticky; top: 0; left: 0;
    height: 100vh;
    display: flex; flex-direction: column;
    padding: 24px 0;
    flex-shrink: 0;
    z-index: 50;
  }
  .logo { padding: 0 20px 24px; flex-shrink: 0; }
  .logo h1 {
    font-family: Georgia, serif;
    font-size: 17px; font-weight: 400;
    display: flex; align-items: center; gap: 10px;
  }
  .logo-mark {
    width: 24px; height: 24px; background: var(--accent);
    border-radius: 3px; display: inline-flex; align-items: center;
    justify-content: center; color: var(--bg); font-weight: 700;
  }
  .logo-sub {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.1em; color: var(--text-faint);
    margin-left: 34px; margin-top: 2px; text-transform: uppercase;
  }
  nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;  /* allows flex child to shrink and scroll */
  }
  /* Group containers in the new IA */
  .nav-group {
    margin-bottom: 4px;
  }
  .nav-group-header {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 9px 20px;
    background: transparent; border: none;
    color: var(--text-faint); font-size: 10px;
    font-family: ui-monospace, Menlo, monospace;
    text-transform: uppercase; letter-spacing: 0.1em;
    cursor: pointer; text-align: left;
    transition: color 120ms;
    user-select: none;
  }
  .nav-group-header:hover { color: var(--text-dim); }
  .nav-group-header .arrow {
    display: inline-block; width: 8px;
    transition: transform 120ms;
    color: var(--text-faint);
  }
  .nav-group.collapsed .arrow { transform: rotate(-90deg); }
  .nav-group.collapsed .nav-group-items { display: none; }
  .nav-group-items button {
    padding-left: 30px;  /* indent nested items */
  }
  nav button {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 11px 20px;
    background: transparent; border: none;
    border-left: 2px solid transparent;
    color: var(--text-dim); font-size: 13px;
    font-family: inherit; cursor: pointer; text-align: left;
    transition: all 120ms;
  }
  nav button:hover { color: var(--text); }
  nav button.active {
    background: var(--bg-elev-2); color: var(--text);
    border-left-color: var(--accent);
  }
  nav button .badge {
    margin-left: auto; background: var(--critical); color: var(--bg);
    font-family: ui-monospace, Menlo, monospace; font-size: 9px;
    font-weight: 700; padding: 2px 6px; border-radius: 2px;
    min-width: 18px; text-align: center;
  }
  .status-pane {
    padding: 16px 20px; border-top: 1px solid var(--border);
    font-size: 10px; font-family: ui-monospace, Menlo, monospace;
    color: var(--text-faint); line-height: 1.6;
    flex-shrink: 0;
  }
  .status-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; margin-right: 6px;
  }
  .status-ok { background: var(--accent); }
  .status-warn { background: var(--warning); }

  main {
    flex: 1; padding: 32px 40px; max-width: 1500px; min-width: 0;
  }
  .section-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 20px; gap: 16px;
  }
  .kicker {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--text-faint); margin-bottom: 6px;
    text-transform: uppercase;
  }
  .section-header h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px; font-weight: 400;
    letter-spacing: -0.01em;
  }

  .tag {
    display: inline-block;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.08em;
    padding: 3px 7px; border-radius: 3px;
    text-transform: uppercase; font-weight: 600; line-height: 1.2;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .tag-accent { background: rgba(125,214,122,0.1); color: var(--accent); border-color: transparent; }
  .tag-critical { background: rgba(232,90,90,0.12); color: var(--critical); border-color: transparent; }
  .tag-warning { background: rgba(232,180,71,0.12); color: var(--warning); border-color: transparent; }
  .tag-info { background: rgba(106,166,214,0.12); color: var(--info); border-color: transparent; }
  .tag-stockout { background: rgba(232,90,90,0.2); color: var(--critical); border-color: transparent; }

  .card {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 4px;
  }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 4px; padding: 20px; position: relative; overflow: hidden;
    cursor: pointer;
    transition: transform 120ms, border-color 120ms;
  }
  .kpi-card[data-clickable]:hover {
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 3px; height: 100%;
  }
  .kpi-card.green::before { background: var(--accent); }
  .kpi-card.red::before { background: var(--critical); }
  .kpi-card.amber::before { background: var(--warning); }
  .kpi-card.blue::before { background: var(--info); }
  .kpi-card.purple::before { background: var(--purple); }
  .kpi-label {
    font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    letter-spacing: 0.12em; color: var(--text-faint);
    margin-bottom: 10px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
  }
  .kpi-link-arrow {
    font-size: 14px; color: var(--text-faint); letter-spacing: 0;
  }
  .kpi-card[data-clickable]:hover .kpi-link-arrow { color: var(--accent); }
  .kpi-value {
    font-family: Georgia, serif; font-size: 34px; line-height: 1;
    margin-bottom: 8px;
  }
  .kpi-detail { font-size: 12px; color: var(--text-dim); }

  .store-card {
    background: var(--bg-elev); padding: 18px; border-radius: 4px;
    border: 1px solid var(--border);
    display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 20px;
    align-items: center;
  }
  .store-header-row {
    display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 20px;
    padding: 12px 18px; font-family: ui-monospace, Menlo, monospace;
    font-size: 9px; letter-spacing: 0.1em; color: var(--text-faint);
    text-transform: uppercase;
  }
  .store-compare-block {
    display: flex; flex-direction: column; gap: 4px;
  }
  .store-compare-main {
    font-family: Georgia, serif; font-size: 20px; line-height: 1;
  }
  .store-compare-delta {
    font-size: 11px; font-family: ui-monospace, Menlo, monospace;
  }
  .delta-pos { color: var(--accent); }
  .delta-neg { color: var(--critical); }
  .delta-flat { color: var(--text-dim); }
  .store-id-label {
    font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    color: var(--text-faint);
  }
  .store-name-label { font-size: 14px; font-weight: 500; margin-top: 2px; }

  table {
    width: 100%; border-collapse: collapse;
  }
  thead th {
    background: var(--bg-elev-2); padding: 12px 16px;
    font-family: ui-monospace, Menlo, monospace; font-size: 9px;
    letter-spacing: 0.1em; color: var(--text-faint);
    text-transform: uppercase; text-align: left;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
    user-select: none;
  }
  thead th.num { text-align: right; }
  thead th.sortable { cursor: pointer; }
  thead th.sortable:hover { color: var(--text); background: var(--bg-elev-3); }
  thead th.sortable .sort-icon {
    display: inline-block; margin-left: 4px; opacity: 0.4; font-size: 8px;
  }
  thead th.sorted .sort-icon { opacity: 1; color: var(--accent); }
  tbody td {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    font-size: 13px;
    background: var(--bg-elev);
  }
  tbody td.num {
    text-align: right; font-family: ui-monospace, Menlo, monospace;
  }
  tbody td.muted { color: var(--text-dim); }
  tbody tr:hover td { background: var(--bg-elev-2); }

  /* Sticky-column support: wrap a table in <div class="sticky-cols-1"> etc.
     The first N columns will freeze when horizontal-scrolling. Background
     overrides standard td bg to ensure scrolling content doesn't bleed
     through. Each sticky-cols-X class freezes the first X columns. */
  .sticky-cols-1 thead th:first-child,
  .sticky-cols-1 tbody td:first-child {
    position: sticky; left: 0; z-index: 4;
    background: var(--bg-elev);
  }
  .sticky-cols-1 thead th:first-child {
    z-index: 6; background: var(--bg-elev-2);
  }
  .sticky-cols-1 tbody tr:hover td:first-child { background: var(--bg-elev-2); }

  .sticky-cols-4 thead th:nth-child(-n+4),
  .sticky-cols-4 tbody td:nth-child(-n+4) {
    position: sticky; z-index: 4; background: var(--bg-elev);
  }
  .sticky-cols-4 thead th:nth-child(-n+4) {
    z-index: 6; background: var(--bg-elev-2);
  }
  .sticky-cols-4 tbody tr:hover td:nth-child(-n+4) { background: var(--bg-elev-2); }
  /* Each sticky col needs its own `left` offset. JS sets these via inline
     styles after table render based on actual column widths. Fallback values
     here cover typical column widths so it works even without JS adjustments. */
  .sticky-cols-4 thead th:nth-child(1),
  .sticky-cols-4 tbody td:nth-child(1) { left: 0; }
  .sticky-cols-4 thead th:nth-child(2),
  .sticky-cols-4 tbody td:nth-child(2) { left: 220px; }
  .sticky-cols-4 thead th:nth-child(3),
  .sticky-cols-4 tbody td:nth-child(3) { left: 320px; }
  .sticky-cols-4 thead th:nth-child(4),
  .sticky-cols-4 tbody td:nth-child(4) { left: 400px; }

  /* Dead Stock / Overstock table — 12 columns. Same treatment as Promos:
     natural table width (wrapper scrolls horizontally) instead of squeezing
     everything into 100%, nowrap cells, bounded wrapping Product column. */
  #ds-table > table {
    width: auto;
    min-width: 100%;
    table-layout: auto;
  }
  #ds-table th, #ds-table td { white-space: nowrap; }
  #ds-table th:nth-child(1), #ds-table td:nth-child(1) { text-align: center; }
  #ds-table th:nth-child(2), #ds-table td:nth-child(2) {
    white-space: normal; min-width: 200px; max-width: 280px;
  }

  /* Promos table — 15 columns, the global "table { width: 100% }" squeezed
     them into the wrapper width so nothing scrolled and content got clipped.
     Override: let the table size to its natural content (so the wrapper's
     overflow-x:auto actually engages), nowrap cells by default, and pin
     ONLY Tier + Product to the left so they stay visible while scrolling. */
  #promos-table > table {
    width: auto;        /* grow to fit content */
    min-width: 100%;    /* but fill the wrapper if natural width is smaller */
    table-layout: auto;
  }
  #promos-table th, #promos-table td {
    white-space: nowrap;  /* default: keep on one line so columns don't get tall */
  }
  /* Column 1 — Tier badge: narrow, fixed-ish, sticky, centered */
  #promos-table th:nth-child(1),
  #promos-table td:nth-child(1) {
    position: sticky; left: 0; z-index: 4;
    min-width: 70px; text-align: center;
    background: var(--bg-elev);
  }
  #promos-table thead th:nth-child(1) { z-index: 6; background: var(--bg-elev-2); }
  #promos-table tbody tr:hover td:nth-child(1) { background: var(--bg-elev-2); }
  /* Column 2 — Product: sticky, allowed to wrap (name + SKU line), bounded
     so it doesn't sprawl. left:70 must match col 1's min-width. */
  #promos-table th:nth-child(2),
  #promos-table td:nth-child(2) {
    position: sticky; left: 70px; z-index: 4;
    min-width: 240px; max-width: 320px;
    white-space: normal;
    background: var(--bg-elev);
  }
  #promos-table thead th:nth-child(2) { z-index: 6; background: var(--bg-elev-2); }
  #promos-table tbody tr:hover td:nth-child(2) { background: var(--bg-elev-2); }

  /* Tables in sticky-col mode need horizontal scroll on their wrapper. */
  .table-scroll { overflow-x: auto; }
  .sku {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; color: var(--text-faint); margin-top: 3px;
  }

  select, input[type="text"], input[type="search"] {
    background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px;
    padding: 6px 10px; font-size: 11px;
    font-family: ui-monospace, Menlo, monospace;
  }
  input[type="search"] { width: 220px; }

  .controls-row {
    display: flex; gap: 8px; align-items: center;
  }

  .loading {
    padding: 40px; text-align: center; color: var(--text-faint);
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px; letter-spacing: 0.1em;
  }
  .spinner {
    display: inline-block; width: 14px; height: 14px; vertical-align: -2px;
    border: 2px solid var(--border-strong, #555); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Spliff loader (Overview) — a little joint with a pulsing cherry and
     smoke wisps drifting up. Pure CSS, no assets. */
  .spliff-loader { display: inline-flex; align-items: center; gap: 16px; }
  .spliff { position: relative; display: inline-block; width: 78px; height: 30px; }
  .spliff-body {
    position: absolute; left: 0; bottom: 6px; width: 62px; height: 9px;
    background: linear-gradient(90deg, #b8a37e 0%, #e8dcc0 25%, #f2ead6 100%);
    border-radius: 4px 2px 2px 4px;
  }
  /* twisted paper tip at the mouth end */
  .spliff-body::before {
    content: ''; position: absolute; left: -5px; top: 2px; width: 7px; height: 5px;
    background: #a08c66; border-radius: 3px 1px 1px 3px; transform: rotate(-14deg);
  }
  /* burn line where paper meets cherry */
  .spliff-body::after {
    content: ''; position: absolute; right: -1px; top: 0; width: 3px; height: 9px;
    background: #4a4039; border-radius: 1px;
  }
  .spliff-ember {
    position: absolute; left: 62px; bottom: 6px; width: 9px; height: 9px;
    background: radial-gradient(circle, #ffd27a 0%, #ff7a3c 45%, #c23616 85%);
    border-radius: 50%;
    animation: emberPulse 1.6s ease-in-out infinite;
  }
  @keyframes emberPulse {
    0%, 100% { opacity: .65; box-shadow: 0 0 4px 1px rgba(255, 122, 60, .35); }
    50%      { opacity: 1;   box-shadow: 0 0 10px 3px rgba(255, 122, 60, .7); }
  }
  .spliff-smoke { position: absolute; left: 66px; bottom: 16px; width: 6px; height: 6px; }
  .spliff-smoke span {
    position: absolute; bottom: 0; left: 0; width: 6px; height: 6px;
    background: rgba(165, 165, 175, .4); border-radius: 50%;
    opacity: 0;
    animation: smokeRise 2.4s ease-out infinite;
  }
  .spliff-smoke span:nth-child(2) { animation-delay: .8s; }
  .spliff-smoke span:nth-child(3) { animation-delay: 1.6s; }
  @keyframes smokeRise {
    0%   { transform: translate(0, 0) scale(.5); opacity: 0; }
    15%  { opacity: .85; }
    60%  { transform: translate(-7px, -16px) scale(1.6); opacity: .45; }
    100% { transform: translate(4px, -30px) scale(2.6); opacity: 0; }
  }

  /* dim a panel while it's refreshing */
  .is-loading { opacity: 0.45; pointer-events: none; transition: opacity 120ms; }
  .error {
    padding: 20px; border-left: 3px solid var(--critical);
    background: rgba(232,90,90,0.06); color: var(--text-dim);
    font-size: 13px; line-height: 1.5;
  }
  .error strong { color: var(--critical); display: block; margin-bottom: 6px; }

  .hint-box {
    padding: 16px; background: rgba(106,166,214,0.06);
    border: 1px solid rgba(106,166,214,0.2); border-radius: 4px;
    margin-top: 16px; font-size: 11px; color: var(--text-dim);
    line-height: 1.5; display: flex; gap: 8px; align-items: flex-start;
  }
  .hint-box::before { content: 'ℹ'; color: var(--info); font-size: 14px; }

  .btn-tab {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 14px; font-size: 11px; cursor: pointer; border-radius: 3px;
    text-transform: uppercase; letter-spacing: 0.05em;
    font-family: ui-monospace, Menlo, monospace;
  }
  .btn-tab:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-tab.active { background: var(--bg-elev-2); color: var(--accent); border-color: var(--accent); }
  .btn-link {
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; padding: 4px 8px; font-size: 11px;
    text-decoration: underline; font-family: inherit;
  }
  .btn-link:hover { color: var(--critical); }

  .summary-bar {
    display: flex; gap: 24px; padding: 16px 20px;
    background: var(--bg-elev-2); border-bottom: 1px solid var(--border);
  }
  .summary-bar div { font-size: 11px; color: var(--text-dim); }
  .summary-bar strong {
    display: block; font-size: 16px; color: var(--text);
    font-family: Georgia, serif; font-weight: 400;
  }

  .empty-state {
    padding: 60px 20px; text-align: center; color: var(--text-faint);
  }
  .empty-state h3 { font-family: Georgia, serif; font-size: 18px; margin-bottom: 8px; color: var(--text-dim); }
  .empty-state p { font-size: 13px; line-height: 1.5; max-width: 500px; margin: 0 auto; }
</style>
</head>
<body>
<aside>
  <div class="logo">
    <h1>
      <span class="logo-mark">SB</span>
      SB Insights
    </h1>
    <div class="logo-sub">CANNABIS OPS</div>
  </div>
  <nav id="nav">
    <button data-page="overview" class="active">▸ Overview</button>

    <div class="nav-group" data-group="inventory">
      <button class="nav-group-header" data-toggle="inventory">
        <span class="arrow">▾</span> Inventory Reports
      </button>
      <div class="nav-group-items">
        <button data-page="inventory">▸ Inventory On Hand</button>
        <button data-page="ocs-catalogue">▸ OCS Catalogue</button>
        <button data-page="reorder">▸ Reorder Report <span class="badge" id="badge-reorder" style="display:none"></span></button>
        <button data-page="stockouts">▸ Stockouts <span class="badge" id="badge-stockouts" style="display:none"></span></button>
        <button data-page="deadstock">▸ Dead Stock / Overstock</button>
        <button data-page="transfers">▸ Suggested Transfers</button>
        <button data-page="cross-store">▸ Cross-Store Opportunities</button>
      </div>
    </div>

    <button data-page="promos">▸ Promotions</button>

    <div class="nav-group" data-group="analytics">
      <button class="nav-group-header" data-toggle="analytics">
        <span class="arrow">▾</span> Analytics
      </button>
      <div class="nav-group-items">
        <button data-page="mix">▸ Inventory Category Mix</button>
        <button data-page="market-intel">▸ Market Intelligence</button>
        <button data-page="competitors">▸ Competitor Pricing</button>
        <button data-page="partner-coverage">▸ Partner Coverage</button>
        <button data-page="outcomes">▸ Order Backtests</button>
      </div>
    </div>

    <div class="nav-group" data-group="admin">
      <button class="nav-group-header" data-toggle="admin">
        <span class="arrow">▾</span> Admin
      </button>
      <div class="nav-group-items">
        <button data-page="analytics">▸ Financial</button>
        <button data-page="partners">▸ Data Collectives</button>
        <button data-page="ltos">▸ LTOs</button>
        <button data-page="data-lp-partners">▸ Data LP Partners</button>
        <button data-page="monthly-reports">▸ Monthly Reports</button>
      </div>
    </div>

    <div class="nav-group" data-group="settings">
      <button class="nav-group-header" data-toggle="settings">
        <span class="arrow">▾</span> Settings
      </button>
      <div class="nav-group-items">
        <button data-page="settings">▸ System Settings</button>
        <button data-page="users">▸ Users</button>
        <button data-page="system-health">▸ System Health</button>
        <button data-page="email-scraper">▸ Email Scraper</button>
        <button data-page="ocs-connector">▸ OCS Connector</button>
      </div>
    </div>
  </nav>
  <div class="status-pane" id="status-pane">
    <div><span class="status-dot status-ok"></span>Local database</div>
    <div><span class="status-dot status-warn"></span>Cova API (pending)</div>
    <div id="status-info" style="margin-top: 8px;"></div>
  </div>
  <div id="user-pane" style="border-top: 1px solid var(--border); padding: 10px 14px; font-size: 11px; color: var(--text-dim);">
    <div id="user-pane-content">Loading user...</div>
  </div>

// Store id -> short name cache, populated on first /api/locations call.

// Shared helper: render the rebate/data-fee badge. Used in Reorder, Stockouts,
// Dead Stock, Promotions — anywhere a SKU is shown and a rebate badge helps
// answer "do I get paid for this product?"
//
// Returns empty string if no active deal. Returns purple DIRECT tag for direct
// deals (which exclude the SKU from collectives) and green collective tag with
// rate + basis for collective deals (Canna Collective, IRCC, Seeker).
function rebateBadgeHtml(r) {
  if (r.data_fee_is_direct) {
    return `<span class="tag" style="background: rgba(140, 100, 180, 0.15); color: #a78bd9; border-color: rgba(160, 110, 200, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Direct deal with ${r.data_fee_partner} — this SKU is excluded from collective rebate programs">DIRECT</span>`;

  if (r.data_fee_pct) {
    const basis = r.data_fee_basis === 'wholesale_cost' ? 'WS' : r.data_fee_basis === 'retail_sales' ? 'RT' : '';
    const partnerShort = r.data_fee_partner === 'Canna Collective' ? 'CC' : (r.data_fee_partner || '');
    return `<span class="tag" style="background: rgba(70, 140, 90, 0.15); color: #6dab84; border-color: rgba(80, 160, 100, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Active data revenue deal: ${r.data_fee_partner} pays ${r.data_fee_pct}% of ${r.data_fee_basis === 'wholesale_cost' ? 'wholesale cost' : 'retail sales'} for this SKU">${partnerShort}: ${r.data_fee_pct}% ${basis}</span>`;
  }
  return '';
}

async function api(path) {
  const r = await fetch(API + path, { credentials: "include" });
  if (r.status === 401) {
    // Session expired or never logged in — bounce to login
    window.location.href = "/login";
    throw new Error("Not authenticated");
  }
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`${r.status}: ${t}`);
  }
  return r.json();
}

// Trigger a file download from any URL by opening it in a hidden link.
// The browser picks up the Content-Disposition header for the filename.
function downloadUrl(url) {
  const a = document.createElement('a');
  a.href = url;
  a.download = '';  // hint to treat as download
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 1000);
}

// ========================================================================
// SORTABLE TABLE — reusable mechanism
// ========================================================================
// Each sortable table stores its data + column config in state,
// and re-renders on header click. This is simpler than per-table sort code.

const tableState = {};  // id -> {rows, columns, sortCol, sortDir}

function renderTable(tableId, rows, columns, opts = {}) {
  // columns: [{ key, label, type, align, render, width }]
  tableState[tableId] = { rows, columns, sortCol: opts.defaultSort || null, sortDir: opts.defaultDir || 'asc', opts };
  _drawTable(tableId);
}

function _drawTable(tableId) {
  const s = tableState[tableId];
  const container = document.getElementById(tableId);
  if (!container) return;

  // Sort rows
  let displayRows = [...s.rows];
  if (s.sortCol) {
    const col = s.columns.find(c => c.key === s.sortCol);
    const dir = s.sortDir === 'asc' ? 1 : -1;
    displayRows.sort((a, b) => {
      const av = col && col.sortValue ? col.sortValue(a) : a[s.sortCol];
      const bv = col && col.sortValue ? col.sortValue(b) : b[s.sortCol];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * dir;
      if (col && col.type === 'number') return ((+av) - (+bv)) * dir;
      return String(av).localeCompare(String(bv)) * dir;
    });
  }

  // Detect if any columns have a `group` — render two header rows when so.
  // Row 1: group parent cells (colspan over their member columns).
  // Row 2: leaf header cells with sort affordance.
  const hasGroups = s.columns.some(c => c.group);
  let theadRows = '';

  if (hasGroups) {
    // Walk columns building contiguous group segments.
    const segments = [];
    let cur = null;
    for (const c of s.columns) {
      const g = c.group || null;
      if (cur && cur.group === g) {
        cur.columns.push(c);
      } else {
        cur = { group: g, columns: [c] };
        segments.push(cur);
      }
    }
    const groupRow = segments.map(seg => {
      const label = seg.group || '';
      // Visible group cell vs. spacer cell (no group) — different styling.
      const styling = seg.group
        ? 'text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); border-bottom: 1px solid var(--border); padding: 6px 0;'
        : 'border-bottom: none; background: transparent;';
      return `<th colspan="${seg.columns.length}" style="${styling}">${escapeHtml(label)}</th>`;
    }).join('');
    theadRows += `<tr>${groupRow}</tr>`;
  }

  const thead = s.columns.map(c => {
    const align = c.align === 'right' ? 'num' : '';
    const sortable = c.sortable !== false ? 'sortable' : '';
    const sorted = s.sortCol === c.key ? 'sorted' : '';
    const arrow = s.sortCol === c.key ? (s.sortDir === 'asc' ? '▲' : '▼') : '↕';
    const titleAttr = c.tooltip ? ` title="${c.tooltip.replace(/"/g, '&quot;')}"` : '';
    return `<th class="${align} ${sortable} ${sorted}" data-col="${c.key}"${titleAttr}>
      ${c.label}${sortable ? `<span class="sort-icon">${arrow}</span>` : ''}
    </th>`;
  }).join('');
  theadRows += `<tr>${thead}</tr>`;

  const tbody = displayRows.length === 0
    ? `<tr><td colspan="${s.columns.length}" class="loading">${s.opts.emptyText || 'No rows.'}</td></tr>`
    : displayRows.map((row, _ri) => {
        // Optional per-row attributes (e.g. greyed-out / excluded styling)
        const attrs = s.opts.rowAttrs ? (s.opts.rowAttrs(row) || '') : '';
        return `<tr ${attrs}>` + s.columns.map(c => {
          const align = c.align === 'right' ? 'num' : '';
          const val = c.render ? c.render(row, _ri) : (row[c.key] ?? '');
          return `<td class="${align}">${val}</td>`;
        }).join('') + '</tr>';
      }).join('');

  container.innerHTML = `
    <table>
      <thead>${theadRows}</thead>
      <tbody>${tbody}</tbody>
    </table>
  `;

  // Sticky-column offsets: .sticky-cols-N pins the first N columns, but each
  // pinned column needs a `left` matching the REAL rendered width of the
  // columns before it. The CSS only has fallback offsets tuned for one table
  // shape — measure and set inline so any column layout pins correctly.
  const stickyCls = [...container.classList].find(c => /^sticky-cols-\d+$/.test(c));
  if (stickyCls) {
    const n = +stickyCls.match(/\d+$/)[0];
    const headRow = container.querySelector('thead tr:last-child');
    if (headRow) {
      let left = 0;
      for (let i = 1; i <= n && headRow.children[i - 1]; i++) {
        container.querySelectorAll(`thead tr:last-child th:nth-child(${i}), tbody td:nth-child(${i})`)
          .forEach(el => { el.style.left = left + 'px'; });
        left += headRow.children[i - 1].getBoundingClientRect().width;
      }
    }
  }

  // Wire up header clicks
  container.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (s.sortCol === col) {
        s.sortDir = s.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        s.sortCol = col;
        s.sortDir = 'desc';  // default to desc for new column
      }
      _drawTable(tableId);
    });
  });
}

function deltaClass(d) {
  if (d == null) return 'delta-flat';
  if (d > 0.5) return 'delta-pos';
  if (d < -0.5) return 'delta-neg';
  return 'delta-flat';
}

// ========================================================================
// REORDER
// ========================================================================
// ========================================================================
// Suggested Additions — peer-popular SKUs you don't carry, surfaced atop
// the Reorder Report. Auto-refreshes when the store filter changes.
// ========================================================================
// Kept collapsed by default to not disrupt the existing reorder flow. Click
// the header bar to expand. Action buttons (snooze/dismiss/added) update
// state and remove the row.

let _suggestedExpanded = false;  // remembered across refetches

async function loadSuggestedAdditions(locationId) {
  const panel = document.getElementById("suggested-additions-panel");
  if (!panel) return;

  // No store selected → hide the panel entirely
  if (!locationId) {
    panel.style.display = "none";
    panel.innerHTML = "";
    return;
  }

  // Fetch suggestions
  let data;
  try {
    data = await api(`/api/reorder/suggested-additions?location_id=${encodeURIComponent(locationId)}&limit=20`);
  } catch (e) {
    panel.style.display = "none";
    return;
  }

  if (data.warning && data.count === 0) {
    // Show a small explanatory bar so user knows the feature exists but has no data yet
    panel.style.display = "block";
    panel.innerHTML = `
      <div style="padding: 10px 16px; background: var(--bg-elev-2); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-dim);">
        💡 Suggested Additions disabled: ${escapeHtml(data.warning)}
      </div>
    `;
    return;
  }

  if (!data.items || data.items.length === 0) {
    panel.style.display = "none";
    return;
  }

  const importedDate = data.imported_at ? data.imported_at.slice(0, 10) : '?';
  const ageDays = data.imported_at ? Math.floor((Date.now() - new Date(data.imported_at).getTime()) / 86400000) : null;
  const stale = ageDays !== null && ageDays > 21;

  const totalCost = data.items.reduce((sum, it) => sum + (it.suggested_cost || 0), 0);

  panel.style.display = "block";
  panel.innerHTML = `
    <div style="background: rgba(180, 140, 40, 0.08); border-bottom: 1px solid var(--border);">
      <div style="padding: 10px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;" id="sa-header">
        <div style="font-size: 12px;">
          <strong style="color: #c89b32;">⭐ Suggested Additions</strong>
          <span style="color: var(--text-dim); margin-left: 8px;">${data.count} peer-popular SKU${data.count === 1 ? '' : 's'} you don't carry · trial cost ~${fmt$(totalCost)}${(() => { const n = data.items.filter(it => it.data_fee_pct && !it.data_fee_is_direct).length; return n ? ` · <span style=\"color: #6dab84;\">${n} with rebates</span>` : ''; })()}</span>
          ${stale ? '<span class="tag" style="background: rgba(214, 100, 100, 0.15); color: #d66464; font-size: 10px; margin-left: 8px;">STALE DATA</span>' : ''}
        </div>
        <div style="font-size: 11px; color: var(--text-dim);">
          <span style="margin-right: 12px;">Last imported: ${importedDate}${ageDays !== null ? ` (${ageDays}d ago)` : ''}</span>
          <span id="sa-toggle-arrow">${_suggestedExpanded ? '▾' : '▸'}</span>
        </div>
      </div>
      <div id="sa-body" style="display: ${_suggestedExpanded ? 'block' : 'none'};">
        <div style="padding: 8px 16px; font-size: 11px; color: var(--text-dim); background: var(--bg-elev-2); border-top: 1px solid var(--border);">
          These SKUs sell well at peer stores in your municipality but you don't carry them. Suggested quantities are conservative trial orders (1-2 cases). Once stocked, regular reorder takes over.
        </div>
        ${(typeof miFreshnessBanner === 'function' && _dataAgeDays(data.imported_at) != null && _dataAgeDays(data.imported_at) > 14)
          ? `<div style="padding: 10px 16px 0;">${miFreshnessBanner(data.imported_at, data.period_end, data.period_days)}</div>` : ''}
        <div id="sa-table"></div>
      </div>
    </div>
  `;

  document.getElementById("sa-header").addEventListener("click", () => {
    _suggestedExpanded = !_suggestedExpanded;
    document.getElementById("sa-body").style.display = _suggestedExpanded ? "block" : "none";
    document.getElementById("sa-toggle-arrow").textContent = _suggestedExpanded ? "▾" : "▸";
  });

  renderSuggestedTable(data.items, locationId);
}

function renderSuggestedTable(items, locationId) {
  const container = document.getElementById("sa-table");
  if (!container) return;

  const rows = items.map((it, idx) => {
    const stockTag = it.stock_status === "YES"
      ? '<span class="tag tag-accent" style="font-size: 9px;">In stock</span>'
      : '<span class="tag tag-critical" style="font-size: 9px;">Out</span>';
    // Rebate badge — same semantics as the reorder table tags.
    const rebateTag = (() => {
      if (it.data_fee_is_direct) {
        return `<span class="tag" style="background: rgba(140, 100, 180, 0.15); color: #a78bd9; border-color: rgba(160, 110, 200, 0.4); font-size: 9px; padding: 1px 5px; margin-left: 6px;" title="Direct deal with ${escapeHtml(it.data_fee_partner || '')} — excluded from collective rebate programs">DIRECT</span>`;
      }
      if (it.data_fee_pct) {
        const basis = it.data_fee_basis === 'wholesale_cost' ? 'WS' : it.data_fee_basis === 'retail_sales' ? 'RT' : '';
        const partnerShort = it.data_fee_partner === 'Canna Collective' ? 'CC' : (it.data_fee_partner || '');
        return `<span class="tag" style="background: rgba(70, 140, 90, 0.15); color: #6dab84; border-color: rgba(80, 160, 100, 0.4); font-size: 9px; padding: 1px 5px; margin-left: 6px;" title="Qualifies for a rebate: ${escapeHtml(it.data_fee_partner || '')} pays ${it.data_fee_pct}% of ${it.data_fee_basis === 'wholesale_cost' ? 'wholesale cost' : 'retail sales'}">${escapeHtml(partnerShort)}: ${it.data_fee_pct}% ${basis}</span>`;
      }
      return '';
    })();
    const todayStr = new Date().toISOString().slice(0, 10);
    const added = it.status === 'added';
    const dismissed = it.status === 'snoozed' && it.snoozed_until && it.snoozed_until > todayStr;
    const handled = added || dismissed;        // greyed but kept in the list
    const actionedOn = (it.status_updated || '').slice(0, 10);
    // Once actioned the row greys out (it stays in the list). 'Added' keeps a
    // green check; 'Dismissed' shows the date it was dismissed and when it
    // returns. Both have Undo.
    const rowStyle = handled ? 'opacity: 0.5;' : '';
    const actionCell = added
      ? `<span style="font-size: 10px; color: #6dab84; font-weight: 600;" title="Added to this week's order — appears as a green trial-add row in the table below and fills into the OCS template.">✓ Added</span>
         <button class="btn-link sa-action-btn" data-sku="${escapeHtml(it.sku)}" data-action="reset" style="font-size: 10px; color: var(--accent); margin-left: 6px;">Undo</button>`
      : dismissed
      ? `<span style="font-size: 10px; color: var(--text-dim);" title="Dismissed${actionedOn ? ' on ' + actionedOn : ''} — returns to the list on ${it.snoozed_until} if still a gap.">Dismissed${actionedOn ? ' ' + actionedOn : ''}</span>
         <button class="btn-link sa-action-btn" data-sku="${escapeHtml(it.sku)}" data-action="reset" style="font-size: 10px; color: var(--accent); margin-left: 6px;">Undo</button>`
      : `<button class="btn-link sa-action-btn" data-sku="${escapeHtml(it.sku)}" data-action="added"
                 title="Add to this week's order — creates a green trial-add row in the reorder table and fills the OCS template at the suggested quantity."
                 style="font-size: 10px; color: #6dab84;">Add</button>
         <button class="btn-link sa-action-btn" data-sku="${escapeHtml(it.sku)}" data-action="snooze"
                 title="Dismiss for now — greys it out (stays in the list), then it returns to active after 60 days if it's still a gap. Nothing is deleted; Undo anytime." style="font-size: 10px; color: var(--text-dim);">Dismiss</button>`;
    return `
      <tr data-sku="${escapeHtml(it.sku)}" style="${rowStyle}">
        <td style="font-variant-numeric: tabular-nums; color: var(--text-dim);">${idx + 1}</td>
        <td>
          <strong>${escapeHtml(it.item_name || it.sku)}</strong>
          <div class="sku">${escapeHtml(it.brand || '—')} · ${escapeHtml(it.subcategory || '—')} · ${escapeHtml(it.size || '—')}${rebateTag}</div>
        </td>
        <td class="num" title="Avg units sold per peer store during the period">${it.municipality_units ? it.municipality_units.toFixed(0) : '—'}</td>
        <td class="num" title="Avg units sold per day at peer stores when SKU sells">${it.municipality_velocity ? it.municipality_velocity.toFixed(2) : '—'}</td>
        <td class="num">${it.unit_price ? fmt$2(it.unit_price) : '—'}</td>
        <td class="num">${it.pack_size || '—'}</td>
        <td class="num"><strong>${it.suggested_units}u</strong><div class="sku">${it.suggested_cases}c</div></td>
        <td class="num"><strong>${fmt$2(it.suggested_cost)}</strong></td>
        <td style="text-align: center;">${stockTag}</td>
        <td><div style="display: flex; gap: 4px; align-items: center;">${actionCell}</div></td>
      </tr>
    `;
  }).join("");

  container.innerHTML = `
    <table class="data-table" style="margin: 0;">
      <thead>
        <tr>
          <th>#</th>
          <th>Product</th>
          <th class="num" title="Cumulative units sold per peer store during period">Peer units</th>
          <th class="num" title="Per-day velocity at peer stores when SKU sells">Vel /day</th>
          <th class="num">Wholesale</th>
          <th class="num">Case</th>
          <th class="num">Suggested</th>
          <th class="num">Trial cost</th>
          <th>OCS</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  container.querySelectorAll(".sa-action-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const sku = btn.dataset.sku;
      const action = btn.dataset.action;
      const author = ensureAuthor() || "anonymous";
      const row = btn.closest('tr');
      try {
        const res = await fetch(`${API}/api/reorder/suggested-additions/${encodeURIComponent(sku)}/action`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            location_id: locationId, action, author_name: author,
            ...(action === 'snooze' ? { snooze_days: 60 } : {}),
          }),
        });
        if (!res.ok) {
          const err = await res.json();
          alert("Action failed: " + (err.detail || "unknown"));
          return;
        }
        if (action === 'reset') {
          // Undo — restore the row to its normal state.
          loadSuggestedAdditions(locationId);
          if (window._reorderRefetch) window._reorderRefetch();
        } else if (row) {
          // Add / Dismiss / Snooze all grey the row in place (it's handled).
          // Add also refreshes the reorder table so the green trial-add row
          // appears below. Each state shows a label + Undo.
          row.style.opacity = '0.5';
          const todayStr = new Date().toISOString().slice(0, 10);
          const label = action === 'added' ? '<span style="color:#6dab84; font-weight:600;">✓ Added</span>'
                      : `<span style="color:var(--text-dim);" title="Returns to the list in 60 days if still a gap.">Dismissed ${todayStr}</span>`;
          row.querySelector('td:last-child').innerHTML =
            `${label} <button class="btn-link sa-undo-btn" data-sku="${escapeHtml(sku)}" style="font-size: 10px; color: var(--accent); margin-left: 6px;">Undo</button>`;
          row.querySelector('.sa-undo-btn').addEventListener('click', async () => {
            await fetch(`${API}/api/reorder/suggested-additions/${encodeURIComponent(sku)}/action`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ location_id: locationId, action: 'reset', author_name: author }),
            });
            loadSuggestedAdditions(locationId);
            if (window._reorderRefetch) window._reorderRefetch();
          });
          if (action === 'added' && window._reorderRefetch) window._reorderRefetch();
        }
      } catch (e) {
        alert("Action failed: " + e.message);
      }
    });
  });
}
