// Plain-English takeaways from the mix data: where you're under/over-stocked
// in dollars, and where cash is parked in slow categories. Replaces "stare at
// 33 rows and do the math yourself".
function mixTakeawaysHTML(d) {
  const items = d.items || [];
  // Only categories big enough to matter (≥1% of either side).
  const meaningful = items.filter(i => (i.inv_pct >= 1 || i.sales_pct >= 1));
  const unders = meaningful.filter(i => i.drift <= -1.5).sort((a, b) => a.drift - b.drift);
  const overs = meaningful.filter(i => i.drift >= 1.5).sort((a, b) => b.drift - a.drift);
  const slow = meaningful
    .filter(i => i.inv_pct >= 1 && ((i.days_of_supply != null && i.days_of_supply > 90) || (i.days_of_supply == null && i.inv_cost > 500)))
    .sort((a, b) => (b.days_of_supply ?? 9999) - (a.days_of_supply ?? 9999));

  const dollars = v => fmt$(Math.abs(v || 0));
  const dosText = i => i.days_of_supply == null ? 'no sales in window' : `${i.days_of_supply} days of supply`;
  const bullets = [];

  if (unders.length) {
    const top = unders[0];
    const also = unders.slice(1, 3).map(i => `${escapeHtml(i.category)} (${i.drift.toFixed(1)})`).join(', ');
    bullets.push(`<span style="color: var(--critical);">●</span> <strong>Under-stocked: ${escapeHtml(top.category)}</strong> — ${top.sales_pct.toFixed(1)}% of sales but only ${top.inv_pct.toFixed(1)}% of inventory. Matching demand means roughly <strong>+${dollars(top.rebalance_dollars)}</strong> more stock (${dosText(top)} on hand).${also ? ` Also under: ${also}.` : ''}`);
  }
  if (overs.length) {
    const top = overs[0];
    const also = overs.slice(1, 3).map(i => `${escapeHtml(i.category)} (+${i.drift.toFixed(1)})`).join(', ');
    bullets.push(`<span style="color: var(--warning);">●</span> <strong>Over-stocked: ${escapeHtml(top.category)}</strong> — ${top.inv_pct.toFixed(1)}% of inventory (${fmt$(top.inv_cost)}) vs ${top.sales_pct.toFixed(1)}% of sales — about <strong>${dollars(top.rebalance_dollars)}</strong> more than demand supports (${dosText(top)}).${also ? ` Also over: ${also}.` : ''}`);
  }
  if (slow.length) {
    const parts = slow.slice(0, 3).map(i =>
      `<strong>${escapeHtml(i.category)}</strong> (${dosText(i)}, ${fmt$(i.inv_cost)} on hand)`);
    bullets.push(`<span style="color: var(--text-dim);">●</span> <strong>Cash parked:</strong> ${parts.join(' · ')} — discount or transfer candidates; see Dead Stock / Overstock.`);
  }
  if (!unders.length && !overs.length) {
    bullets.push(`<span style="color: #6dab84;">●</span> <strong>Mix is healthy</strong> — no meaningful category drifts more than ±1.5pts from its sales share.`);
  }
  bullets.push(`<span style="color: var(--text-faint);">●</span> The Reorder Report's <strong>Mix-aware</strong> toggle nudges order quantities toward the sales mix automatically — these numbers are what it corrects.`);

  return `
    <div style="padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
      <strong>What this says</strong>
      <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">${d.window_days}-day sales window · categories under 1% share excluded</span>
    </div>
    <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; line-height: 1.5;">
      ${bullets.map(b => `<div>${b}</div>`).join('')}
    </div>
  `;
}

// Paired horizontal bars (inventory share vs sales share) for the categories
// big enough to matter, sorted most-under → most-over. One readable chart
// instead of two 33-slice donuts.
function mixBarsHTML(d) {
  const items = (d.items || [])
    .filter(i => i.inv_pct >= 2 || i.sales_pct >= 2)
    .sort((a, b) => a.drift - b.drift);
  if (!items.length) {
    return '<div style="font-size: 11px; color: var(--text-faint); padding: 24px;">No categories above 2% share.</div>';
  }
  const maxPct = Math.max(...items.map(i => Math.max(i.inv_pct, i.sales_pct)));
  const bar = (pct, color) => `
    <div style="height: 7px; border-radius: 2px; width: ${Math.max(0.5, pct / maxPct * 100)}%; background: ${color};"></div>`;
  const driftBadge = (drift) => {
    const color = drift <= -3 ? 'var(--critical)' : drift >= 3 ? 'var(--warning)' : 'var(--text-dim)';
    return `<span style="color: ${color}; font-family: ui-monospace, Menlo, monospace; font-size: 11px;">${drift >= 0 ? '+' : ''}${drift.toFixed(1)}</span>`;
  };
  const rows = items.map(i => `
    <div style="display: grid; grid-template-columns: 150px 1fr 48px; gap: 10px; align-items: center; padding: 5px 0;"
         title="${escapeHtml(i.category)}: inventory ${i.inv_pct.toFixed(1)}% (${fmt$(i.inv_cost)}) vs sales ${i.sales_pct.toFixed(1)}% — ${i.days_of_supply != null ? i.days_of_supply + ' days of supply' : 'no sales in window'}">
      <div style="font-size: 11px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(i.category)}</div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        ${bar(i.inv_pct, '#6aa6d6')}
        ${bar(i.sales_pct, '#6dab84')}
      </div>
      <div style="text-align: right;">${driftBadge(i.drift)}</div>
    </div>
  `).join('');
  return `
    <div style="display: flex; gap: 16px; font-size: 10px; color: var(--text-dim); margin-bottom: 8px; justify-content: flex-end;">
      <span><span style="display: inline-block; width: 10px; height: 7px; border-radius: 2px; background: #6aa6d6; margin-right: 4px;"></span>Inventory share</span>
      <span><span style="display: inline-block; width: 10px; height: 7px; border-radius: 2px; background: #6dab84; margin-right: 4px;"></span>Sales share</span>
      <span style="margin-left: 8px;">drift →</span>
    </div>
    ${rows}
    <div style="font-size: 10px; color: var(--text-faint); margin-top: 8px;">Sorted most under-stocked → most over-stocked. Categories above 2% share. Hover a row for dollars.</div>
  `;
}

        tooltip: 'Inventory dollars to add (+) or trim (−) for this category to match its sales share. Approximate and directional.',
        render: r => {
          const v = r.rebalance_dollars || 0;
          if (Math.abs(v) < 500) return '<span class="muted">—</span>';
          const color = v > 0 ? 'var(--critical)' : 'var(--warning)';
          return `<span style="color: ${color};">${v > 0 ? '+' : '−'}${fmt$(Math.abs(v))}</span>`;
        } },
    ];

    // Sort: actionable signals first, then by absolute drift magnitude.
    const signalRank = {
      'underweight_major': 0, 'overweight_major': 1,
      'underweight_minor': 2, 'overweight_minor': 3, 'balanced': 4,
    };
    const sortItems = (items) => [...items].sort((a, b) => {
      const ra = signalRank[a.signal] ?? 5;
      const rb = signalRank[b.signal] ?? 5;
      if (ra !== rb) return ra - rb;
      return Math.abs(b.drift) - Math.abs(a.drift);
    });

    const redraw = () => {
      document.getElementById("mix-takeaways").innerHTML = mixTakeawaysHTML(data);
      document.getElementById("mix-chart").innerHTML = mixBarsHTML(data);
      document.getElementById("mix-summary").innerHTML = renderSummary(data);
      const rows = showSmall
        ? data.items
        : data.items.filter(i => i.inv_pct >= 1 || i.sales_pct >= 1 || i.signal !== 'balanced');
      renderTable('mix-table', sortItems(rows), columns, {
        defaultSort: null,
        emptyText: 'No data for this selection.'
      });
      document.getElementById("mix-show-small").addEventListener("change", (e) => {
        showSmall = e.target.checked;
        redraw();
      });
    };
    redraw();

    const refetch = async () => {
      const params = new URLSearchParams();
      const type = document.getElementById("mix-type-filter").value;
      const store = document.getElementById("mix-store-filter").value;
      const days = document.getElementById("mix-days-filter").value;
      if (type) params.set("top_level", type);
      if (store) params.set("store", store);
      if (days) params.set("days", days);
      const tableBox = document.getElementById("mix-table");
      if (tableBox) tableBox.innerHTML = `<div class="loading"><span class="spinner"></span> Updating…</div>`;
      try {
        data = await api(`/api/mix-analysis?${params.toString()}`);
      } catch (e) {
        if (tableBox) tableBox.innerHTML = `<div class="error"><strong>Couldn't load mix analysis</strong>${escapeHtml(e.message || String(e))}</div>`;
        return;
      }
      redraw();
    };

    ["mix-type-filter", "mix-store-filter", "mix-days-filter"].forEach(id => {
      document.getElementById(id).addEventListener("change", refetch);
    });

    document.getElementById("mix-excel-btn").addEventListener("click", () => {
      const params = new URLSearchParams();
      const type = document.getElementById("mix-type-filter").value;
      const store = document.getElementById("mix-store-filter").value;
      const days = document.getElementById("mix-days-filter").value;
      if (type) params.set("top_level", type);
      if (store) params.set("store", store);
      if (days) params.set("days", days);
      downloadUrl(`/api/export/mix-analysis?${params.toString()}`);
    });

  } catch (e) { showError(e); }
}

// Head-to-head price comparison: our shelf price vs Olympus & Beaverton (Bradford).
async function renderPriceComparison(sbStore) {
  const el = document.getElementById("comp-comparison");
  if (!el) return;
  if (!sbStore) {
    el.innerHTML = `<div class="hint-box">Pick a store above to load its competitor price comparison.</div>`;
    return;
  }
  el.innerHTML = `<div class="loading"><span class="spinner"></span> Loading comparison…</div>`;
  try {
    const d = await api(`/api/competitor-comparison?sb_store=${encodeURIComponent(sbStore)}`);
    if (!d.total_count) {
      el.innerHTML = `<div class="hint-box">No competitor data for this store yet.</div>`;
      return;
    }
    const cols = [
      { key: 'competitor', label: 'Competitor',
        render: r => escapeHtml((r.competitor || '').split(' ')[0]) },
      { key: 'brand', label: 'Brand', render: r => escapeHtml(r.brand || '') },
      { key: 'product', label: 'Product', render: r => escapeHtml(r.product || '') },
      { key: 'size', label: 'Size', render: r => escapeHtml(r.size || '') },
      { key: 'their_price', label: 'Their price', type: 'number', align: 'right',
        render: r => r.their_price != null ? fmt$2(r.their_price) : '—' },
      { key: 'our_price', label: 'Our price', type: 'number', align: 'right',
        render: r => r.our_price != null ? fmt$2(r.our_price)
          : '<span style="color:var(--text-dim)">not carried</span>' },
      { key: 'delta', label: 'Δ vs them', type: 'number', align: 'right',
        render: r => r.delta == null ? ''
          : `<span class="tag ${r.we_are_higher ? 'tag-critical' : ''}">${r.delta > 0 ? '+' : ''}${fmt$2(r.delta)}</span>` },
      { key: 'budclub_price', label: 'BudClub −5%', type: 'number', align: 'right',
        render: r => r.budclub_price == null ? ''
          : `${fmt$2(r.budclub_price)} <span class="tag ${r.budclub_higher ? 'tag-critical' : ''}" style="font-size:.85em">${r.budclub_delta > 0 ? '+' : ''}${fmt$2(r.budclub_delta)}</span>` },
      { key: 'rebate_pct', label: 'Rebate (room to cut)', type: 'number', align: 'right',
        render: r => r.rebate_pct
          ? `<span class="tag" style="background:#dcfce7;color:#166534;border:1px solid #86efac">${escapeHtml(r.rebate_collective || '')} ${r.rebate_pct}% · ${fmt$2(r.rebate_room)}</span>`
          : '' },
    ];
    let onlyOverlap = true, compFilter = "";
    const apply = () => {
      // Scope = the selected competitor (or all). The summary counts reflect this
      // scope; the "Overlap only" toggle only changes which rows are shown.
      const scope = compFilter ? d.items.filter(r => r.competitor === compFilter) : d.items;
      const overlapN = scope.filter(r => r.overlap).length;
      const higherN = scope.filter(r => r.we_are_higher).length;
      const primeN = scope.filter(r => r.we_are_higher && r.rebate_pct).length;
      const pct = overlapN ? Math.round(higherN / overlapN * 100) : 0;
      const sum = document.getElementById("cmp-summary");
      if (sum) sum.innerHTML =
        `<ul style="margin: 6px 0 0; padding-left: 18px; line-height: 1.7;">`
        + `<li><strong>${(d.in_stock_count || 0).toLocaleString()}</strong> SKUs in stock currently</li>`
        + `<li>Overlap with them: <strong>${overlapN}</strong></li>`
        + `<li>Overpriced on <strong>${higherN}</strong> (<strong>${pct}%</strong> of overlap)</li>`
        + `<li><strong>${primeN}</strong> overpriced <em>and</em> on a collective rebate — prime to cut</li>`
        + `<li><strong>${scope.length.toLocaleString()}</strong> products on their menu</li>`
        + `</ul>`;
      let rows = onlyOverlap ? scope.filter(r => r.overlap) : scope.slice();
      // overlap first (biggest overprice first), then the rest of their menu
      rows = rows.slice().sort((a, b) =>
        (a.overlap !== b.overlap) ? (a.overlap ? -1 : 1)
          : a.overlap ? ((b.delta || 0) - (a.delta || 0))
          : ((b.their_price || 0) - (a.their_price || 0)));
      renderTable('comp-cmp-table', rows, cols, { emptyText: 'No products match.' });
    };
    el.innerHTML = `
      <div class="section-header" style="margin-bottom: 8px">
        <div>
          <div class="kicker">Price comparison</div>
          <div id="cmp-summary" style="margin: 4px 0 0"></div>
        </div>
        <div class="controls-row">
          <select id="cmp-comp-filter">
            <option value="">All competitors</option>
            ${d.competitors.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")}
          </select>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;cursor:pointer;">
            <input type="checkbox" id="cmp-overlap-only" checked> Overlap only
          </label>
          ${excelButtonHtml("cmp-excel-btn")}
        </div>
      </div>
      <div class="card"><div id="comp-cmp-table"></div></div>`;
    apply();
    document.getElementById("cmp-comp-filter").addEventListener("change", e => { compFilter = e.target.value; apply(); });
    document.getElementById("cmp-overlap-only").addEventListener("change", e => { onlyOverlap = e.target.checked; apply(); });
    document.getElementById("cmp-excel-btn").addEventListener("click", () => {
      const params = new URLSearchParams({ sb_store: sbStore, overlap_only: onlyOverlap ? "true" : "false" });
      if (compFilter) params.set("competitor", compFilter);
      downloadUrl(`/api/export/competitor-comparison?${params.toString()}`);
    });
  } catch (e) {
    el.innerHTML = `<div class="hint-box">Comparison unavailable: ${escapeHtml(String((e && e.message) || e))}</div>`;
  }
}

function renderInvoiceDetail(container, data) {
  const inv = data.invoice;
  const s = data.summary;
  const actualWindow = data.window_days_actual;
  const requestedWindow = data.window_days_requested;
  const windowNote = actualWindow < requestedWindow
    ? ` <span style="color: var(--warning, #c89b32); font-size: 11px;">(only ${actualWindow}d of post-data available — invoice too recent)</span>`
    : '';

  function statCard(label, bucket, color) {
    const st = bucket.sell_through_pct;
    const stColor = st >= 70 ? 'var(--ok, #6a7)' : (st >= 40 ? 'var(--warning, #c89b32)' : 'var(--critical)');
    return `
      <div style="padding: 14px; background: var(--card-bg, #1a1d20); border: 1px solid var(--border); border-radius: 4px; flex: 1;">
        <div style="font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;">${label}</div>
        <div style="font-size: 20px; font-weight: 600; margin-bottom: 4px;">${bucket.lines} lines · ${bucket.units_ordered} units</div>
        <div style="font-size: 11px; color: var(--text-dim);">Sold ${bucket.units_sold}/${bucket.units_ordered} · <span style="color: ${stColor}; font-weight: 600;">${st.toFixed(1)}%</span> sell-through</div>
        <div style="font-size: 11px; color: var(--text-dim);">${bucket.dead_lines} dead lines · ${fmt$(bucket.cost)}</div>
      </div>
    `;
  }

  container.innerHTML = `
    <div class="card" style="padding: 16px; margin-bottom: 14px;">
      <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 8px;">
        Invoice ${inv.invoice_no} · Delivered ${inv.invoice_date} · ${inv.location_id} · Window: ${actualWindow}d post-delivery${windowNote}
      </div>
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        ${statCard('All lines', s.all)}
        ${statCard('Engine-recommended', s.engine_recommended)}
        ${statCard('Manager-only (added beyond engine)', s.manager_only)}
      </div>
    </div>
    <div class="card">
      <div id="oo-lines-table"></div>
    </div>
  `;

  const cols = [
    { key: 'engine_would_recommend', label: 'Source', sortable: true,
      render: r => r.engine_would_recommend
        ? `<span class="tag tag-accent" title="Would have been recommended by the engine">Engine</span>`
        : `<span class="tag" style="background: rgba(180,140,40,0.15); color: #c89b32;" title="Manager added beyond engine recommendation">Manager-only</span>` },
    { key: 'description', label: 'Product',
      render: r => `${escapeHtml(r.description || '')}<div class="sku">${r.ocs_variant} · ${r.category || '—'}</div>` },
    { key: 'units_delivered', label: 'Delivered', type: 'number', align: 'right' },
    { key: 'units_sold_after', label: 'Sold', type: 'number', align: 'right' },
    { key: 'sell_through_pct', label: 'Sell-through', type: 'number', align: 'right',
      render: r => {
        const v = r.sell_through_pct;
        const color = v >= 70 ? 'var(--ok, #6a7)' : (v >= 40 ? 'var(--warning, #c89b32)' : (v > 0 ? 'var(--critical)' : 'var(--text-dim)'));
        return `<span style="color: ${color}; font-weight: 600;">${v.toFixed(1)}%</span>`;
      } },
    { key: 'dead_at_window', label: 'Status', sortable: true,
      render: r => r.dead_at_window
        ? `<span class="tag tag-critical">DEAD</span>`
        : (r.sell_through_pct >= 70 ? `<span class="tag tag-accent">strong</span>` : `<span class="tag">moving</span>`) },
    { key: 'line_total', label: 'Cost', type: 'number', align: 'right',
      render: r => fmt$(r.line_total) },
    { key: 'revenue_after', label: 'Revenue', type: 'number', align: 'right',
      render: r => fmt$(r.revenue_after) },
  ];

  renderTable('oo-lines-table', data.lines, cols, {

        return ratio;

  renderTable('oo-sku-table', r.items, cols, {

    emptyText: 'No SKUs found.'

function exportPartnerCoverageCsv() {
  const data = _pcLastData;
  if (!data) { alert("No data loaded"); return; }
  const rows = [["Partner", "Rate %", "SKUs", "On-hand cost", "Cost share %", "Revenue 30d", "Rev share %", "Est. rebate"]];
  (data.partners || []).forEach(p => rows.push([p.partner, p.rate_value, p.skus, p.onhand_cost, p.cost_share_pct, p.revenue, p.revenue_share_pct, p.est_rebate]));
  rows.push([]);
  rows.push(["Uncovered SKU", "Supplier", "On-hand cost", "Revenue 30d"]);
  (data.uncovered_top || []).forEach(u => rows.push([u.name || u.sku, u.supplier || "", u.onhand_cost, u.revenue]));
  const csv = rows.map(r => r.map(c => `"${String(c == null ? "" : c).replace(/"/g, '""')}"`).join(",")).join("\\n");

  a.download = `partner_coverage_${data.store || "all"}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

let _analyticsLastData = null;

function renderAnalyticsResult(data) {
  _analyticsLastData = data;
  const p = data.period;
  const pp = data.prior_period;
  const clampNote = p.clamped ? ` <span style="color: var(--warning, #c89b32);">(end clamped to available data)</span>` : '';
  let info = `<div style="font-size: 12px;"><strong>Current:</strong> ${p.start} → ${p.end}${p.days ? ` <span style="color: var(--text-dim);">(${p.days} day${p.days === 1 ? '' : 's'})</span>` : ''}${clampNote}`;
  if (pp) info += ` &nbsp;·&nbsp; <strong>Prior year:</strong> ${pp.start} → ${pp.end}`;
  if (p.data_through) info += ` &nbsp;·&nbsp; <span style="color: var(--text-dim);">Sales data through <strong>${p.data_through}</strong></span>`;
  info += `</div>`;
  // Compute coverage from chain total
  const total = data.rows.find(r => r.is_total);
  if (total) {
    const cov = total.current.margin_coverage_pct.toFixed(0);
    info += `<div style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">Margin computed on ${cov}% of revenue (SKUs with wholesale cost mapping).</div>`;
  }
  document.getElementById("an-period-info").innerHTML = info;

  // Build the metrics columns. With YoY, each metric becomes 4 columns: current, prior, $diff, %diff
  const yoy = data.rows.length > 0 && !!data.rows[0].prior;

  const fmt$mini = v => {
    if (v == null) return '—';
    if (Math.abs(v) >= 1000) return '$' + Math.round(v).toLocaleString();
    return '$' + v.toFixed(2);
  };
  const fmtPct = (v, dp=1) => v == null ? '—' : v.toFixed(dp) + '%';
  const fmtNum = v => v == null ? '—' : Math.round(v).toLocaleString();
  const colorDelta = (v, isPctMetric) => {
    if (v == null || v === 0) return '';
    const pos = isPctMetric ? v > 0 : v > 0;
    return `style="color: ${pos ? 'var(--ok, #6a7)' : 'var(--critical)'}"`;
  };

  // Build header
  const metrics = [
    {key: 'gross_sales', label: 'Gross Sales', fmt: fmt$mini, isPct: false},
    {key: 'net_sales', label: 'Net Sales', fmt: fmt$mini, isPct: false},
    {key: 'units', label: 'Units', fmt: fmtNum, isPct: false},
    {key: 'transactions', label: 'Transactions', fmt: fmtNum, isPct: false},
    {key: 'avg_transaction', label: 'Avg Txn $', fmt: v => '$' + (v||0).toFixed(2), isPct: false},
    {key: 'margin_dollars', label: 'GP $', fmt: fmt$mini, isPct: false},
    {key: 'margin_pct', label: 'Margin %', fmt: v => fmtPct(v), isPct: true},
    {key: 'discount_pct', label: 'Discount %', fmt: v => fmtPct(v, 2), isPct: true},
  ];

  // Sticky-cell shorthands: row 1 sits at top:0, row 2 sits beneath it.
  // Pin row heights so the row-2 top offset is exact (no measurement needed).
  const R1H = 36;  // px — height of metric label row
  const R2H = 24;  // px — height of Now/PY/Δ subheader row
  const HDR_BG = 'var(--bg-elev-1, #1a1a1a)';

  let html = '<div style="overflow-x: auto; max-width: 100%;"><table class="data-table" style="border-collapse: separate; border-spacing: 0;"><thead><tr>';
  // Row 1 corner (Store): sticky both axes, highest z-index
  html += `<th style="text-align: left; position: sticky; top: 0; left: 0; background: ${HDR_BG}; z-index: 6; min-width: 160px; height: ${R1H}px;">Store</th>`;
  for (const m of metrics) {
    if (yoy) {
      html += `<th colspan="3" style="text-align: center; border-left: 1px solid var(--border); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; position: sticky; top: 0; background: ${HDR_BG}; z-index: 4; height: ${R1H}px;">${m.label}</th>`;
    } else {
      html += `<th style="text-align: right; position: sticky; top: 0; background: ${HDR_BG}; z-index: 4; height: ${R1H}px;">${m.label}</th>`;
    }
  }
  html += '</tr>';
  if (yoy) {
    // Row 2 corner (blank): sticky both axes, top offset = row 1 height
    html += `<tr><th style="position: sticky; top: ${R1H}px; left: 0; background: ${HDR_BG}; z-index: 6; height: ${R2H}px;"></th>`;
    for (const m of metrics) {
      html += `<th style="text-align: right; font-size: 10px; border-left: 1px solid var(--border); position: sticky; top: ${R1H}px; background: ${HDR_BG}; z-index: 4; height: ${R2H}px;">Now</th>`;
      html += `<th style="text-align: right; font-size: 10px; position: sticky; top: ${R1H}px; background: ${HDR_BG}; z-index: 4; height: ${R2H}px;">PY</th>`;
      html += `<th style="text-align: right; font-size: 10px; position: sticky; top: ${R1H}px; background: ${HDR_BG}; z-index: 4; height: ${R2H}px;">Δ</th>`;
    }
    html += '</tr>';
  }
  html += '</thead><tbody>';

  for (const row of data.rows) {
    const isTotal = row.is_total;
    const rowBg = isTotal ? 'var(--bg-elev-2)' : 'var(--bg-elev-1, #1a1a1a)';
    const trStyle = isTotal ? 'style="font-weight: 600; border-top: 2px solid var(--border);"' : '';
    html += `<tr ${trStyle}>`;
    html += `<td style="text-align: left;${isTotal ? 'font-weight: 600;' : ''} position: sticky; left: 0; background: ${rowBg}; z-index: 3;">${escapeHtml(row.location_name)}</td>`;
    for (const m of metrics) {
      const curr = row.current[m.key];
      if (yoy) {
        const prev = row.prior[m.key];
        const delta = row.delta[m.key];
        html += `<td style="text-align: right; border-left: 1px solid var(--border);">${m.fmt(curr)}</td>`;
        html += `<td style="text-align: right; color: var(--text-dim);">${m.fmt(prev)}</td>`;
        if (m.isPct) {
          const dv = delta.diff;
          const sign = dv > 0 ? '+' : '';
          html += `<td style="text-align: right;" ${colorDelta(dv, true)}>${dv == null ? '—' : sign + dv.toFixed(2) + 'pp'}</td>`;
        } else {
          const dv = delta.pct;
          const sign = dv > 0 ? '+' : '';
          html += `<td style="text-align: right;" ${colorDelta(delta.diff, false)}>${dv == null ? 'n/a' : sign + dv.toFixed(1) + '%'}</td>`;
        }
      } else {
        html += `<td style="text-align: right;">${m.fmt(curr)}</td>`;
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  document.getElementById("an-table").innerHTML = html;
}

function exportAnalyticsAsCsv() {
  if (!_analyticsLastData) { alert("No data loaded"); return; }
  const data = _analyticsLastData;
  const yoy = data.rows.length > 0 && !!data.rows[0].prior;
  const metrics = ['revenue', 'units', 'transactions', 'avg_transaction', 'margin_dollars', 'margin_pct', 'discount_pct'];
  const headers = ['Store'];
  for (const m of metrics) {
    if (yoy) {
      headers.push(`${m} (current)`, `${m} (prior)`, `${m} (delta)`);
    } else {
      headers.push(m);
    }
  }
  const csvRows = [headers];
  for (const row of data.rows) {
    const r = [row.location_name];
    for (const m of metrics) {
      const c = row.current[m] ?? 0;
      r.push(typeof c === 'number' ? c.toFixed(2) : c);
      if (yoy) {
        const p = row.prior[m] ?? 0;
        const d = row.delta[m]?.diff ?? 0;
        r.push(typeof p === 'number' ? p.toFixed(2) : p);
        r.push(typeof d === 'number' ? d.toFixed(2) : d);
      }
    }
    csvRows.push(r);
  }
  const csv = csvRows.map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `analytics_${data.period.start}_to_${data.period.end}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

    { key: 'contact_name', label: 'Contact', render: r => escapeHtml(r.contact_name || '—') },
    { key: 'contact_email', label: 'Email', render: r => escapeHtml(r.contact_email || '—') },
    { key: 'is_active', label: 'Active', render: r => r.is_active ? '<span class="tag tag-accent">Yes</span>' : '<span class="tag">Inactive</span>' },

      render: r => `<button class="btn-link" data-act="del-brand" data-id="${r.id}" data-name="${escapeHtml(r.brand_name)}">Delete</button>` },
  ];

  renderTable('brands-table', brands, cols, { defaultSort: 'brand_name', emptyText: 'No brands yet — add your first.' });

    if (!payload.brand_name) { alert("Brand name required."); return; }

    const btn = e.target;

    await fetch(`/api/brand-partners/${btn.dataset.id}`, { method: "DELETE" });

}

async function renderDealsSection(container) {
  const [brands, deals, me] = await Promise.all([
    api("/api/brand-partners?active_only=true"),
    api("/api/data-revenue-deals"),
    api("/api/auth/me"),
  ]);

  const isAdmin = me && me.logged_in && me.role === 'admin';

  if (brands.length === 0) {
    container.innerHTML = `<div class="card" style="padding: 24px; text-align: center; color: var(--text-dim);">Add a Collective first before creating deals.</div>`;
    return;
  }

  const today = new Date().toISOString().slice(0,10);
  const now = new Date();
  const monthStartIso = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);

  // Format date as "Apr 30, 2026"
  const fmtDealDate = (d) => {
    if (!d) return '<em>open</em>';
    try {
      const dt = new Date(d + 'T00:00:00');
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    } catch { return d; }
  };

  // Parse the import-generated notes format:
  //   "Product Name | Brand: X | LP: Y | DQI: Z" (IRC)
  //   "Product Name | Brand: X | LP: Y | Flag: F" (Canna)
  // Manually-entered free-text notes (no "Brand:"/"LP:" markers) get
  // shoved into Product Name so nothing's hidden.
  function parseDealNotes(notes) {
    if (!notes) return { product: '', brand: '', lp: '' };
    const parts = notes.split('|').map(s => s.trim()).filter(Boolean);
    let product = '', brand = '', lp = '';
    let i = 0;
    // Treat first chunk as Product Name unless it's a key:value marker
    if (parts.length && !/^(Brand|LP|DQI|Flag)\s*:/i.test(parts[0])) {
      product = parts[0]; i = 1;
    }
    for (; i < parts.length; i++) {
      const m = parts[i].match(/^(Brand|LP)\s*:\s*(.+)$/i);
      if (!m) continue;
      if (m[1].toLowerCase() === 'brand') brand = m[2].trim();
      else if (m[1].toLowerCase() === 'lp') lp = m[2].trim();
    }
    // Fallback: if NOTHING parsed (raw freeform note), show entire string as product
    if (!product && !brand && !lp) product = notes;
    return { product, brand, lp };
  }

  // "NEW" badge = created this calendar month
  const isNewThisMonth = (createdAt) => {
    if (!createdAt) return false;
    return String(createdAt).slice(0, 10) >= monthStartIso;
  };

  // Pre-parse notes onto each deal — cell renderers + filters read these
  // instead of re-running the regex on every paint.
  for (const d of deals) {
    const parsed = parseDealNotes(d.notes);
    d._product = parsed.product;
    d._brand   = parsed.brand;
    d._lp      = parsed.lp;
  }

  // Build distinct value lists for the filter dropdowns
  const sortUnique = (arr) => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const distinctCats   = sortUnique(deals.map(d => d.category));
  const distinctVend   = sortUnique(deals.map(d => d._brand));
  const distinctLPs    = sortUnique(deals.map(d => d._lp));
  const labelStyle = 'font-size: 10px; color: var(--text-dim); text-transform: uppercase;';

  // Always-visible filter row (admin + non-admin both get the same filters)
  const filtersCard = `
    <div class="card" style="padding: 12px 16px; margin-bottom: 12px;">
      <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: end;">
        <div><label style="${labelStyle}">Collective</label><br>
          <select id="d-filter-brand" style="min-width: 160px;">
            <option value="">All Collectives</option>
            ${brands.map(b => `<option value="${b.id}">${escapeHtml(b.brand_name)}</option>`).join("")}
          </select></div>
        <div><label style="${labelStyle}">Category</label><br>
          <select id="d-filter-cat" style="min-width: 130px;">
            <option value="">All Categories</option>
            ${distinctCats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")}
          </select></div>
        <div><label style="${labelStyle}">Brand</label><br>
          <select id="d-filter-vendor" style="min-width: 160px;">
            <option value="">All Brands</option>
            ${distinctVend.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join("")}
          </select></div>
        <div><label style="${labelStyle}">LP</label><br>
          <select id="d-filter-lp" style="min-width: 160px;">
            <option value="">All LPs</option>
            ${distinctLPs.map(l => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join("")}
          </select></div>
        <div style="flex: 1; min-width: 200px;"><label style="${labelStyle}">Search (product name or SKU)</label><br>
          <input id="d-filter-text" type="text" placeholder="type to filter..." style="width: 100%;"></div>
        <button id="d-filter-clear" class="btn-link" style="white-space: nowrap;">Clear filters</button>
      </div>
      <div id="d-filter-count" style="font-size: 11px; color: var(--text-dim); margin-top: 8px;"></div>
    </div>`;

  // Read-only admin notice for non-admins; full add-deal form for admins
  const addDealPanel = isAdmin ? `
    <div class="card" style="padding: 16px; margin-bottom: 14px;">
      <div style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px;">Add a Manual Deal</div>
      <div style="display: flex; gap: 8px; align-items: end; flex-wrap: wrap;">
        <div><label style="${labelStyle}">Collective</label><br>
          <select id="d-brand">${brands.map(b => `<option value="${b.id}">${escapeHtml(b.brand_name)}</option>`).join("")}</select></div>
        <div><label style="${labelStyle}">Start</label><br>
          <input id="d-start" type="date" value="${today}"></div>
        <div><label style="${labelStyle}">End (blank = open)</label><br>
          <input id="d-end" type="date"></div>
        <div><label style="${labelStyle}">%</label><br>
          <input id="d-pct" type="number" step="0.1" min="0" max="100" placeholder="3.0" style="width: 80px;"></div>
        <div><label style="${labelStyle}">Basis</label><br>
          <select id="d-basis">
            <option value="retail_sales">% of retail sales</option>
            <option value="wholesale_cost">% of wholesale cost</option>
            <option value="gross_profit">% of gross profit</option>
            <option value="units_sold">% of units sold</option>
          </select></div>
        <div><label style="${labelStyle}">SKU filter (optional)</label><br>
          <input id="d-skus" type="text" placeholder="comma-sep, blank = all" style="width: 220px;"></div>
        <button id="d-add-btn">+ Add deal</button>
      </div>
      <div style="margin-top: 8px; font-size: 11px; color: var(--text-dim);">
        Notes: <input id="d-notes" type="text" placeholder="optional context — e.g. SKU #, LP, product name" style="width: 400px;">
      </div>
    </div>` : `
    <div class="card" style="padding: 10px 16px; margin-bottom: 14px; font-size: 11px; color: var(--text-dim);">
      <strong style="color: var(--text);">Read-only view.</strong>
      Editing collective deals is restricted to admin users — contact an admin if changes are needed.
    </div>`;

  container.innerHTML = `
    ${filtersCard}
    ${addDealPanel}
    <div class="card"><div id="deals-table"></div></div>
  `;

  // Column set. Notes column is split into Product Name / Brand / LP / Category.
  // Delete action only present for admins; non-admins see no actions column.
  // Row renderers read the pre-parsed _product/_brand/_lp set above.
  const cols = [
    { key: 'brand_name', label: 'Collective Name', render: r => escapeHtml(r.brand_name || '?') },
    { key: 'category',   label: 'Category',
      render: r => `<span style="font-size: 11px;">${escapeHtml(r.category || '—')}</span>` },
    { key: 'start_date', label: 'Active Period Start',
      render: r => fmtDealDate(r.start_date) },
    { key: 'end_date',   label: 'Active Period End',
      render: r => r.end_date ? fmtDealDate(r.end_date) : '<em style="color: var(--text-faint);">open</em>' },
    { key: 'percentage', label: '%', type: 'number', align: 'right',
      render: r => `${(r.percentage).toFixed(2)}%` },
    { key: 'basis',      label: 'Basis',
      render: r => {
        const txt = ({ retail_sales: 'Retail $', wholesale_cost: 'Wholesale $',
                       gross_profit: 'GP', units_sold: 'Units' })[r.basis] || r.basis;
        return `<span style="white-space: nowrap;">${escapeHtml(txt)}</span>`;
      } },
    { key: '_product',   label: 'Product Name',
      render: r => {
        const newTag = isNewThisMonth(r.created_at)
          ? `<span style="display: inline-block; background: var(--accent, #4ea1f3); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; letter-spacing: 0.04em;">NEW</span>`
          : '';
        return `<div style="max-width: 260px; font-size: 11px;">${newTag}${escapeHtml(r._product || '—')}</div>`;
      } },
    { key: '_brand',     label: 'Brand',
      render: r => `<span style="font-size: 11px;">${escapeHtml(r._brand || '—')}</span>` },
    { key: '_lp',        label: 'LP',
      render: r => `<span style="font-size: 11px;">${escapeHtml(r._lp || '—')}</span>` },
  ];
  if (isAdmin) {
    cols.push({ key: '__actions', label: '', sortable: false,
      render: r => `<button class="btn-link" data-act="del-deal" data-id="${r.id}">Delete</button>` });
  }

  // Apply ALL filters (Collective + Category + Brand + LP + free-text search)
  const renderFiltered = () => {
    const brandId = document.getElementById("d-filter-brand").value;
    const cat     = document.getElementById("d-filter-cat").value;
    const vendor  = document.getElementById("d-filter-vendor").value;
    const lp      = document.getElementById("d-filter-lp").value;
    const q       = (document.getElementById("d-filter-text").value || '').trim().toLowerCase();

    const filtered = deals.filter(d => {
      if (brandId && String(d.brand_id) !== brandId) return false;
      if (cat    && (d.category || '') !== cat)     return false;
      if (vendor && (d._brand   || '') !== vendor)  return false;
      if (lp     && (d._lp      || '') !== lp)      return false;
      if (q) {
        const hay = `${d._product || ''} ${d.sku_filter || ''} ${d._brand || ''} ${d._lp || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    // Surface filter result count so users see when filters cut deep
    const totalN = deals.length;
    const filtCount = document.getElementById("d-filter-count");
    if (filtCount) {
      filtCount.textContent = (filtered.length === totalN)
        ? `Showing all ${totalN} deals`
        : `Showing ${filtered.length} of ${totalN} deals`;
    }
    renderTable('deals-table', filtered, cols,
      { defaultSort: 'start_date', emptyText: 'No deals match these filters.' });
  };
  renderFiltered();

  // Wire each filter input — change for selects, input for the search box
  for (const id of ['d-filter-brand', 'd-filter-cat', 'd-filter-vendor', 'd-filter-lp']) {
    document.getElementById(id).addEventListener('change', renderFiltered);
  }
  document.getElementById('d-filter-text').addEventListener('input', renderFiltered);
  document.getElementById('d-filter-clear').addEventListener('click', () => {
    document.getElementById('d-filter-brand').value  = '';
    document.getElementById('d-filter-cat').value    = '';
    document.getElementById('d-filter-vendor').value = '';
    document.getElementById('d-filter-lp').value     = '';
    document.getElementById('d-filter-text').value   = '';
    renderFiltered();
  });

  // Admin-only handlers: the add-deal form + delete action only exist for
  // admin viewers, so guard the wiring (querySelector returns null otherwise).
  if (isAdmin) {
    document.getElementById("d-add-btn").addEventListener("click", async () => {
      const pct = parseFloat(document.getElementById("d-pct").value);
      if (isNaN(pct) || pct < 0 || pct > 100) { alert("Percentage must be 0-100"); return; }
      const payload = {
        brand_id: parseInt(document.getElementById("d-brand").value),
        start_date: document.getElementById("d-start").value,
        end_date: document.getElementById("d-end").value || null,
        percentage: pct,
        basis: document.getElementById("d-basis").value,
        sku_filter: document.getElementById("d-skus").value.trim() || null,
        notes: document.getElementById("d-notes").value.trim() || null,
      };
      if (!payload.start_date) { alert("Start date required"); return; }
      try {
        const res = await fetch("/api/data-revenue-deals", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload),
        });
        if (!res.ok) { const e = await res.json(); alert(`Could not add: ${e.detail}`); return; }
        await renderDealsSection(container);
      } catch (e) { alert("Error: " + e.message); }
    });

    document.getElementById("deals-table").addEventListener("click", async (e) => {
      const btn = e.target;
      if (btn.dataset.act !== "del-deal") return;
      if (!confirm("Delete this deal? This cannot be undone.")) return;
      await fetch(`/api/data-revenue-deals/${btn.dataset.id}`, { method: "DELETE" });
      await renderDealsSection(container);
    });
  }
}

    { key: 'lto_type', label: 'Type', render: r => typeLabels[r.lto_type] || r.lto_type },
    { key: 'start_date', label: 'Period', render: r => `${r.start_date} → ${r.end_date}` },
    { key: 'terms', label: 'Terms', sortable: false, render: r => {

    { key: 'sku_count', label: 'SKUs', sortable: false,
      render: r => r.applicable_skus && r.applicable_skus.length > 0
        ? `<span title="${r.applicable_skus.join(', ')}">${r.applicable_skus.length} specific</span>`
        : 'All brand SKUs' },
    { key: 'is_active', label: 'Active', render: r => r.is_active ? '<span class="tag tag-accent">Yes</span>' : '<span class="tag">Off</span>' },

      await renderLtosSection(container);
    } catch (e) { alert("Error: " + e.message); }
  });

  document.getElementById("ltos-table").addEventListener("click", async (e) => {
    const btn = e.target;
    if (btn.dataset.act !== "del-lto") return;
    if (!confirm("Delete this LTO? This cannot be undone.")) return;
    await fetch(`/api/ltos/${btn.dataset.id}`, { method: "DELETE" });
    await renderLtosSection(container);
  });
}

      LPs marked <span class="tag" style="font-size: 9px; padding: 1px 5px; background: rgba(180,140,40,0.15); color: #c89b32;">NEW</span> are visible in OCS catalog but don't have a partnership record yet — click to create one.
    </div>
  `;

  document.getElementById("dp-search").addEventListener("input", () => loadDpList());
  document.getElementById("dp-add-btn").addEventListener("click", addNewLpDialog);
  document.getElementById("dp-seed-btn").addEventListener("click", reseedDialog);
  // Show archived: re-load the currently-shown LP's LTOs (if any)
  document.getElementById("dp-show-archived").addEventListener("change", () => {
    if (_dpCurrentLpId) loadLtosForLp(_dpCurrentLpId);
  });

  await loadDpList();
}

async function loadDpList() {
  const params = new URLSearchParams();
  const searchEl = document.getElementById("dp-search");
  const query = searchEl ? searchEl.value.trim() : "";
  if (query) params.set("search", query);

  const data = await api(`/api/lps-from-catalog?${params.toString()}`);
  const list = document.getElementById("dp-list");

  if (data.items.length === 0) {
    list.innerHTML = `<div style="padding: 24px; color: var(--text-dim); text-align: center; font-size: 12px;">No LPs match the current filters.</div>`;
    return;
  }

  let html = '<table class="data-table" style="table-layout: fixed; width: 100%;"><thead><tr>';
  html += '<th style="text-align: left;">LP / Supplier</th>';
  html += '<th style="text-align: right; width: 60px;" title="SKUs in OCS catalog">SKUs</th>';
  html += '<th style="text-align: right; width: 70px;" title="In stock at OCS">In stock</th>';
  html += '<th style="text-align: right; width: 50px;" title="Active LTOs">LTOs</th>';
  html += '</tr></thead><tbody>';
  for (const item of data.items) {
    const cls = item.lp_id === _dpCurrentLpId ? 'background: var(--bg-elev-2);' : '';
    const inactive = item.has_lp_record && !item.is_active ? ' style="opacity: 0.5;"' : '';
    // For records, lp_id is set; for catalog-only, we use supplier as the key
    const dataAttr = item.lp_id ? `data-lp-id="${item.lp_id}"` : `data-supplier="${escapeHtml(item.supplier)}"`;
    const noRecordTag = item.has_lp_record
      ? ''
      : '<span class="tag" style="font-size: 9px; padding: 1px 5px; background: rgba(180,140,40,0.15); color: #c89b32; margin-left: 6px;" title="No partnership record yet — click to create">NEW</span>';
    html += `<tr ${dataAttr} class="dp-row" style="cursor: pointer; ${cls}"${inactive}>
      <td style="word-wrap: break-word; word-break: break-word;"><strong>${escapeHtml(item.supplier)}</strong>${noRecordTag}</td>
      <td style="text-align: right; font-variant-numeric: tabular-nums;">${item.sku_count || 0}</td>
      <td style="text-align: right; font-variant-numeric: tabular-nums;">${item.in_stock_count || 0}</td>
      <td style="text-align: right;">${item.active_lto_count || 0}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  list.innerHTML = html;
  list.querySelectorAll('.dp-row').forEach(row => {
    row.addEventListener('click', async () => {
      if (row.dataset.lpId) {
        loadLpDetail(parseInt(row.dataset.lpId));
      } else if (row.dataset.supplier) {
        // First-click on a catalog-only supplier: create the LP record, then open detail
        const supplier = row.dataset.supplier;
        try {
          const r = await fetch(`${API}/api/lps/from-supplier`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ supplier }),
          });
          const d = await r.json();
          await loadDpList();
          loadLpDetail(d.id);
        } catch (e) { alert("Failed to create LP record: " + e.message); }
      }
    });
  });
  if (_dpCurrentLpId) loadLpDetail(_dpCurrentLpId);
}

// LTO creator state — selected SKUs are tracked in a Map keyed by ocs_variant
const _ltoSelectedSkus = new Map();

function resetLtoCreator() {
  _ltoSelectedSkus.clear();
  ["lto-name","lto-start","lto-end","lto-rate","lto-notes","lto-sku-search",
   "lto-discount-pct","lto-applies-brand","lto-applies-category","lto-applies-subcategory"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  // Reset scope mode to SKU (the default)
  const skuRadio = document.getElementById("lto-scope-sku");
  if (skuRadio) skuRadio.checked = true;
  const skuUi = document.getElementById("lto-scope-sku-ui");
  if (skuUi) skuUi.style.display = "block";
  const brandUi = document.getElementById("lto-scope-brand-ui");
  if (brandUi) brandUi.style.display = "none";
  document.getElementById("lto-sku-results").style.display = "none";
  document.getElementById("lto-sku-results").innerHTML = "";
  renderSelectedSkus();
}

async function searchSkusForLto(query, supplier) {
  const results = document.getElementById("lto-sku-results");
  try {
    // Note: pass supplier so we filter to this LP's catalog.
    // If no supplier yet (LP without OCS link), search broadly.
    const params = new URLSearchParams({ q: query, limit: "30" });
    if (supplier) params.set("supplier", supplier);
    const data = await api(`/api/ocs-catalog/search?${params.toString()}`);
    if (data.items.length === 0) {
      results.innerHTML = '<div style="padding: 8px; color: var(--text-faint); font-size: 11px;">No matches</div>';
      results.style.display = "block";
      return;
    }
    results.innerHTML = data.items.map(item => `
      <div class="lto-sku-row" data-variant="${escapeHtml(item.ocs_variant_number)}" style="padding: 6px 8px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 11px;" data-name="${escapeHtml(item.product_name)}" data-brand="${escapeHtml(item.brand || '')}" data-size="${escapeHtml(item.size || '')}">
        <div style="display: flex; justify-content: space-between;">
          <div>
            <strong>${escapeHtml(item.product_name)}</strong>
            <span style="color: var(--text-dim);"> · ${escapeHtml(item.brand || '—')}</span>
          </div>
          <span style="color: var(--text-faint); font-size: 10px;">${escapeHtml(item.ocs_variant_number)}</span>
        </div>
        <div style="color: var(--text-faint); font-size: 10px;">${escapeHtml(item.category || '')} · ${escapeHtml(item.size || '')} · ${item.stock_status === 'YES' ? 'In stock' : 'Out of stock'}</div>
      </div>
    `).join("");
    results.style.display = "block";
    results.querySelectorAll(".lto-sku-row").forEach(row => {
      row.addEventListener("click", () => {
        const v = row.dataset.variant;
        if (_ltoSelectedSkus.has(v)) return; // already selected
        _ltoSelectedSkus.set(v, {
          variant: v,
          name: row.dataset.name,
          brand: row.dataset.brand,
          size: row.dataset.size,
        });
        renderSelectedSkus();
      });
    });
  } catch (e) {
    results.innerHTML = `<div class="error" style="padding: 8px; font-size: 11px;">${escapeHtml(e.message)}</div>`;
    results.style.display = "block";
  }
}

function renderSelectedSkus() {
  const container = document.getElementById("lto-selected-skus");
  document.getElementById("lto-sku-count").textContent = _ltoSelectedSkus.size;
  if (_ltoSelectedSkus.size === 0) {
    container.innerHTML = '<span style="color: var(--text-faint);">No SKUs selected yet</span>';
    return;
  }
  container.innerHTML = Array.from(_ltoSelectedSkus.values()).map(s => `
    <span class="tag" style="font-size: 10px; padding: 2px 6px; margin: 2px; display: inline-flex; align-items: center; gap: 4px;">
      ${escapeHtml(s.name)} (${escapeHtml(s.size || '?')})
      <button class="lto-remove-sku" data-variant="${escapeHtml(s.variant)}" style="background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0; font-size: 12px;">×</button>
    </span>
  `).join("");
  container.querySelectorAll(".lto-remove-sku").forEach(btn => {
    btn.addEventListener("click", () => {
      _ltoSelectedSkus.delete(btn.dataset.variant);
      renderSelectedSkus();
    });
  });
}

async function createNewLto(lpId) {
  const name = document.getElementById("lto-name").value.trim();
  const start = document.getElementById("lto-start").value;
  const end = document.getElementById("lto-end").value;
  const rate = parseFloat(document.getElementById("lto-rate").value);
  const basis = document.getElementById("lto-basis").value;
  const discountPctRaw = document.getElementById("lto-discount-pct").value;
  const discountPct = discountPctRaw ? parseFloat(discountPctRaw) : null;
  const notes = document.getElementById("lto-notes").value.trim();
  const scopeMode = (document.querySelector('input[name="lto-scope-mode"]:checked') || {}).value || "sku";

  if (!name) { alert("Name is required"); return; }
  if (!start || !end) { alert("Start and end dates are required"); return; }
  if (isNaN(rate)) { alert("Rate is required"); return; }

  // Scope validation
  let applies_to_brand = null, applies_to_category = null, applies_to_subcategory = null;
  let applicable_skus = [];
  if (scopeMode === "sku") {
    if (_ltoSelectedSkus.size === 0) {
      alert("Select at least one SKU, or switch to Brand scope mode.");
      return;
    }
    applicable_skus = Array.from(_ltoSelectedSkus.keys());
  } else {
    applies_to_brand = document.getElementById("lto-applies-brand").value.trim();
    applies_to_category = document.getElementById("lto-applies-category").value.trim() || null;
    applies_to_subcategory = document.getElementById("lto-applies-subcategory").value.trim() || null;
    if (!applies_to_brand) {
      alert("Brand is required in Brand scope mode.");
      return;
    }
  }

  try {
    const res = await fetch(`${API}/api/lps/${lpId}/ltos`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name, start_date: start, end_date: end,
        rate_percentage: rate, rate_basis: basis,
        discount_pct: discountPct, notes,
        applicable_skus,
        applies_to_brand, applies_to_category, applies_to_subcategory,
      }),
    });
    if (!res.ok) {
      const err = await res.json();
      alert("Failed: " + (err.detail || "unknown"));
      return;
    }
    document.getElementById("dp-lto-creator").style.display = "none";
    resetLtoCreator();
    await loadLtosForLp(lpId);
  } catch (e) { alert("Failed: " + e.message); }
}

async function loadLtosForLp(lpId) {
  const list = document.getElementById("dp-ltos-list");
  if (!list) return;
  try {
    // Honor the archive toggle if it's present (only on the LTOs tab)
    const archEl = document.getElementById("dp-show-archived");
    const includeArchived = archEl && archEl.checked ? "true" : "false";
    const data = await api(`/api/lps/${lpId}/ltos?include_archived=${includeArchived}`);
    if (data.items.length === 0) {
      list.innerHTML = '<div style="color: var(--text-faint); font-size: 11px; padding: 8px;">No LTOs yet for this LP.</div>';
      return;
    }
    const today = new Date().toISOString().slice(0, 10);
    const fmt = (d) => {
      if (!d) return '—';
      try { return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
      catch { return d; }
    };
    list.innerHTML = data.items.map(lto => {
      const isCurrent = lto.start_date <= today && today <= lto.end_date;
      const statusTag = isCurrent
        ? '<span class="tag tag-accent" style="font-size: 9px; padding: 1px 5px;">ACTIVE</span>'
        : (lto.end_date < today
          ? '<span class="tag" style="font-size: 9px; padding: 1px 5px;" title="End date has passed — auto-archived. Toggle &quot;Show archived LTOs&quot; to see all.">ARCHIVED</span>'
          : '<span class="tag tag-info" style="font-size: 9px; padding: 1px 5px;">UPCOMING</span>');
      // Scope description: SKU list vs Brand+Category rule
      let scopeText;
      if (lto.applies_to_brand) {
        const parts = [lto.applies_to_brand];
        if (lto.applies_to_category) parts.push(lto.applies_to_category);
        if (lto.applies_to_subcategory) parts.push(lto.applies_to_subcategory);
        scopeText = `Brand scope: ${parts.join(' / ')}`;

async function saveLpDetail(lpId) {
  const detail = document.getElementById("dp-detail");
  const payload = {};
  detail.querySelectorAll("[data-field]:not(.dp-contact-input)").forEach(el => {
    const key = el.dataset.field;
    if (el.type === "checkbox") payload[key] = el.checked;
    else payload[key] = el.value;
  });
  try {
    const res = await fetch(`/api/lps/${lpId}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const e = await res.json();
      alert(`Save failed: ${e.detail || res.statusText}`); return;
    }
    await loadDpList();
  } catch (e) { alert("Error: " + e.message); }
}

async function deactivateLp(lpId) {
  if (!confirm("Mark this LP as inactive? You can re-activate later.")) return;
  await fetch(`/api/lps/${lpId}`, { method: "DELETE" });
  _dpCurrentLpId = null;
  document.getElementById("dp-detail").innerHTML = '<div style="color: var(--text-dim); font-size: 12px; padding: 40px; text-align: center;">LP deactivated. Click another to view.</div>';
  await loadDpList();
}

async function saveContactInline(lpId, contactId, input) {
  const field = input.dataset.field;
  const value = input.type === "checkbox" ? input.checked : input.value;
  await fetch(`/api/lps/${lpId}/contacts/${contactId}`, {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ [field]: value }),
  });
}

async function addContactInline(lpId) {
  const name = prompt("Contact name?");
  if (!name) return;
  const email = prompt("Email (optional)?") || null;
  const phone = prompt("Phone (optional)?") || null;
  await fetch(`/api/lps/${lpId}/contacts`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, phone }),
  });
  await loadLpDetail(lpId);
}

async function deleteContact(lpId, contactId) {
  if (!confirm("Delete this contact?")) return;
  await fetch(`/api/lps/${lpId}/contacts/${contactId}`, { method: "DELETE" });
  await loadLpDetail(lpId);
}

async function addNewLpDialog() {
  const name = prompt("LP name?");
  if (!name) return;
  try {
    const res = await fetch("/api/lps", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    if (!res.ok) {
      const e = await res.json();
      alert(`Failed: ${e.detail}`); return;
    }
    const data = await res.json();
    _dpCurrentLpId = data.lp_id;
    await loadDpList();
  } catch (e) { alert("Error: " + e.message); }
}

async function reseedDialog() {
  if (!confirm("Re-seed LPs from OCS catalog and master list?\n\nThis preserves your edits — only NULL fields get filled in. New LPs from the OCS catalog will be added.")) return;
  try {
    const res = await fetch("/api/lps/_seed", { method: "POST" });
    const data = await res.json();
    alert(`Seed complete:\n${data.rows_inserted} new LPs\n${data.rows_updated} updated\n${data.contacts_added} new contacts`);

      renderTable('cs-table', filtered, columns, { defaultSort: 'total_revenue_other_stores', defaultDir: 'desc' });

    const refetch = async () => {
      const params = new URLSearchParams();
      _csTargetStore = document.getElementById("cs-target-store").value;

      _csMinStores = document.getElementById("cs-min-stores").value;
      const minVel = document.getElementById("cs-min-velocity").value;
      const type = document.getElementById("cs-type-filter").value;
      if (_csTargetStore) params.set("target_store", _csTargetStore);

      if (_csMinStores) params.set("min_other_stores", _csMinStores);

      const targetLabel = _csTargetStore

      </div>

    const tierTag = (pct, label) => {
      if (pct === null || pct === undefined) return '<span class="tag" style="font-size: 9px; padding: 1px 5px;">—</span>';

      { key: 'regular_price', label: 'Current Price', type: 'number', align: 'right',

        tooltip: '(Discounted price − unit cost) ÷ discounted price. Excludes any rebates.',
        render: r => {
          const m = grossMarginAfterDiscount(r);
          return m == null ? '—' : `${(m * 100).toFixed(1)}%`;
        },
        sortValue: r => grossMarginAfterDiscount(r) ?? -999 },
      { key: 'gross_margin_after_discount_and_rebates', label: 'Margin w/ Rebates', type: 'number', align: 'right',
        tooltip: 'Includes rebate $ per unit from the active deal (collective or future Data Partner). Direct-deal SKUs show without rebate since rates live elsewhere — will fill in once Data Partners agreements are added.',
        render: r => {
          const m = grossMarginAfterDiscountAndRebates(r);
          return m == null ? '—' : `${(m * 100).toFixed(1)}%`;
        },
        sortValue: r => grossMarginAfterDiscountAndRebates(r) ?? -999 },
      { key: 'days_since_last_received', label: 'Days since last received', type: 'number', align: 'right',
        tooltip: 'Days since stock was LAST RESTOCKED at this store (from Cova receipts). Drives the discount tier cascade — older stock gets a bigger discount suggestion.',
        render: r => fmtDays(r.days_since_last_received) },
      { key: 'days_since_first_received', label: 'Days since first stocked', type: 'number', align: 'right',
        tooltip: 'Days since this SKU was FIRST stocked at this store (overall age, regardless of restocks).',
        render: r => fmtDays(r.days_since_first_received) },
      { key: 'days_since_last_sold', label: 'Days since last sold', type: 'number', align: 'right',
        tooltip: 'Days since the LAST SALE of this SKU at this store. Different from "Days since last received" — that measures restock recency, this measures demand recency.',
        render: r => fmtDays(r.days_since_last_sold) },
      { key: 'daily_velocity', label: 'Units/day', type: 'number', align: 'right',
        render: r => (r.daily_velocity || 0).toFixed(2) },
      { key: 'retail_value', label: 'Retail value', type: 'number', align: 'right',
        tooltip: 'Total retail value of stock on hand. Bigger = more financial exposure.',
        render: r => fmt$2(r.retail_value) },
      { key: 'estimated_discount_total', label: 'Est. discount $', type: 'number', align: 'right',
        tooltip: 'Estimated cost if you apply the suggested discount tier across all on-hand units.',
        render: r => r.estimated_discount_total ? fmt$2(r.estimated_discount_total) : '—' },
    ];

    let currentData = [];
    const redraw = () => {
      const q = document.getElementById("promos-search").value.trim().toLowerCase();
      const rebateMode = document.getElementById("promos-rebate-filter").value;
      let filtered = q
        ? currentData.filter(r => (r.product_name || '').toLowerCase().includes(q) || (r.sku || '').toLowerCase().includes(q))
        : currentData;
      if (rebateMode === 'yes') {
        filtered = filtered.filter(r => r.data_fee_pct || r.data_fee_is_direct);
      } else if (rebateMode === 'no') {
        filtered = filtered.filter(r => !r.data_fee_pct && !r.data_fee_is_direct);
      }
      renderTable('promos-table', filtered, columns, { defaultSort: 'retail_value', defaultDir: 'desc' });
    };

    const refetch = async () => {
      const params = new URLSearchParams();
      const store = document.getElementById("promos-store-filter").value;
      const type = document.getElementById("promos-type-filter").value;
      const age = document.getElementById("promos-age-filter").value;
      const vel = document.getElementById("promos-velocity-filter").value;
      if (store) params.set("store", store);
      if (type !== "") params.set("top_level", type);
      else params.delete("top_level");  // both
      if (age) params.set("min_age_days", age);
      if (vel) params.set("max_velocity", vel);

      // Show loading state — spinner in the table area, fade the KPI cards.
      // Same pattern as the Reorder Report so the UX is consistent.
      const tableBox = document.getElementById("promos-table");
      const kpisBox  = document.getElementById("promos-kpis");
      if (tableBox) tableBox.innerHTML = `<div class="loading"><span class="spinner"></span> Updating…</div>`;
      if (kpisBox)  kpisBox.classList.add("is-loading");

      try {
        const data = await api(`/api/suggested-promos?${params.toString()}`);
        currentData = data.items;
        const t = data.totals;
        document.getElementById("promos-kpi-count").textContent  = data.count.toLocaleString();
        document.getElementById("promos-kpi-retail").textContent = fmt$(t.retail_value_at_risk);
        document.getElementById("promos-kpi-disc").textContent   = fmt$(t.estimated_discount_total);
        redraw();
      } finally {
        // redraw() already replaced the table contents on success; only clear
        // the KPI fade. On failure, the loading text remains so the user sees
        // the request didn't complete — matches showError behavior elsewhere.
        if (kpisBox) kpisBox.classList.remove("is-loading");
      }
    };

    document.getElementById("promos-search").addEventListener("input", redraw);
    // Rebate filter only affects local filtering, not refetch
    document.getElementById("promos-rebate-filter").addEventListener("change", redraw);
    ["promos-store-filter","promos-type-filter","promos-age-filter","promos-velocity-filter"].forEach(
      id => document.getElementById(id).addEventListener("change", refetch));

    await refetch();
  } catch (e) { showError(e); }
}

// ========================================================================
// OCS Catalogue — searchable product list with manager ratings/reviews
// ========================================================================
// Browse the full OCS catalog (~5,400 SKUs). Search by name/brand/category.
// Click a row to open a detail panel with ratings (1-10 per manager) and
// free-text comments. Aggregate avg rating shows on each row.
//
// Author name persists in localStorage so managers don't have to re-enter it.

let _ocsAuthor = null;

function getAuthor() {
  if (_ocsAuthor) return _ocsAuthor;
  try {
    _ocsAuthor = localStorage.getItem('ocs-author') || null;
  } catch (e) { /* private mode */ }
  return _ocsAuthor;
}
function setAuthor(name) {
  _ocsAuthor = name;
  try { localStorage.setItem('ocs-author', name); } catch (e) {}
}
function ensureAuthor() {
  // Prefer the logged-in user's identity so ratings/comments are automatically
  // attributed — no manual name prompt. Falls back to the stored/typed name
  // only in bootstrap mode (no users yet).
  if (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.logged_in) {
    const who = _currentUser.name || _currentUser.email;
    if (who) return who;
  }
  let a = getAuthor();
  if (!a) {
    a = (prompt("Your name (so other managers know who left this rating/comment):") || "").trim();
    if (a) setAuthor(a);
  }
  return a;
}

// 1-10 rating displayed as 5-star plus half-star equivalent. Tooltip shows
// the underlying 1-10 score. Empty stars for unrated.
function ratingDisplay(avg, count) {
  if (!count || avg <= 0) {
    return '<span style="color: var(--text-faint); font-size: 11px;">unrated</span>';
  }
  const score = Math.round(avg * 10) / 10;  // 1 decimal
  let cls = 'tag';
  if (score >= 8) cls = 'tag tag-accent';
  else if (score >= 6) cls = 'tag tag-info';
  else if (score >= 4) cls = 'tag';
  else cls = 'tag tag-warning';
  return `<span class="${cls}" style="font-size: 11px; padding: 2px 6px;" title="Average across ${count} ratings">${score.toFixed(1)} <span style="opacity:0.6;">(${count})</span></span>`;
}

// Format the OCS catalogue's MAX(as_of) for the kicker line. The DB column
// is a SQLite-style datetime string (e.g. "2026-06-04 23:12:41") — render
// as "Jun 4, 2026, 11:12 PM" so freshness is at a glance.
function fmtCatalogueAsOf(ts) {
  if (!ts) return '—';
  try {
    // Normalize space → 'T' so Date parses across browsers.
    const iso = String(ts).replace(' ', 'T');
    const d = new Date(iso);
    if (isNaN(d.getTime())) return ts;
    return d.toLocaleString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit',
    });
  } catch { return ts; }
}

        </div>
        <div class="controls-row">

          <select id="ocs-category">
            <option value="">All categories</option>

          </select>

            <option value="instock">In stock at OCS</option>

            <option value="name">Sort: Name</option>
            <option value="brand">Sort: Brand</option>
            <option value="category">Sort: Category</option>
            <option value="rating">Sort: Top rated</option>
            <option value="rating_count">Sort: Most rated</option>
          </select>

      </div>

      <div style="display: grid; grid-template-columns: 1fr 380px; gap: 14px;">
        <div class="card">
          <div id="ocs-count" style="font-size: 11px; color: var(--text-dim); padding: 4px 16px 12px;">${data.count} SKUs</div>
          <div class="table-scroll sticky-cols-1" id="ocs-table"></div>

        <div class="card" id="ocs-detail" style="padding: 16px; max-height: 80vh; overflow-y: auto;">
          <div style="color: var(--text-faint); font-size: 11px; text-align: center; padding: 32px;">
            Click any product to see ratings &amp; comments
          </div>
        </div>
      </div>
    `;

    const fmtThc = (lo, hi) => {
      if (lo == null && hi == null) return '—';
      if (lo === hi) return `${lo}%`;
      return `${lo ?? '?'}–${hi ?? '?'}%`;
    };

    const columns = [
      { key: 'brand', label: 'Brand',
        render: r => escapeHtml(r.brand || '—') },
      { key: 'product_name', label: 'Product',
        render: r => `${rebateBadgeHtml(r)}${escapeHtml(r.product_name)}<div class="sku">${r.ocs_variant_number}</div>` },
      { key: 'category', label: 'Category',
        render: r => r.subcategory ? `${r.category}<div class="sku">${r.subcategory}</div>` : (r.category || '—') },
      { key: 'size', label: 'Size', render: r => r.size || '—' },
      { key: 'thc_min', label: 'THC%', type: 'number', align: 'right',
        render: r => fmtThc(r.thc_min, r.thc_max),
        sortValue: r => r.thc_max || r.thc_min || 0 },
      { key: 'unit_price', label: 'Wholesale Cost', type: 'number', align: 'right',

            return `<span class="tag" style="background: rgba(70, 140, 90, 0.18); color: #6dab84; border-color: rgba(80, 160, 100, 0.45); font-weight: 600;" title="${tip}">Flow-Through${tier}</span>`;
          }
          // Back in stock IS available -> show plain Yes (detail lives in the
          // Order Fill column next to it).
          if (r.stock_status === 'YES' || r.order_fill_back_in_stock) return '<span class="tag tag-accent">Yes</span>';
          if (r.stock_status === 'NO')  return '<span class="tag tag-critical" style="font-weight:600;">No</span>';
          return '<span class="tag">?</span>';

      { key: 'order_fill_detail', label: 'Order Fill', sortable: false,
        tooltip: "Notable flags from this week's OCS Order Fill: Back in Stock = recently restocked; New = newly listed.",
        render: r => {
          const tags = [];
          if (r.order_fill_back_in_stock) tags.push('<span class="tag" style="background: rgba(80, 140, 200, 0.18); color: #6da2d6; border-color: rgba(100, 160, 220, 0.45); font-size: 9px; padding: 1px 5px;" title="Back in stock at OCS this Order Fill run">Back in Stock</span>');
          if (r.order_fill_new_arrival) tags.push('<span class="tag" style="background: rgba(214, 180, 70, 0.18); color: #d6b446; border-color: rgba(220, 190, 80, 0.45); font-size: 9px; padding: 1px 5px;" title="Newly listed in the latest Order Fill">New Product</span>');
          return tags.length ? tags.join(' ') : '<span class="muted">—</span>';
        } },
      { key: 'avg_rating', label: 'Rating', type: 'number', align: 'right',
        tooltip: 'Average rating across all managers (1-10).',
        render: r => ratingDisplay(r.avg_rating, r.rating_count) },
      { key: 'comment_count', label: 'Comments', type: 'number', align: 'right',
        render: r => r.comment_count || '' },
    ];

    let currentItems = data.items;
    const draw = () => {
      renderTable('ocs-table', currentItems, columns, { defaultSort: 'product_name', emptyText: 'No products match these filters.' });
      // Wire up row clicks → open detail
      document.querySelectorAll('#ocs-table tbody tr').forEach((tr, i) => {
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', () => loadOcsDetail(currentItems[i].cova_sku || currentItems[i].ocs_variant_number));
      });
    };
    draw();
    document.getElementById("ocs-count").textContent = `${data.count} SKUs`;

    const refetch = async () => {
      const params = new URLSearchParams();
      const search = document.getElementById("ocs-search").value.trim();
      const cat = document.getElementById("ocs-category").value;
      const br = document.getElementById("ocs-brand").value;
      const stock = document.getElementById("ocs-stock").value;
      const rated = document.getElementById("ocs-rated").value;
      const sort = document.getElementById("ocs-sort").value;
      if (search) params.set("search", search);
      if (cat) params.set("category", cat);
      if (br) params.set("brand", br);
      if (stock === "instock") params.set("in_stock_only", "true");
      if (rated === "rated") params.set("has_ratings", "true");
      if (rated === "unrated") params.set("has_ratings", "false");
      if (sort) params.set("sort", sort);
      params.set("limit", "500");
      const d = await api(`/api/ocs-catalogue?${params.toString()}`);
      currentItems = d.items;
      document.getElementById("ocs-count").textContent = `${d.count} SKUs`;
      draw();
    };

    // Debounce search
    let searchTimer;
    document.getElementById("ocs-search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(refetch, 280);
    });
    ["ocs-category","ocs-brand","ocs-stock","ocs-rated","ocs-sort"].forEach(
      id => document.getElementById(id).addEventListener("change", refetch));
    document.getElementById("ocs-set-author").addEventListener("click", () => {
      const n = (prompt("Your name:", getAuthor() || "") || "").trim();
      if (n) {
        setAuthor(n);
        document.getElementById("ocs-author-display").textContent = n;
      }
    });
  } catch (e) { showError(e); }
}

    panel.innerHTML = `
      <div style="margin-bottom: 12px;">
        <h3 style="font-family: Georgia, serif; font-weight: 400; margin: 0 0 4px;">${escapeHtml(p.name || p.product_name || sku)}</h3>

        <div style="font-size: 22px; font-family: Georgia, serif;">${data.aggregate.avg_rating || '—'}<span style="font-size: 12px; color: var(--text-dim); margin-left: 8px;">/ 10 (${data.aggregate.rating_count} ratings)</span></div>
      </div>

      <div style="margin-bottom: 16px;">
        <div style="font-size: 10px; text-transform: uppercase; color: var(--text-faint); letter-spacing: 0.1em; margin-bottom: 8px;">Your Rating</div>

        <button id="save-rating" class="btn" style="margin-top: 6px; font-size: 11px;">Save your rating</button>

      ${data.ratings.length > 0 ? `
      <div style="margin-bottom: 16px;">
        <div style="font-size: 10px; text-transform: uppercase; color: var(--text-faint); letter-spacing: 0.1em; margin-bottom: 8px;">All Ratings (${data.ratings.length})</div>

          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author_name: author, rating, notes }),

          method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
