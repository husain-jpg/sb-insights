          addReorderBtn.disabled = false;
        }
      } catch (e) { status.style.color = "#d66464"; status.textContent = "Failed: " + e.message; addReorderBtn.disabled = false; }
    });

    document.getElementById("add-comment").addEventListener("click", async () => {
      const author = ensureAuthor();
      if (!author) return;
      const text = document.getElementById("new-comment").value.trim();
      if (!text) return;
      const target = p.sku || p.ocs_variant_number;
      try {
        await fetch(`${API}/api/ocs-catalogue/${encodeURIComponent(target)}/comment`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author_name: author, body: text }),
        });
        await loadOcsDetail(target);
      } catch (e) { alert("Failed to post: " + e.message); }
    });

    document.querySelectorAll('.delete-comment').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm("Delete this comment?")) return;
        try {
          await fetch(`${API}/api/ocs-catalogue/comment/${btn.dataset.id}`, { method: 'DELETE' });
          await loadOcsDetail(p.sku || p.ocs_variant_number);
        } catch (e) { alert("Failed to delete: " + e.message); }
      });
    });
  } catch (e) {
    panel.innerHTML = `<div class="error" style="font-size: 11px; padding: 16px;">Couldn't load: ${escapeHtml(e.message)}</div>`;
  }
}

// ========================================================================
// Monthly Reports — package Cova exports for collective partners
// ========================================================================
// User workflow: download Cova exports per store per month, drop them into
// imports/monthly_reports/{YYYY-MM}/{StoreName}/, then come here to package
// + download the zip ready to email to the collective.
//
// Per-collective filtering will be added once we know what each collective
// actually wants (waiting on user's historical examples).

// ============================================================================
// Data LP Partners — ongoing rebate agreements with brands/LPs.
// Distinct from collectives (per-SKU rebates via IRCC/CC/Seeker) and LTOs
// (time-bound promos). These are open-ended arrangements: "this brand pays
// us X% of Y month after month."
// ============================================================================

async function renderDataLpPartners() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading"><span class="spinner"></span> Loading data lp partners…</div>`;
  try {
    const data = await api("/api/data-lp-partners?include_inactive=true");
    const lpBrands = await api("/api/data-lp-partners/lp-brands").catch(() => ({ suppliers: [], brands_by_supplier: {} }));
    // Re-key the OCS supplier→brand map to clean display names + a normalized
    // lookup, so the picker shows tidy LP names while matching stays robust.
    const lpDisplay = {};       // norm -> clean display name
    const lpBrandsByNorm = {};  // norm -> brands[]
    for (const raw of (lpBrands.suppliers || [])) {
      const n = normLp(raw);
      lpDisplay[n] = titleCaseLp(raw);
      lpBrandsByNorm[n] = lpBrands.brands_by_supplier[raw] || [];
    }
    const lpOptionList = Object.values(lpDisplay).sort((a, b) => a.localeCompare(b));
    let selectedBrands = [];   // brands chosen for the agreement being edited ([] = all)
    const RATE_TYPE_LABELS = {
      pct_wholesale: "% of wholesale cost",
      pct_retail: "% of retail sales",
      pct_gross_margin: "% of gross margin",
      flat_per_month: "Flat $/month",
      flat_per_unit: "Flat $/unit sold",
    };
    const fmtRate = (rt, val) => {
      if (!rt) return "—";
      if (rt.startsWith("pct_")) return `${(val || 0).toFixed(1)}%`;
      if (rt === "flat_per_month") return `$${(val || 0).toFixed(2)}/mo`;
      if (rt === "flat_per_unit") return `$${(val || 0).toFixed(4)}/unit`;
      return String(val);
    };
    const fmtDate = (d) => {
      if (!d) return "—";
      try { return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
      catch { return d; }
    };
    const today = new Date().toISOString().slice(0, 10);

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div>
          <div class="kicker">Ongoing Rebate Agreements</div>
          <h2 style="white-space: nowrap;">Data LP Partners</h2>
        </div>
        <div class="controls-row">
          <input type="search" id="dlp-search" placeholder="Search partner name…" style="min-width: 180px;">
          <select id="dlp-filter-status">
            <option value="active" selected>Active only</option>
            <option value="all">All (incl. inactive)</option>
            <option value="inactive">Inactive only</option>
          </select>
          <button id="dlp-add-btn" class="btn btn-primary">+ New Agreement</button>
        </div>
      </div>

      <div class="hint-box">
        <strong>What's this tab?</strong> Track ongoing rebate agreements with brands/LPs.
        These are <strong>different from</strong> Data Collectives (IRCC/CC/Seeker, per-SKU rebates via a third-party program) and <strong>different from</strong> LTOs (time-bound promotions).
        These are open-ended arrangements: "Spinach pays us 5% of wholesale every month."
        <br><br>
        <strong>Hierarchy:</strong> LTOs and Data LP Partners stack with each other. If a SKU has both, both contribute to your effective margin. When either is present, Data Collective rebates are NOT applied for that SKU.
      </div>

      <div class="card">
        <div id="dlp-list" style="padding: 0;"></div>
      </div>

      <!-- Create / Edit dialog -->
      <div id="dlp-dialog" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="card" style="width: 520px; padding: 20px;">
          <h3 id="dlp-dialog-title" style="margin: 0 0 14px 0; font-size: 16px;">New Data LP Partner Agreement</h3>
          <input type="hidden" id="dlp-id" value="">
          <div style="display: grid; gap: 8px;">
            <label style="font-size: 11px; color: var(--text-dim);">Licensed Producer (LP)
              <input type="text" id="dlp-lp" list="dlp-lp-options" autocomplete="off" placeholder="Search LP… e.g. ORGANIGRAM INC." style="width: 100%; margin-top: 4px;">
              <datalist id="dlp-lp-options">${lpOptionList.map(s => `<option value="${escapeHtml(s)}"></option>`).join('')}</datalist>
            </label>
            <label style="font-size: 11px; color: var(--text-dim);">Brands under this LP
              <span style="color: var(--text-faint);">— leave blank to cover ALL brands under this LP</span>
              <div style="display: flex; gap: 6px; margin-top: 4px;">
                <input type="text" id="dlp-brand-input" list="dlp-brand-options" autocomplete="off" placeholder="Type a brand, then Add (or Enter)" style="flex: 1;" disabled>
                <datalist id="dlp-brand-options"></datalist>
                <button type="button" class="btn" id="dlp-brand-add" style="font-size: 11px;" disabled>Add</button>
              </div>
              <div id="dlp-brand-chips" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;"></div>
            </label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              <label style="font-size: 11px; color: var(--text-dim);">Rate type
                <select id="dlp-rate-type" style="width: 100%; margin-top: 4px;">
                  <option value="pct_wholesale">% of wholesale cost</option>
                  <option value="pct_retail">% of retail sales</option>
                  <option value="pct_gross_margin">% of gross margin</option>
                  <option value="flat_per_month">Flat $/month</option>
                  <option value="flat_per_unit">Flat $/unit sold</option>
                </select>
              </label>
              <label style="font-size: 11px; color: var(--text-dim);">Rate value
                <input type="number" id="dlp-rate-value" step="0.01" min="0" placeholder="e.g. 5.0" style="width: 100%; margin-top: 4px;">
              </label>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              <label style="font-size: 11px; color: var(--text-dim);">Start date
                <input type="date" id="dlp-start-date" value="${today}" style="width: 100%; margin-top: 4px;">
              </label>
              <label style="font-size: 11px; color: var(--text-dim);">End date (optional — leave blank for open-ended)
                <input type="date" id="dlp-end-date" style="width: 100%; margin-top: 4px;">
              </label>
            </div>
            <label style="font-size: 11px; color: var(--text-dim);">Notes (optional)
              <input type="text" id="dlp-notes" placeholder="Anything to remember about this deal" style="width: 100%; margin-top: 4px;">
            </label>
            <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px;">
              <input type="checkbox" id="dlp-is-active" checked> Active
            </label>
          </div>
          <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px;">
            <button class="btn-link" id="dlp-cancel-btn">Cancel</button>
            <button class="btn btn-primary" id="dlp-save-btn">Save</button>
          </div>
        </div>
      </div>
    `;

    let lpForChips = "";   // the LP that selectedBrands currently belong to

    const renderBrandChips = () => {
      const wrap = document.getElementById("dlp-brand-chips");
      if (!wrap) return;
      if (!selectedBrands.length) {
        wrap.innerHTML = '<span style="font-size: 11px; color: var(--text-faint);">All brands under this LP</span>';
        return;
      }
      wrap.innerHTML = selectedBrands.map((b, i) =>
        `<span class="tag" style="font-size: 10px; padding: 2px 6px; display: inline-flex; align-items: center; gap: 4px;">${escapeHtml(b)}<button type="button" data-i="${i}" class="dlp-chip-x" style="background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0; font-size: 13px; line-height: 1;">×</button></span>`
      ).join('');
      wrap.querySelectorAll(".dlp-chip-x").forEach(x => x.addEventListener("click", () => {
        selectedBrands.splice(parseInt(x.dataset.i), 1);
        renderBrandChips();
      }));
    };

    const refreshBrandPicker = (lp) => {
      const brands = lpBrandsByNorm[normLp(lp)] || [];
      const dl = document.getElementById("dlp-brand-options");
      if (dl) dl.innerHTML = brands.map(b => `<option value="${escapeHtml(b)}"></option>`).join('');
      const has = (lp || "").trim().length > 0;
      const inp = document.getElementById("dlp-brand-input");
      const btn = document.getElementById("dlp-brand-add");
      if (inp) { inp.disabled = !has; inp.placeholder = has ? "Type a brand, then Add (or Enter)" : "Pick an LP first"; }
      if (btn) btn.disabled = !has;
    };

    const addBrand = () => {
      const inp = document.getElementById("dlp-brand-input");
      const v = (inp.value || "").trim();
      if (!v) return;
      if (!selectedBrands.includes(v)) selectedBrands.push(v);
      inp.value = "";
      renderBrandChips();
    };

    const renderList = () => {
      const q = document.getElementById("dlp-search").value.trim().toLowerCase();
      const status = document.getElementById("dlp-filter-status").value;
      let items = data.items.slice();
      if (status === "active") items = items.filter(a => a.is_active);
      if (status === "inactive") items = items.filter(a => !a.is_active);
      if (q) items = items.filter(a =>
        (a.partner_name || "").toLowerCase().includes(q) ||
        (a.scope_value || "").toLowerCase().includes(q)
      );
      const list = document.getElementById("dlp-list");
      if (items.length === 0) {
        list.innerHTML = '<div style="padding: 32px; text-align: center; color: var(--text-dim); font-size: 12px;">No agreements found. Click <strong>+ New Agreement</strong> to add one.</div>';
        return;
      }
      list.innerHTML = `
        <table style="width: 100%;">
          <thead>
            <tr>
              <th>Partner</th>
              <th>Scope</th>
              <th>Rate</th>
              <th>Active period</th>
              <th>Status</th>
              <th style="width: 100px;"></th>
            </tr>
          </thead>
          <tbody>
            ${items.map(a => `
              <tr ${a.is_active ? '' : 'style="opacity: 0.6;"'}>
                <td><strong>${escapeHtml(titleCaseLp(a.partner_name))}</strong>${a.notes ? `<div class="sku">${escapeHtml(a.notes)}</div>` : ''}</td>
                <td>${a.scope_type === 'lp'
                  ? '<span class="tag tag-accent" style="font-size: 9px; padding: 1px 5px;">All brands</span>'
                  : (a.scope_value || '').split(',').map(b => `<span class="tag" style="font-size: 9px; padding: 1px 5px; margin: 1px;">${escapeHtml(b.trim())}</span>`).join('')}</td>
                <td>${fmtRate(a.rate_type, a.rate_value)} <div class="sku">${RATE_TYPE_LABELS[a.rate_type] || a.rate_type}</div></td>
                <td>${fmtDate(a.start_date)} → ${fmtDate(a.end_date) || 'open-ended'}</td>
                <td>${a.is_active
                  ? '<span class="tag tag-accent" style="font-size: 9px; padding: 1px 5px;">ACTIVE</span>'
                  : '<span class="tag" style="font-size: 9px; padding: 1px 5px;">INACTIVE</span>'}</td>
                <td style="text-align: right;">
                  <button class="btn-link dlp-edit-btn" data-id="${a.id}" style="font-size: 10px;">Edit</button>
                  <button class="btn-link dlp-del-btn" data-id="${a.id}" style="font-size: 10px; color: var(--critical);">Delete</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
      list.querySelectorAll(".dlp-edit-btn").forEach(b => b.addEventListener("click", () => openDialog(parseInt(b.dataset.id))));
      list.querySelectorAll(".dlp-del-btn").forEach(b => b.addEventListener("click", () => deleteDlp(parseInt(b.dataset.id))));
    };

    const openDialog = (id = null) => {
      const dlg = document.getElementById("dlp-dialog");
      dlg.style.display = "flex";
      document.getElementById("dlp-id").value = id || "";
      if (id) {
        document.getElementById("dlp-dialog-title").textContent = "Edit Agreement";
        const a = data.items.find(x => x.id === id);
        if (!a) return;
        const lp = a.partner_name || "";
        document.getElementById("dlp-lp").value = lp;
        selectedBrands = (a.scope_type === 'brand' && a.scope_value)
          ? a.scope_value.split(',').map(s => s.trim()).filter(Boolean) : [];
        lpForChips = lp;
        document.getElementById("dlp-rate-type").value = a.rate_type || "pct_wholesale";
        document.getElementById("dlp-rate-value").value = a.rate_value != null ? a.rate_value : "";
        document.getElementById("dlp-start-date").value = a.start_date || today;
        document.getElementById("dlp-end-date").value = a.end_date || "";
        document.getElementById("dlp-notes").value = a.notes || "";
        document.getElementById("dlp-is-active").checked = !!a.is_active;
      } else {
        document.getElementById("dlp-dialog-title").textContent = "New Data LP Partner Agreement";
        ["dlp-rate-value","dlp-end-date","dlp-notes"].forEach(i => {
          document.getElementById(i).value = "";
        });
        document.getElementById("dlp-lp").value = "";
        selectedBrands = [];
        lpForChips = "";
        document.getElementById("dlp-rate-type").value = "pct_wholesale";
        document.getElementById("dlp-start-date").value = today;
        document.getElementById("dlp-is-active").checked = true;
      }
      document.getElementById("dlp-brand-input").value = "";
      refreshBrandPicker(document.getElementById("dlp-lp").value);
      renderBrandChips();
    };

    const closeDialog = () => {
      document.getElementById("dlp-dialog").style.display = "none";
    };

    const saveDlp = async () => {
      const id = document.getElementById("dlp-id").value;
      const lp = document.getElementById("dlp-lp").value.trim();
      const payload = {
        partner_name: lp,
        // No brands chosen → the agreement covers ALL brands under the LP.
        scope_type: selectedBrands.length ? "brand" : "lp",
        scope_value: selectedBrands.length ? selectedBrands.join(", ") : lp,
        rate_type: document.getElementById("dlp-rate-type").value,
        rate_value: parseFloat(document.getElementById("dlp-rate-value").value),
        start_date: document.getElementById("dlp-start-date").value,
        end_date: document.getElementById("dlp-end-date").value || null,
        notes: document.getElementById("dlp-notes").value.trim() || null,
        is_active: document.getElementById("dlp-is-active").checked,
      };
      if (!payload.partner_name) {
        alert("Pick a Licensed Producer (LP).");
        return;
      }
      if (isNaN(payload.rate_value) || !payload.start_date) {
        alert("Rate value and start date are required.");
        return;
      }
      const url = id ? `/api/data-lp-partners/${id}` : `/api/data-lp-partners`;
      const method = id ? "PUT" : "POST";
      try {
        const res = await fetch(`${API}${url}`, {
          method, headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const err = await res.json();
          alert("Failed: " + (err.detail || "unknown"));
          return;
        }
        closeDialog();
        renderDataLpPartners();  // reload everything
      } catch (e) { alert("Failed: " + e.message); }
    };

    const deleteDlp = async (id) => {
      const a = data.items.find(x => x.id === id);
      if (!confirm(`Delete agreement with ${a ? a.partner_name : 'this partner'}?\nThis cannot be undone.`)) return;
      try {
        const res = await fetch(`${API}/api/data-lp-partners/${id}`, { method: "DELETE" });
        if (!res.ok) { alert("Failed to delete"); return; }
        renderDataLpPartners();
      } catch (e) { alert("Failed: " + e.message); }
    };

    // Wire up
    document.getElementById("dlp-search").addEventListener("input", renderList);
    document.getElementById("dlp-filter-status").addEventListener("change", renderList);
    document.getElementById("dlp-add-btn").addEventListener("click", () => openDialog());
    const lpInput = document.getElementById("dlp-lp");
    lpInput.addEventListener("input", e => refreshBrandPicker(e.target.value));
    lpInput.addEventListener("change", e => {
      // Committing a different LP resets the brand scope (brands are LP-specific).
      const v = e.target.value.trim();
      if (v !== lpForChips) { selectedBrands = []; lpForChips = v; renderBrandChips(); }
      refreshBrandPicker(v);
    });
    document.getElementById("dlp-brand-add").addEventListener("click", addBrand);
    document.getElementById("dlp-brand-input").addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); addBrand(); }
    });
    document.getElementById("dlp-save-btn").addEventListener("click", saveDlp);
    document.getElementById("dlp-cancel-btn").addEventListener("click", closeDialog);
    document.getElementById("dlp-dialog").addEventListener("click", e => {
      if (e.target.id === "dlp-dialog") closeDialog();
    });

    renderList();
  } catch (e) { showError(e); }
}

                        </div>
                      `).join("")}
                    </div>

            // Re-wire the per-store package buttons that were just added
            wireUpPackageButtons();

          }
        } else {
          row.style.display = "none";
          btn.textContent = "View files";

    });

    // Top-level package buttons (per-month "all stores")
    wireUpPackageButtons();

    function wireUpPackageButtons() {
      document.querySelectorAll(".mr-package-btn").forEach(btn => {
        if (btn.dataset.wired === "1") return;
        btn.dataset.wired = "1";
        btn.addEventListener("click", () => {
          const month = btn.dataset.month;
          const store = btn.dataset.store || "";
          // Find the matching collective dropdown for THIS month
          const select = document.querySelector(`select.mr-collective[data-month="${month}"]`);
          const collective = select ? select.value : "";
          const params = new URLSearchParams();
          if (store) params.set("store", store);
          if (collective) params.set("collective", collective);
          downloadUrl(`/api/monthly-reports/${month}/package?${params.toString()}`);
        });
      });
    }
  } catch (e) { showError(e); }
}

// ========================================================================
// Market Intelligence — OCS regional/municipal benchmarks
// ========================================================================
// Two views toggleable via tabs:
//   1. Gap Report — top municipality SKUs you don't carry
//   2. Performance Comparison — SKUs you carry, your velocity vs peer avg
//
// Honest caveats baked into UI: stale data warning, "top regional ≠ right
// for your customers" hint, period mismatch if comparing across imports.

let _miCurrentStore = null;
let _miCurrentView = "gap";  // 'gap' | 'comparison' | 'imports'
let _miWindow = 30;          // selected lookback window in days (30 = recommended)
let _miCategory = "";        // selected subcategory filter ('' = all)
let _miIncludeCarried = false; // gap view: also show SKUs we already carry
let _miDealFilter = "";      // '' | 'any' | 'collective' | 'lp' | 'lto'
let _miImportId = null;      // import_id resolved from the selected store + window

// Resolve the selected store+window to a concrete import. The Power BI connector
// pulls several rolling windows (14/30/90/180) each run, each landing as its own
// import tagged with period_days. Pick the newest import matching _miWindow;
// fall back to 30, then the largest available, then just the newest import.
function _miResolveImport(importsByStore) {
  const imps = (importsByStore[_miCurrentStore] || []).slice()
    .sort((a, b) => String(b.imported_at || '').localeCompare(String(a.imported_at || '')));
  const avail = [...new Set(imps.map(i => i.period_days).filter(d => d != null))].sort((a, b) => a - b);
  if (avail.length && !avail.includes(_miWindow)) {
    _miWindow = avail.includes(30) ? 30 : avail[avail.length - 1];
  }
  const sel = (avail.length ? imps.find(i => i.period_days === _miWindow) : imps[0]) || imps[0] || null;
  _miImportId = sel ? sel.id : null;
  return { imps, avail, sel };
}

// Age (in days) of an imported_at timestamp, or null if unparseable.
function _dataAgeDays(importedAt) {
  if (!importedAt) return null;
  const t = new Date(String(importedAt).replace(' ', 'T')).getTime();
  if (isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
// Colored freshness banner for Market Intelligence (manual 30-day-window
// reports). Green ≤14d, amber 15–30d, red >30d.
function miFreshnessBanner(importedAt, periodEnd, periodDays) {
  const age = _dataAgeDays(importedAt);
  if (age == null) return '';
  const d = String(importedAt).slice(0, 10);
  const win = periodDays ? `${periodDays}-day` : 'trailing 30-day';
  let fg, bg, icon, msg;
  if (age <= 14) {
    fg = '#6dab84'; bg = 'rgba(80,160,100,.10)'; icon = '✓';
    msg = `Up to date — imported ${d} (${age} day${age === 1 ? '' : 's'} ago).`;
  } else if (age <= 30) {
    fg = '#c89b32'; bg = 'rgba(200,155,50,.12)'; icon = '⚠';
    msg = `Getting stale — imported ${d} (${age} days ago). Time to refresh from OCS.`;
  } else {
    fg = '#d66464'; bg = 'rgba(214,100,100,.12)'; icon = '⚠';
    msg = `Stale — imported ${d} (${age} days ago). Refresh from OCS recommended; suggestions below may be out of date.`;
  }
  const period = periodEnd ? ` Covers a ${win} window ending ${String(periodEnd).slice(0,10)}.` : '';
  return `<div style="padding:10px 14px; border-radius:6px; background:${bg}; border:1px solid ${fg}55; color:${fg}; font-size:12px; margin-bottom:14px;"><strong>${icon} Market Intelligence: </strong>${msg}${period}</div>`;
}

    // Fetch imports list to populate store dropdown

    // /api/locations returns a flat array, not {locations: [...]}.
    // Defensive: handle either shape just in case.
    const locsRaw = await api("/api/locations").catch(() => []);
    const stores = { locations: Array.isArray(locsRaw) ? locsRaw : (locsRaw.locations || []) };
    const folders = await api("/api/market-intelligence/folders").catch(() => ({ folders: [] }));

    // Group imports by location to find latest per store
    const importsByStore = {};
    for (const imp of (data.items || [])) {
      if (!importsByStore[imp.location_id]) importsByStore[imp.location_id] = [];
      importsByStore[imp.location_id].push(imp);
    }

    // Pick a default store if none chosen yet — prefer a store with data
    if (!_miCurrentStore && data.items && data.items.length > 0) {
      _miCurrentStore = data.items[0].location_id;
    }
    // Fallback: if our selected store has no data, switch to one that does
    if (_miCurrentStore && !importsByStore[_miCurrentStore] && data.items && data.items.length > 0) {

    const { avail: miAvail, sel: miSel } = _miResolveImport(importsByStore);

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div>
          <div class="kicker">OCS Regional & Municipal Benchmarks</div>

        </div>
        <div class="controls-row">
          <select id="mi-store-select">
            ${stores.locations.map(loc => {

      <div id="mi-content"></div>

    document.getElementById("mi-store-select").addEventListener("change", e => {

    const hasImports = data.items && data.items.length > 0;

    if (!hasImports && !hasFolders) {

  } catch (e) { showError(e); }
}

async function loadMiContent() {
  if (_miCurrentView === "imports") {
    return loadMiImportsView();
  }
  if (!_miCurrentStore) {
    document.getElementById("mi-content").innerHTML = '<div class="card" style="padding: 24px; color: var(--text-dim); font-size: 12px;">Pick a store above.</div>';
    return;
  }
  if (_miCurrentView === "gap") {
    return loadMiGapView();
  }
  if (_miCurrentView === "comparison") {
    return loadMiComparisonView();
  }
}

// Populate the category dropdown from a complete subcategory list (returned by
// the endpoint regardless of the active filter), preserving the current pick.
function _miFillCategories(subcats) {
  const sel = document.getElementById("mi-category-select");
  if (!sel) return;
  sel.innerHTML = ['<option value="">All categories</option>']
    .concat((subcats || []).map(s =>
      `<option value="${escapeHtml(s)}" ${s === _miCategory ? 'selected' : ''}>${escapeHtml(s)}</option>`))
    .join('');
  sel.value = _miCategory;
}

// Purple tag for a SKU whose LP/brand has an active Data LP Partner agreement.
function miLpPartnerTag(partner) {
  const name = titleCaseLp(partner);
  return `<span class="tag" style="font-size: 9px; padding: 1px 5px; background: rgba(140,100,180,0.15); color: #a78bd9; border: 1px solid rgba(160,110,200,0.4);" title="Active Data LP Partner rebate agreement with ${escapeHtml(name)}">${escapeHtml(name)}</span>`;
}

// Tags for every active deal program a SKU is on: Collective (green), LP Partner
// (purple), LTO (amber).
function miDealTags(r) {
  const tags = [];
  if (r.collective) tags.push(`<span class="tag" style="font-size: 9px; padding: 1px 5px; background: rgba(80,180,100,0.15); color: #6fcf85; border: 1px solid rgba(90,200,110,0.4);" title="On an active collective rebate">${escapeHtml(r.collective)}</span>`);
  if (r.lp_partner) tags.push(miLpPartnerTag(r.lp_partner));
  if (r.lto) tags.push(`<span class="tag" style="font-size: 9px; padding: 1px 5px; background: rgba(214,180,70,0.18); color: #d6b446; border: 1px solid rgba(220,190,80,0.45);" title="On an active LTO">${escapeHtml(typeof r.lto === 'string' ? r.lto : 'LTO')}</span>`);
  return tags.join(' ');
}

function _miParams(limit) {
  const p = new URLSearchParams({ location_id: _miCurrentStore, limit: String(limit) });
  if (_miImportId) p.set('import_id', _miImportId);
  if (_miCategory) p.set('subcategory', _miCategory);
  if (_miDealFilter) p.set('deal_filter', _miDealFilter);
  return p;
}

    const [imports, folders, locsRaw] = await Promise.all([

      api("/api/market-intelligence/folders"),
      api("/api/locations").catch(() => []),
    ]);
    const locs = Array.isArray(locsRaw) ? locsRaw : (locsRaw.locations || []);

    const pendingFolders = folders.folders.filter(f => f.file_count > 0);
    const todayIso = new Date().toISOString().slice(0, 10);

    container.innerHTML = `
      <div class="card" style="margin-bottom: 16px;">
        <div style="padding: 14px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
          <strong>⬆ Upload reports from your computer</strong>
          <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">No server access needed — export the two files from OCS Power BI and drop them here.</span>
        </div>
        <div style="padding: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;">
          <label style="font-size: 11px; color: var(--text-dim);">Store<br>
            <select id="mi-up-store" style="margin-top: 4px;">
              ${locs.map(l => `<option value="${l.id}">${escapeHtml(l.short_name || l.name)}</option>`).join('')}
            </select>
          </label>
          <label style="font-size: 11px; color: var(--text-dim);">Report end date<br>
            <input type="date" id="mi-up-date" value="${todayIso}" max="${todayIso}" style="margin-top: 4px;">
          </label>
          <label style="font-size: 11px; color: var(--text-dim);" title="The window you selected in OCS when exporting. Metadata only — keep it consistent across stores (30 days recommended).">Window<br>
            <select id="mi-up-window" style="margin-top: 4px;">
              <option value="7">7 days</option>
              <option value="14">14 days</option>
              <option value="30" selected>30 days</option>
              <option value="60">60 days</option>
              <option value="90">90 days</option>
            </select>
          </label>
          <label style="font-size: 11px; color: var(--text-dim);">Files (both: Average Sales Units + Sales Velocity)<br>
            <input type="file" id="mi-up-files" accept=".xlsx,.xls" multiple style="margin-top: 4px;">
          </label>
          <button class="btn btn-primary" id="mi-up-btn" style="font-size: 11px;">Upload &amp; Import</button>
          <span id="mi-up-status" style="font-size: 11px; color: var(--text-dim);"></span>
        </div>
      </div>

      <div class="card" style="margin-bottom: 16px;">
        <div style="padding: 14px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2); display: flex; justify-content: space-between; align-items: center;">
          <div>
            <strong>Folders ready to import</strong>
            <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">${pendingFolders.length} folder(s) found</span>
          </div>
          ${pendingFolders.length > 1 ? `
            <button class="btn" id="mi-import-all-btn" style="font-size: 11px;">⚡ Import all (${pendingFolders.length})</button>
          ` : ''}
        </div>
        ${pendingFolders.length === 0 ? `
          <div style="padding: 16px; color: var(--text-dim); font-size: 12px;">
            No folders found. Drop OCS exports into <code style="background: var(--bg-elev-2); padding: 1px 6px;">imports/market_intelligence/{YYYY-MM-DD}/{StoreName}/</code>.
          </div>
        ` : `
          <table style="font-size: 12px;">
            <thead><tr><th>Date</th><th>Store</th><th>Files</th><th></th></tr></thead>
            <tbody>
              ${pendingFolders.map(f => `
                <tr>
                  <td>${f.date}</td>
                  <td><strong>${escapeHtml(f.store_name)}</strong></td>
                  <td style="font-size: 10px; color: var(--text-dim);">${f.files.map(escapeHtml).join('<br>')}</td>
                  <td><button class="btn mi-import-btn" data-date="${f.date}" data-store="${escapeHtml(f.store_name)}" style="font-size: 11px;">Import</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `}
      </div>

      <div class="card">
        <div style="padding: 14px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
          <strong>Import history</strong>
        </div>
        ${imports.items.length === 0 ? `
          <div style="padding: 16px; color: var(--text-dim); font-size: 12px;">No imports yet.</div>
        ` : `
          <table style="font-size: 11px;">
            <thead><tr><th>Imported</th><th>Store</th><th>Period</th><th class="num">SKUs</th><th>Municipality</th></tr></thead>
            <tbody>
              ${imports.items.map(imp => `
                <tr>
                  <td style="color: var(--text-dim);">${imp.imported_at}</td>
                  <td><strong>${escapeHtml(imp.store_name || imp.location_id)}</strong></td>
                  <td>${imp.period_start || '?'} → ${imp.period_end || '?'} (${imp.period_days || '?'}d)</td>
                  <td class="num">${imp.sku_count}</td>
                  <td>${imp.has_municipality ? 'Yes' : '<span style="color: var(--text-faint);">No (Innisfil-style)</span>'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `}
      </div>
    `;

    const upBtn = document.getElementById("mi-up-btn");
    if (upBtn) upBtn.addEventListener("click", async () => {
      const store = document.getElementById("mi-up-store").value;
      const date = document.getElementById("mi-up-date").value;
      const files = document.getElementById("mi-up-files").files;
      const status = document.getElementById("mi-up-status");
      if (!date) { status.textContent = "Pick a report end date."; status.style.color = "#d66464"; return; }
      if (!files || files.length < 2) { status.textContent = "Select BOTH files (Average Sales Units + Sales Velocity)."; status.style.color = "#d66464"; return; }
      const fd = new FormData();
      fd.append("location_id", store);
      fd.append("date", date);
      fd.append("window_days", document.getElementById("mi-up-window").value);
      for (const f of files) fd.append("files", f);
      upBtn.disabled = true; upBtn.textContent = "Uploading…";
      status.style.color = "var(--text-dim)"; status.textContent = "Uploading + importing…";
      try {
        const res = await fetch(`${API}/api/market-intelligence/upload`, { method: "POST", body: fd, credentials: "include" });
        const result = await res.json().catch(() => ({}));
        if (!res.ok) { status.style.color = "#d66464"; status.textContent = "Failed: " + (result.detail || "unknown"); upBtn.disabled = false; upBtn.textContent = "Upload & Import"; return; }
        status.style.color = "#6dab84";
        status.textContent = `✓ Imported ${result.sku_count} SKUs for ${result.store} (${result.has_municipality ? 'with' : 'no'} municipality data).`;
        await loadMiImportsView();
      } catch (e) {
        status.style.color = "#d66464"; status.textContent = "Failed: " + e.message;
        upBtn.disabled = false; upBtn.textContent = "Upload & Import";
      }
    });

    document.querySelectorAll(".mi-import-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "Importing...";
        try {
          const res = await fetch(`${API}/api/market-intelligence/import`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: btn.dataset.date, store_name: btn.dataset.store }),
          });
          if (!res.ok) {
            const err = await res.json();
            alert("Import failed: " + (err.detail || "unknown"));
            btn.disabled = false;
            btn.textContent = "Import";
            return;
          }
          const result = await res.json();
          alert(`Imported ${result.sku_count} SKUs for ${result.store_name}.`);
          await loadMiImportsView();
        } catch (e) {
          alert("Import failed: " + e.message);
          btn.disabled = false;
          btn.textContent = "Import";
        }
      });
    });

    // Bulk "Import all" button — processes every pending folder in one call.
    // Continues on per-folder failures rather than aborting the whole batch.
    const allBtn = document.getElementById("mi-import-all-btn");
    if (allBtn) {
      allBtn.addEventListener("click", async () => {
        if (!confirm(`Import all ${pendingFolders.length} pending folders?`)) return;
        allBtn.disabled = true;
        allBtn.textContent = "Importing all...";
        try {
          const res = await fetch(`${API}/api/market-intelligence/import-all`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
          });
          if (!res.ok) {
            const err = await res.json();
            alert("Bulk import failed: " + (err.detail || "unknown"));
            allBtn.disabled = false;
            allBtn.textContent = `⚡ Import all (${pendingFolders.length})`;
            return;
          }
          const result = await res.json();
          // Build a summary of what happened
          const lines = [`Bulk import complete:`, ``,
                         `✓ Imported: ${result.success_count}`,
                         result.fail_count ? `✗ Failed: ${result.fail_count}` : null,
                         result.skip_count ? `· Skipped: ${result.skip_count}` : null,
                        ].filter(Boolean);
          if (result.fail_count > 0) {
            lines.push("", "Failures:");
            for (const r of result.results.filter(x => x.status === "error")) {
              lines.push(`  ${r.date} / ${r.store_name}: ${r.error}`);
            }
          }
          alert(lines.join("\n"));
          await loadMiImportsView();
        } catch (e) {
          alert("Bulk import failed: " + e.message);
          allBtn.disabled = false;
          allBtn.textContent = `⚡ Import all (${pendingFolders.length})`;
        }
      });
    }
  } catch (e) {
    container.innerHTML = `<div class="error" style="padding: 16px;">${escapeHtml(e.message)}</div>`;
  }
}

// ========================================================================
// User identity pane (sidebar footer) + logout
// ========================================================================
let _currentUser = null;

async function loadCurrentUser() {
  try {
    const res = await fetch("/api/auth/me", { credentials: "include" });
    const data = await res.json();
    _currentUser = data;
    renderUserPane(data);
    // Hide nav entries this role can't open, then collapse any group left with
    // no visible items. Works for all three tiers off PAGE_ACCESS/ROLE_RANK.
    document.querySelectorAll("nav button[data-page]").forEach(b => {
      b.style.display = canAccessPage(b.dataset.page) ? "" : "none";
    });
    document.querySelectorAll(".nav-group").forEach(grp => {
      const items = grp.querySelectorAll('.nav-group-items button[data-page]');
      const anyVisible = [...items].some(b => b.style.display !== "none");
      grp.style.display = anyVisible ? "" : "none";
    });
  } catch (e) {
    document.getElementById("user-pane-content").innerHTML = '<span style="color: var(--critical);">Auth error</span>';
  }
}

function renderUserPane(data) {
  const pane = document.getElementById("user-pane-content");
  if (!pane) return;
  if (data.bootstrap_mode) {
    pane.innerHTML = `
      <div style="font-size: 11px;">
        <strong style="color: var(--accent);">⚠ Bootstrap mode</strong>
        <div style="color: var(--text-dim); margin-top: 4px;">
          No users yet. Run<br><code style="background: var(--bg-elev-2); padding: 1px 6px;">py create_admin.py</code><br>to set up first admin.
        </div>
      </div>
    `;
    return;
  }
  if (!data.logged_in) {
    pane.innerHTML = `<a href="/login" style="color: var(--accent);">Sign in</a>`;
    return;
  }
  pane.innerHTML = `
    <div style="font-weight: 600; color: var(--text);">${escapeHtml(data.name || data.email)}</div>
    <div style="font-size: 10px;">${escapeHtml(data.email)} · ${escapeHtml(data.role)}</div>
    <button id="logout-btn" style="margin-top: 6px; background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0; font-size: 10px; text-decoration: underline;">Sign out</button>
  `;
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
    window.location.href = "/login";
  });
}

// ========================================================================
// Users — admin user management
// ========================================================================
function roleLabel(role) {
  return role === 'admin' ? 'Admin' : role === 'gm' ? 'General Manager' : 'Store Manager';
}

async function renderUsers() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading"><span class="spinner"></span> Loading users…</div>`;
  try {
    const data = await api("/api/users");
    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <div>
            <div class="kicker">Admin · Authentication</div>
            <h2 style="white-space: nowrap;">Users</h2>
          </div>
          <button class="btn btn-primary" id="users-add-btn">+ Add user</button>
        </div>
      </div>

      <div class="hint-box" style="margin-bottom: 14px;">
        <strong>Roles</strong> (set per user, change anytime via the dropdown — the last active admin can't be demoted):<br>
        • <strong>Admin</strong> — full access: financials, system settings, users, credentials, connectors.<br>
        • <strong>General Manager</strong> — full operational dashboard <em>plus</em> financials (Collectives, LTOs, LP Partners, Monthly Reports) and <em>read-only</em> System Settings. No user management, credentials, or system config.<br>
        • <strong>Store Manager</strong> — operational dashboard only (inventory, reorder, promos, mix, market intel, competitor pricing). No financials, no settings.<br>
        <strong>Adding users:</strong> set a temporary password (min 12 chars) — the user must change it on first login. Share it through a secure channel (in person, encrypted message), not email.
      </div>

      <div class="card">
        <table style="font-size: 12px; margin: 0;">
          <thead>
            <tr><th>Email</th><th>Name</th><th>Role</th><th>Status</th><th>Last login</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.items.map(u => `
              <tr>
                <td><strong>${escapeHtml(u.email)}</strong></td>
                <td>${escapeHtml(u.name || '—')}</td>
                <td><span class="tag" style="font-size: 9px;">${roleLabel(u.role)}</span></td>
                <td>${u.is_active ? '<span style="color: #6dab84;">Active</span>' : '<span style="color: var(--text-faint);">Disabled</span>'}${u.must_change_password ? ' · <span style="color: var(--accent);">must change pw</span>' : ''}</td>
                <td style="font-size: 11px; color: var(--text-dim);">${u.last_login_at || 'Never'}</td>
                <td>
                  <button class="btn-link user-reset-btn" data-id="${u.id}" data-email="${escapeHtml(u.email)}" style="font-size: 10px;">Reset pw</button>
                  <select class="user-role-select" data-id="${u.id}" data-email="${escapeHtml(u.email)}" data-current="${u.role === 'gm' ? 'gm' : (u.role === 'admin' ? 'admin' : 'manager')}"
                          title="Change this user's access level" style="font-size: 10px; padding: 1px 4px;">
                    <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                    <option value="gm" ${u.role === 'gm' ? 'selected' : ''}>General Manager</option>
                    <option value="manager" ${(u.role !== 'admin' && u.role !== 'gm') ? 'selected' : ''}>Store Manager</option>
                  </select>
                  ${u.is_active ? `<button class="btn-link user-deactivate-btn" data-id="${u.id}" data-email="${escapeHtml(u.email)}" style="font-size: 10px; color: var(--critical);">Disable</button>` : `<button class="btn-link user-reactivate-btn" data-id="${u.id}" style="font-size: 10px; color: #6dab84;">Re-enable</button>`}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    document.getElementById("users-add-btn").addEventListener("click", async () => {
      const email = prompt("Email for new user:");
      if (!email) return;
      const name = prompt("Display name (optional):") || "";
      const roleIn = (prompt("Role — 'admin' (full), 'gm' (General Manager: + financials & read-only settings), or 'manager' (Store Manager: operations only):", "manager") || "manager").trim().toLowerCase();
      const role = (roleIn === "admin" || roleIn === "gm") ? roleIn : "manager";
      const tempPw = prompt("Temp password (min 12 chars). User will be forced to change on first login:");
      if (!tempPw || tempPw.length < 12) { alert("Password too short"); return; }
      try {
        const res = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, name, role, temp_password: tempPw }),
        });
        const result = await res.json();
        if (!res.ok) { alert("Failed: " + (result.detail || "unknown")); return; }
        alert(`User created. Share these with them:\n\nEmail: ${email}\nTemp password: ${tempPw}\n\nThey'll change it on first login.`);
        renderUsers();
      } catch (e) { alert("Error: " + e.message); }
    });

    document.querySelectorAll(".user-reset-btn").forEach(b => {
      b.addEventListener("click", async () => {
        const tempPw = prompt(`Reset password for ${b.dataset.email}. Enter new temp password (min 12 chars):`);
        if (!tempPw || tempPw.length < 12) { alert("Password too short"); return; }
        const res = await fetch(`/api/users/${b.dataset.id}/reset-password`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ temp_password: tempPw }),
        });
        if (res.ok) {
          alert(`Password reset. Share this with the user:\n\nEmail: ${b.dataset.email}\nTemp password: ${tempPw}`);
          renderUsers();
        } else { alert("Failed"); }
      });
    });

    document.querySelectorAll(".user-role-select").forEach(sel => {
      sel.addEventListener("change", async () => {
        const target = sel.value;
        const blurb = {
          admin: "Full access: financials, user management, credentials, and settings.",
          gm: "General Manager: full dashboard + financials (Collectives, LTOs, LP Partners, Monthly Reports) and read-only System Settings. No user management, credentials, or system config.",
          manager: "Store Manager: operational dashboard only — no Admin pages (financials) and no Settings.",
        }[target];
        if (!confirm(`Set ${sel.dataset.email} to ${roleLabel(target)}?\n\n${blurb}`)) {
          sel.value = sel.dataset.current;  // revert the dropdown
          return;
        }
        const res = await fetch(`/api/users/${sel.dataset.id}/role`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role: target }),
        });
        const result = await res.json().catch(() => ({}));
        if (res.ok) renderUsers();
        else { alert("Failed: " + (result.detail || "unknown")); sel.value = sel.dataset.current; }
      });
    });

    document.querySelectorAll(".user-deactivate-btn").forEach(b => {
      b.addEventListener("click", async () => {
        if (!confirm(`Disable ${b.dataset.email}? Their sessions will end immediately.`)) return;
        const res = await fetch(`/api/users/${b.dataset.id}/deactivate`, {
          method: "POST", credentials: "include",
        });
        if (res.ok) renderUsers(); else alert("Failed");
      });
    });

    document.querySelectorAll(".user-reactivate-btn").forEach(b => {
      b.addEventListener("click", async () => {
        const res = await fetch(`/api/users/${b.dataset.id}/reactivate`, {
          method: "POST", credentials: "include",
        });
        if (res.ok) renderUsers(); else alert("Failed");
      });
    });
  } catch (e) { showError(e); }
}

                ${locs.map(l => `<option value="${l.id}">${escapeHtml(l.short_name || l.name)} (${l.id})</option>`).join("")}
              </select>
            </div>
            <div>
              <label style="display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;">OrderExport (.xlsx)</label>
              <input type="file" id="ocs-imp-file" accept=".xlsx" style="font-size: 12px;">
            </div>
            <button class="btn btn-primary" id="ocs-imp-run" style="height: 34px;">Import</button>
            <span id="ocs-imp-status" style="font-size: 11px; color: var(--text-dim);"></span>
          </div>
          <div style="font-size: 11px; color: var(--text-dim); margin-top: 8px;">
            Per-store. Updates that store's flow-through / back-in-stock availability on the Reorder Report. The connector normally does this automatically each evening.
          </div>
        </div>
      </div>
    `;

    const setStatus = (id, msg, ok) => {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.color = ok === true ? "#6dab84" : ok === false ? "var(--critical)" : "var(--text-dim)";
    };

    document.getElementById("ocs-save").addEventListener("click", async () => {
      const body = {
        base_url: document.getElementById("ocs-base-url").value.trim(),
        username: document.getElementById("ocs-username").value.trim(),
        order_fill_format: document.getElementById("ocs-format").value.trim() || "Packs",
        is_active: document.getElementById("ocs-active").checked,
      };
      const pw = document.getElementById("ocs-password").value;
      if (pw) body.password = pw;
      setStatus("ocs-save-status", "Saving...");
      try {
        const res = await fetch("/api/ocs/config", { method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (res.ok) setStatus("ocs-save-status", "Saved.", true);
        else { const e = await res.json(); setStatus("ocs-save-status", "Failed: " + (e.detail || "?"), false); }
      } catch (e) { setStatus("ocs-save-status", "Error: " + e.message, false); }
    });

    document.getElementById("ocs-test").addEventListener("click", async () => {
      setStatus("ocs-action-status", "Testing login...");
      try {
        const res = await fetch("/api/ocs/test-login", { method: "POST", credentials: "include" });
        const d = await res.json();
        setStatus("ocs-action-status", d.ok ? "Login OK." : "Login failed: " + (d.error || d.detail || "?"), !!d.ok);
      } catch (e) { setStatus("ocs-action-status", "Error: " + e.message, false); }
    });

    document.getElementById("ocs-run").addEventListener("click", async () => {
      setStatus("ocs-action-status", "Running sync (this can take a minute)...");
      try {
        const res = await fetch("/api/ocs/run-now", { method: "POST", credentials: "include" });
        const d = await res.json();
        if (d.status === "ok") setStatus("ocs-action-status", `Done. Imported: ${(d.imported || []).join(', ') || 'nothing'}`, true);
        else if (d.status === "skipped") setStatus("ocs-action-status", "Skipped: " + (d.reason || "inactive"), null);
        else setStatus("ocs-action-status", "Error: " + (d.error || d.detail || "?"), false);
      } catch (e) { setStatus("ocs-action-status", "Error: " + e.message, false); }
    });

    document.getElementById("ocs-fetch-retailers").addEventListener("click", async () => {
      setStatus("ocs-action-status", "Fetching retailer list...");
      try {
        const res = await fetch("/api/ocs/retailers", { credentials: "include" });
        const d = await res.json();
        if (!d.ok) { setStatus("ocs-action-status", "Failed: " + (d.error || d.detail || "?"), false); return; }
        setStatus("ocs-action-status", `Found ${d.retailers.length} retailer(s) — map each to a store, then Save mapping.`, true);
        renderOcsRetailerMap(d.retailers, cfg.store_map || []);
      } catch (e) { setStatus("ocs-action-status", "Error: " + e.message, false); }
    });

    // Manual Order Fill import (fallback)
    const impRun = document.getElementById("ocs-imp-run");
    if (impRun) impRun.addEventListener("click", async () => {
      const file = document.getElementById("ocs-imp-file").files[0];
      const store = document.getElementById("ocs-imp-store").value;
      if (!file) { setStatus("ocs-imp-status", "Select an OrderExport_*.xlsx file.", false); return; }
      if (!store) { setStatus("ocs-imp-status", "Pick the store this Order Fill is for.", false); return; }
      setStatus("ocs-imp-status", "Importing\\u2026");
      impRun.disabled = true;
      try {
        const fd = new FormData();
        fd.append("file", file);
        fd.append("location_id", store);
        const res = await fetch("/api/order-fill/import", { method: "POST", body: fd, credentials: "same-origin" });
        const d = await res.json().catch(() => ({ detail: res.statusText }));
        if (!res.ok) throw new Error(d.detail || "Import failed");
        setStatus("ocs-imp-status", `Imported ${fmtN(d.rows)} SKUs for ${store} (generated ${d.generated_at || "?"}).`, true);
      } catch (e) {
        setStatus("ocs-imp-status", "Error: " + e.message, false);
      } finally {
        impRun.disabled = false;
      }
    });
  } catch (e) { showError(e); }
}

function renderOcsRetailerMap(retailers, existing) {
  const locs = window._ocsLocs || [];
  const mapByRid = {}; existing.forEach(m => mapByRid[m.ocs_retailer_id] = m.location_id);
  const opt = (sel) => `<option value="">— unmapped —</option>` +
    locs.map(l => `<option value="${l.id}" ${sel === l.id ? 'selected' : ''}>${escapeHtml(l.short_name || l.name)} (${l.id})</option>`).join("");
  const box = document.getElementById("ocs-retailers");
  box.innerHTML = `
    <table style="font-size: 12px; margin: 8px 0;">
      <thead><tr><th>OCS #</th><th>Name</th><th>Address</th><th>Our store</th></tr></thead>
      <tbody>
        ${retailers.map(r => `
          <tr>
            <td>${escapeHtml(r.store_number || r.retailer_id)}</td>
            <td>${escapeHtml(r.name || '')}</td>
            <td style="font-size: 11px; color: var(--text-dim);">${escapeHtml(r.address || '')}</td>
            <td><select class="ocs-map-sel" data-rid="${escapeHtml(r.retailer_id)}" data-name="${escapeHtml(r.name || '')}" style="font-size: 12px;">${opt(mapByRid[r.retailer_id] || '')}</select></td>
          </tr>`).join('')}
      </tbody>
    </table>
    <button class="btn btn-primary" id="ocs-save-map">Save mapping</button>
    <span id="ocs-map-status" style="font-size: 11px; color: var(--text-dim); margin-left: 10px;"></span>
  `;
  document.getElementById("ocs-save-map").addEventListener("click", async () => {
    const mappings = [...document.querySelectorAll(".ocs-map-sel")]
      .filter(s => s.value)
      .map(s => ({ ocs_retailer_id: s.dataset.rid, location_id: s.value, label: s.dataset.name }));
    const st = document.getElementById("ocs-map-status");
    st.textContent = "Saving...";
    try {
      const res = await fetch("/api/ocs/store-map", { method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mappings }) });
      const d = await res.json();
      st.textContent = res.ok ? `Saved ${d.count} mapping(s).` : "Failed";
      st.style.color = res.ok ? "#6dab84" : "var(--critical)";
    } catch (e) { st.textContent = "Error: " + e.message; st.style.color = "var(--critical)"; }
  });
}

async function renderEmailScraper() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading"><span class="spinner"></span> Loading email scraper…</div>`;
  try {
    const [accts, logs] = await Promise.all([
      api("/api/email-scraper/accounts"),
      api("/api/email-scraper/log?limit=30"),
    ]);

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <div>
            <div class="kicker">Admin · Auto-import</div>
            <h2 style="white-space: nowrap;">Email Scraper</h2>
          </div>
          <button class="btn btn-primary" id="es-add-btn">+ Add account</button>
        </div>
      </div>

      <div class="hint-box" style="margin-bottom: 14px;">
        <strong>What this does:</strong> polls the inbox for emails from <code style="background: var(--bg-elev-2); padding: 1px 6px;">noreply@covasoft.com</code>, extracts the Cova download link from each email's body, downloads the file, and drops it into <code style="background: var(--bg-elev-2); padding: 1px 6px;">imports/</code> for auto-importing.
        <br><br>
        <strong>Foundation only:</strong> manual "Poll now" per account. Background scheduler (auto-poll every 5 min) comes with cloud launch.
        <br><br>
        <strong>For Gmail:</strong> use <a href="https://support.google.com/accounts/answer/185833" target="_blank" style="color: var(--accent);">App Passwords</a> (you'll need 2FA enabled on the Gmail account first). Don't use your regular Gmail password — it won't work for IMAP and storing it would be insecure.
        <br><br>
        <strong>Cova links expire ~7 days after sending.</strong> Polling at least weekly catches everything. Daily is recommended.
      </div>

      <div class="card" style="margin-bottom: 16px;">
        <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
          <strong>Configured accounts</strong>
        </div>
        ${accts.items.length === 0 ? `
          <div style="padding: 16px; color: var(--text-dim); font-size: 12px;">No accounts configured yet.</div>
        ` : `
          <table style="font-size: 12px; margin: 0;">
            <thead><tr><th>Label</th><th>Host</th><th>Username</th><th>Folder</th><th>Last polled</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              ${accts.items.map(a => `
                <tr>
                  <td><strong>${escapeHtml(a.label)}</strong></td>
                  <td>${escapeHtml(a.host)}:${a.port}</td>
                  <td>${escapeHtml(a.username)}</td>
                  <td>${escapeHtml(a.folder)}</td>
                  <td style="font-size: 11px; color: var(--text-dim);">${a.last_polled_at || 'Never'}</td>
                  <td>${a.last_error ? `<span style="color: var(--critical); font-size: 10px;" title="${escapeHtml(a.last_error)}">ERROR</span>` : '<span style="color: #6dab84;">OK</span>'}</td>
                  <td>
                    <button class="btn-link es-poll-btn" data-id="${a.id}" style="font-size: 10px;">Poll now</button>
                    <button class="btn-link es-delete-btn" data-id="${a.id}" data-label="${escapeHtml(a.label)}" style="font-size: 10px; color: var(--critical);">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `}
      </div>

      <div class="card">
        <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
          <strong>Recent activity</strong>
          <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">Last 30 messages processed</span>
        </div>
        ${logs.items.length === 0 ? `
          <div style="padding: 16px; color: var(--text-dim); font-size: 12px;">No activity yet. Click "Poll now" on an account above to test.</div>
        ` : `
          <table style="font-size: 11px; margin: 0;">
            <thead><tr><th>When</th><th>Account</th><th>From</th><th>Subject</th><th>Action</th><th>Detail</th></tr></thead>
            <tbody>
              ${logs.items.map(l => `
                <tr>
                  <td style="color: var(--text-dim);">${l.processed_at}</td>
                  <td>${escapeHtml(l.account_label || '?')}</td>
                  <td>${escapeHtml((l.sender || '').slice(0, 40))}</td>
                  <td>${escapeHtml((l.subject || '').slice(0, 50))}</td>
                  <td><span class="tag" style="font-size: 9px; ${l.action === 'imported' ? 'color: #6dab84;' : (l.action === 'error' ? 'color: var(--critical);' : 'color: var(--text-dim);')}">${escapeHtml(l.action)}</span></td>
                  <td style="font-size: 10px;">${escapeHtml(l.detail || '')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `}
      </div>
    `;

    document.getElementById("es-add-btn").addEventListener("click", async () => {
      const label = prompt("Label for this account (e.g. 'Cova exports'):");
      if (!label) return;
      const host = prompt("IMAP host (Gmail: imap.gmail.com, Outlook: outlook.office365.com):", "imap.gmail.com");
      if (!host) return;
      const username = prompt("Email address:");
      if (!username) return;
      const password = prompt("App password (NOT your regular email password — see hint box for Gmail instructions):");
      if (!password) return;
      try {
        const res = await fetch("/api/email-scraper/accounts", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ label, host, port: 993, username, password, folder: "INBOX" }),
        });
        if (res.ok) renderEmailScraper(); else { const e = await res.json(); alert("Failed: " + (e.detail || "unknown")); }
      } catch (e) { alert("Error: " + e.message); }
    });

    document.querySelectorAll(".es-poll-btn").forEach(b => {
      b.addEventListener("click", async () => {
        b.disabled = true; b.textContent = "Polling...";
        try {
          const res = await fetch(`/api/email-scraper/accounts/${b.dataset.id}/poll`, {
            method: "POST", credentials: "include",
          });
          const data = await res.json();
          if (data.ok) {
            alert(`Poll complete:\n\nChecked: ${data.messages_checked}\nImported: ${data.imported}\nSkipped: ${data.skipped}\nErrors: ${data.errors}${data.files_saved && data.files_saved.length ? '\n\nFiles saved:\n' + data.files_saved.join('\n') : ''}`);
          } else {
            alert("Poll failed: " + (data.error || "unknown"));
          }
          renderEmailScraper();
        } catch (e) { alert("Error: " + e.message); }
      });
    });

    document.querySelectorAll(".es-delete-btn").forEach(b => {
      b.addEventListener("click", async () => {
        if (!confirm(`Delete account "${b.dataset.label}"? This doesn't delete past log entries.`)) return;
        const res = await fetch(`/api/email-scraper/accounts/${b.dataset.id}`, {
          method: "DELETE", credentials: "include",
        });
        if (res.ok) renderEmailScraper(); else alert("Delete failed");
      });
    });
  } catch (e) { showError(e); }
}
