// ========================================================================
// Reorder Report — SKU Diagnose modal
// ========================================================================
// Asks the user for a SKU + store, then calls /api/reorder/diagnose to show
// every filter check the engine applied and the verdict.
async function showReorderDiagnose() {
  const sku = prompt("Enter a SKU to diagnose (e.g., the Cova SKU shown under product names):");
  if (!sku || !sku.trim()) return;
  let locId = "";
  try {
    const sf = document.getElementById("store-filter");
    if (sf && sf.value) locId = sf.value;
  } catch (e) { /* ignore */ }
  if (!locId) {
    locId = prompt("Enter the store ID (S1, S2, S3, ..., S8):") || "";
  }
  if (!locId.trim()) return;

  const overlay = document.createElement("div");
  overlay.id = "diagnose-overlay";
  overlay.style.cssText = "position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;";
  overlay.innerHTML = `
    <div style="background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; max-width: 800px; width: 100%; max-height: 90vh; overflow: auto;">
      <div style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline;">
        <h3 style="margin: 0;">SKU Diagnostic</h3>
        <button id="diagnose-close" class="btn" style="font-size: 11px;">Close</button>
      </div>
      <div id="diagnose-body" style="padding: 16px 20px;">
        <div class="loading"><span class="spinner"></span> Diagnosing…</div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("diagnose-close").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });

  try {
    const data = await api(`/api/reorder/diagnose?sku=${encodeURIComponent(sku.trim())}&location_id=${encodeURIComponent(locId.trim())}`);
    const body = document.getElementById("diagnose-body");

    if (!data.found) {
      body.innerHTML = `<div class="error" style="padding: 16px;">${escapeHtml(data.excluded_reason || 'SKU not found')}</div>`;
      return;
    }

    const verdictBadge = data.verdict === "included"
      ? '<span class="tag" style="background: rgba(80, 180, 100, 0.18); color: #6fcf85; padding: 2px 8px;">INCLUDED</span>'
      : '<span class="tag" style="background: rgba(214, 100, 100, 0.18); color: #d66464; padding: 2px 8px;">EXCLUDED</span>';

    const inp = data.inputs;
    const inputsHtml = `
      <table style="font-size: 12px; width: 100%;">
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Product</td><td><strong>${escapeHtml(inp.name || '?')}</strong></td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Brand / LP</td><td>${escapeHtml(inp.brand || '?')} · ${escapeHtml(inp.lp || '?')}</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Category</td><td>${escapeHtml(inp.category || '?')} → ${escapeHtml(inp.subcategory || '?')}</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Top-level</td><td>${escapeHtml(inp.top_level_classification || '?')}</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">On hand</td><td>${inp.on_hand} units (as of ${inp.inventory_as_of || '?'})</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Velocity</td><td>${inp.velocity_per_day} units/day (${inp.units_sold_30d} units ÷ ${inp.velocity_basis_days || 30} sellable days${(inp.velocity_basis_days || 30) < 30 ? ' — stockout-adjusted' : ''})</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Days of cover</td><td>${inp.days_of_cover}</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Pack size</td><td>${inp.pack_size}</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">OCS stock</td><td>${escapeHtml(inp.ocs_stock_status || '?')} · price ${inp.ocs_unit_price ? '$' + inp.ocs_unit_price.toFixed(2) : '?'}</td></tr>
        ${inp.is_hero ? `<tr><td style="padding: 4px 8px; color: var(--text-dim);">Hero</td><td><span style="color: #c89b32;">★ Hero at this store</span> (ceiling ${inp.settings_applied?.ceiling_used ?? '?'}d)</td></tr>` : ''}
        ${inp.anchor_override ? `<tr><td style="padding: 4px 8px; color: var(--text-dim);">Manager override</td><td>${escapeHtml(inp.anchor_override)} (anchor)</td></tr>` : ''}
      </table>
    `;

    const checksHtml = data.checks.map(c => `
      <tr>
        <td style="padding: 8px 10px; vertical-align: top; white-space: nowrap; font-size: 18px;">${c.passed ? '<span style="color: #6fcf85;">✓</span>' : '<span style="color: #d66464;">✗</span>'}</td>
        <td style="padding: 8px 10px; vertical-align: top;">
          <strong>${escapeHtml(c.name)}</strong>
          <div style="color: var(--text-dim); font-size: 12px; margin-top: 2px;">${escapeHtml(c.explanation)}</div>
        </td>
      </tr>
    `).join('');

    body.innerHTML = `
      <div style="margin-bottom: 16px;">
        <div style="font-size: 14px; margin-bottom: 6px;">
          <strong>${escapeHtml(data.sku)}</strong> at <strong>${escapeHtml(data.location_id)}</strong>
        </div>
        <div>Verdict: ${verdictBadge}</div>
        ${data.excluded_reason ? `<div style="margin-top: 8px; font-size: 12px; color: #d66464;">${escapeHtml(data.excluded_reason)}</div>` : ''}
      </div>

      <h4 style="margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);">Inputs the engine sees</h4>
      <div class="card" style="padding: 8px; margin-bottom: 20px;">${inputsHtml}</div>

      <h4 style="margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);">Filter checks (in engine order)</h4>
      <div class="card"><table style="font-size: 13px; width: 100%;">${checksHtml}</table></div>

      <p style="font-size: 11px; color: var(--text-faint); margin-top: 16px;">
        Settings applied:
        Hero ceiling ${inp.settings_applied.hero_ceiling_days}d ·
        Regular ceiling ${inp.settings_applied.regular_ceiling_days}d ·
        Min velocity ${inp.settings_applied.min_velocity}/day ·
        Pack threshold ${inp.settings_applied.pack_size_min_pct}% ·
        Overstock ${inp.settings_applied.overstock_days}d
      </p>
    `;
  } catch (e) {
    document.getElementById("diagnose-body").innerHTML = `<div class="error" style="padding: 16px;">${escapeHtml(e.message)}</div>`;
  }
}

// Format an ISO date ('2026-07-09') as a short, readable 'Jul 9'. Parses the
// parts manually to avoid timezone shifts from new Date(isoString). Returns ''
// for null/unparseable input.
function fmtShortDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  if (!m) return "";
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                  "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return `${months[+m[2] - 1]} ${+m[3]}`;
}

// Render the "Deals" cell for a reorder row: one tag per active data-revenue
// program the SKU is on — LP Partner (direct), Collective (IRCC/CC/Seeker), or
// LTO. Driven by r.deal_components from the resolver, which already applies the
// stacking rules (a partner/LTO supersedes a collective).
function dealsCell(r) {
  const comps = (r && r.deal_components) || [];
  if (!comps.length) return '<span class="muted">—</span>';
  const tag = (bg, color, text, tip) =>
    `<span class="tag" style="background:${bg}; color:${color}; border-color:${color}55; font-size:9px; padding:1px 5px; margin:0 2px 2px 0; display:inline-block; vertical-align:middle;" title="${tip}">${text}</span>`;
  return comps.map(c => {
    const disp = c.rate_value_display ? escapeHtml(c.rate_value_display) : '';
    if (c.kind === 'partner') {
      let name = (c.label || '').replace(/^Partner:\s*/i, '');
      name = lpTradeName(name);
      name = (typeof titleCaseLp === 'function') ? titleCaseLp(name) : name;
      return tag('rgba(140,100,180,0.15)', '#a78bd9',
        `LP: ${escapeHtml(name)}`,
        `Direct LP partnership — ${escapeHtml(name)}${disp ? ' (' + disp + ')' : ''}`);
    }
    if (c.kind === 'lto') {
      const name = (c.label || '').replace(/^LTO:\s*/i, '');
      return tag('rgba(220,150,90,0.15)', '#dc965a',
        `LTO: ${escapeHtml(name)}`,
        `Limited-time offer${disp ? ' — ' + disp : ''}`);
    }
    // collective (IRCC / Canna Collective / Seeker)
    const cname = c.label === 'Canna Collective' ? 'CC' : escapeHtml(c.label || 'Collective');
    const cpct = c.rate ? Number(c.rate).toFixed(1).replace(/\.0$/, '') : '';
    return tag('rgba(70,140,90,0.15)', '#6dab84',
      `${cname}${cpct ? ' ' + cpct + '%' : ''}`,
      `Collective rebate — ${escapeHtml(c.label || '')}${disp ? ' (' + disp + ')' : ''}`);
  }).join('');
}

async function renderReorder() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading"><span class="spinner"></span> Loading reorder queue…</div>`;
  try {
    const [locs, data] = await Promise.all([
      api("/api/locations"),
      api("/api/reorder"),  // defaults to Cannabis-only server-side
    ]);

    // Header KPI strip — scope-level summary (store + type), explains why the
    // week's order is the size it is. Rebuilt on store/type/urgency changes via
    // refetch(); unaffected by client-side search/category/exclusion filters.
    function kpiStripHTML(k) {
      if (!k) return '';
      const doh = (k.days_on_hand == null)
        ? '—'
        : `${k.days_on_hand}<span style="font-size:13px; color:var(--text-dim); font-family:inherit;"> d</span>`;
      const slowRange = `${k.slow_days}–${k.dead_days - 1}`;
      // Compact card: smaller padding + value so all 5 fit one row.
      const card = (cls, label, value, detail, title) => `
        <div class="kpi-card ${cls}" style="cursor:default; padding:13px 14px;" title="${title}">
          <div class="kpi-label" style="margin-bottom:6px;"><span>${label}</span></div>
          <div class="kpi-value" style="font-size:22px;">${value}</div>
          <div class="kpi-detail">${detail}</div>
        </div>`;
      return `
      <div class="kpi-grid" style="grid-template-columns: repeat(5, 1fr); gap: 10px;">
        ${card('blue','Days On Hand', doh,
          `${fmt$(k.on_hand_value)} at cost${k.inventory_as_of ? ` · as of ${k.inventory_as_of}` : ''}`,
          'On-hand value (at actual cost) ÷ daily burn (trailing 30-day cost of product sold ÷ 30).')}
        ${card('purple','Weekly Burn', fmt$(k.weekly_burn_cost), 'Cost sold, 30-day avg',
          'Cost of product sold, averaged over the trailing 30 days, expressed per week.')}
        ${card('green','Suggested Reorder', fmt$(k.reorder_cost),
          `${fmtN(k.reorder_units)} u · ${fmtN(k.reorder_skus)} SKUs`,
          "This week's suggested reorder at OCS wholesale cost.")}
        ${card('red','Active Stockouts', fmtN(k.active_stockouts),
          `Selling SKUs at 0 qty${k.needs_review_skus ? ` · ${fmtN(k.needs_review_skus)} manual` : ''}`,
          'SKUs that are selling but currently at 0 on-hand. Manual = stockouts below the case threshold; the engine will not auto-order them — they are listed in the table for a manual call.')}
        ${card('amber','Slow + Dead', fmt$(k.slow_dead_total_value),
          `Slow ${fmt$(k.slow_stock_value)} · Dead ${fmt$(k.dead_stock_value)}`,
          `On-hand value not sold in ${k.slow_days}+ days. Slow = sold ${slowRange}d ago (${fmtN(k.slow_stock_skus)} SKUs); Dead = ${k.dead_days}+d ago (${fmtN(k.dead_stock_skus)} SKUs).`)}
      </div>`;
    }

    // Plain-English manager guidance derived from the KPIs (current store/type
    // scope). Shown above the KPI strip.
    function highlightsHTML(k) {
      if (!k) return '';
      const pts = [];
      const doh = k.days_on_hand;
      const reorder$ = k.reorder_cost || 0;
      const stockout$ = k.stockout_value || 0;
      const stockoutShare = reorder$ > 0 ? stockout$ / reorder$ : 0;
      const heavy = doh != null && doh > 28;
      // When aggregate is heavy BUT the order is mostly stockouts, the issue
      // is mix (heavy on slow movers, lean on best-sellers) — NOT over-ordering.
      // Cutting that reorder would just lose sales on the sold-out fast movers.
      if (heavy && stockoutShare > 0.5) {
        pts.push(`<strong>Heavy on slow movers, lean on best-sellers</strong> — ~${doh} days on hand overall (target 21–28), but <strong>${fmtN(k.active_stockouts)} selling SKUs are at zero</strong>. About ${Math.round(stockoutShare*100)}% of this week's order (${fmt$(stockout$)}) is refilling those — not over-buying. The overstock is concentrated in slow/dead stock; focus sell-down there.`);
      } else if (doh != null) {
        if (doh > 35) pts.push(`<strong>Heavily stocked</strong> — ~${doh} days on hand (target 21–28). Tighten ordering: prioritize Hero / high-velocity SKUs and avoid topping up slow movers.`);
        else if (doh > 28) pts.push(`<strong>Slightly heavy</strong> — ~${doh} days on hand (target 21–28). Favor Heroes; ease off slower SKUs.`);
        else if (doh >= 21) pts.push(`<strong>Well-balanced</strong> — ~${doh} days on hand, within the 21–28-day target.`);
        else if (doh >= 14) pts.push(`<strong>Slightly lean</strong> — ~${doh} days on hand; keep Heroes well-covered.`);
        else pts.push(`<strong>Running lean</strong> — ~${doh} days on hand; watch for stockouts on fast movers.`);
      }
      const sd = k.slow_dead_total_value || 0, oh = k.on_hand_value || 0;
      if (sd > 0) {
        const pct = oh > 0 ? Math.round(sd / oh * 100) : 0;
        pts.push(`<strong>${fmt$(sd)}${pct ? ` (~${pct}%)` : ''}</strong> hasn't sold in ${k.slow_days}+ days — work it down via clearance/promos before it ages further.`);
      }
      // Skip the stockout bullet when it's already the lead (would repeat).
      if (k.active_stockouts > 0 && !(heavy && stockoutShare > 0.5)) {
        pts.push(`<strong>${fmtN(k.active_stockouts)} selling SKUs are stocked out</strong> — these are the priority to restock.`);
      }
      // Order sense-check: this week's order vs the last 7 days' COGS. A weekly
      // order should roughly replace a week's cost of sales, so this is the quick
      // "does this order make sense" gut check, color-flagged by band.
      if ((k.cogs_7d || 0) > 0 && k.order_vs_cogs_pct != null) {
        const pct = k.order_vs_cogs_pct;
        // An overstocked store SHOULD order below its COGS (drawing down the
        // glut), so don't cry "under-ordering" there — read days-on-hand too.
        const overstocked = k.days_on_hand != null && k.days_on_hand > 28;
        let flag, color;
        if (pct < 80) {
          if (overstocked) { flag = 'drawing down excess'; color = '#6dab84'; }
          else { flag = 'under-ordering'; color = '#dc965a'; }
        } else if (pct <= 120) { flag = 'on track'; color = '#6dab84'; }
        else { flag = 'building inventory'; color = '#6aa6d6'; }
        const tail = (pct < 80 && overstocked)
          ? ` <span style="color:var(--text-faint);">(~${k.days_on_hand}d on hand — correct to buy under sales while working it down.)</span>`
          : ` <span style="color:var(--text-faint);">~100% ≈ replacing what sold.</span>`;
        pts.push(`<strong>Order sense-check:</strong> this week's order (<strong>${fmt$(reorder$)}</strong> wholesale) is <strong style="color:${color}">${pct}% of the last 7 days' COGS</strong> (${fmt$(k.cogs_7d)}) — <span style="color:${color}; font-weight:600;">${flag}</span>.${tail}`);
      } else if ((k.weekly_burn_cost || 0) > 0) {
        // Fallback when there's no recent 7-day COGS (e.g. a new/quiet store).
        const pct = Math.round(reorder$ / k.weekly_burn_cost * 100);
        pts.push(`This week's suggested order is <strong>${fmt$(reorder$)}</strong> at OCS wholesale — about ${pct}% of weekly sales at landed cost.`);
      }
      if (!pts.length) return '';
      return `
        <div class="card" style="margin-bottom: 16px; padding: 14px 16px; border-left: 3px solid var(--accent);">
          <div class="kicker" style="margin-bottom: 8px;">Highlights</div>
          <ul style="margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6;">
            ${pts.map(p => `<li>${p}</li>`).join('')}
          </ul>
        </div>`;
    }

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <div>
            <div class="kicker">OCS Reorder Queue</div>
            <h2 style="white-space: nowrap;">Suggested Weekly Reorder</h2>
          </div>
          <div style="display: flex; gap: 8px;">
            <button id="reorder-export-ocs-btn" class="btn btn-primary" style="white-space: nowrap;"
                    title="Fill the selected store's latest OCS order template with these reorder quantities, ready to upload to OCS. Select a single store first.">
              <span style="font-size: 14px; line-height: 1;">⤒</span> Export to OCS Template
            </button>
            <button id="reorder-compare-btn" class="btn" style="white-space: nowrap;"
                    title="Upload an order a manager built on OCS (a CartExport/OrderExport .xlsx with quantities filled in) and compare it line-by-line to the engine's recommendation. Select a single store first.">
              <span style="font-size: 14px; line-height: 1;">⇄</span> Compare My Order
            </button>
            <input type="file" id="reorder-compare-file" accept=".xlsx,.xls" style="display: none;">

            <button id="reorder-excel-btn" class="btn" style="white-space: nowrap;">
              <span style="font-size: 14px; line-height: 1;">⤓</span> Download Excel
            </button>
          </div>
        </div>
        <div class="controls-row" style="margin-top: 4px;">
          <input type="search" id="reorder-search" placeholder="Search product name or SKU...">
          <select id="urgency-filter">
            <option value="all" selected>All urgencies</option>
            <option value="stockout">Stockout</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
          </select>
          <select id="type-filter">
            <option value="Cannabis" selected>Cannabis only</option>
            <option value="Accessories">Accessories only</option>
            <option value="All">All types</option>
          </select>
          <select id="category-filter" title="Filter by product classification (Pre-Rolls, Dried Flower, etc.)">
            <option value="">All categories</option>
          </select>
          <select id="store-filter">
            <option value="">All stores</option>
            ${locs.map(l => `<option value="${l.id}">${l.short_name || l.name}</option>`).join("")}
          </select>
        </div>
        <div class="controls-row" style="font-size: 11px; flex-wrap: wrap;">
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;">
            <input type="checkbox" id="include-ocs-out" style="margin: 0;">
            Show OCS-out items
          </label>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Adjust order quantities based on category mix drift vs 90-day sales. Underweight categories get up to +25%, overweight get up to -30%. Note: does NOT inflate Hero quantities.">
            <input type="checkbox" id="mix-aware" style="margin: 0;">
            Mix-aware
          </label>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Show only Hero SKUs — these are top-5 within each (category, size) bucket and get protected reorder treatment.">
            <input type="checkbox" id="anchors-only" style="margin: 0;">
            Heroes only
          </label>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Show only SKUs with an active data revenue deal — collective rebate (IRCC/CC/Seeker) or direct brand/LP deal.">
            <input type="checkbox" id="data-fees-only" style="margin: 0;">
            Rebate qualified only
          </label>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Show only SKUs currently flagged as on sale (active LTO / heuristic-detected promo activity).">
            <input type="checkbox" id="sale-flagged-only" style="margin: 0;">
            On sale only
          </label>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Show items you've excluded from this week's order. Exclusions persist in this browser.">
            <input type="checkbox" id="show-excluded" style="margin: 0;">
            Show excluded
          </label>
          <button id="clear-excluded-btn" class="btn" style="font-size: 11px; height: 28px; padding: 0 10px; display: none;" title="Remove all exclusion marks for this store">Clear exclusions (<span id="excluded-count">0</span>)</button>
          <button id="reorder-legend-btn" class="btn" style="font-size: 11px; height: 28px; padding: 0 10px; margin-left: auto;" title="What do all these tags mean?">? Legend</button>
          <button id="reorder-diagnose-btn" class="btn" style="font-size: 11px; height: 28px; padding: 0 10px;" title="Look up why a specific SKU is or isn't on the report">🔍 Diagnose SKU</button>
        </div>
      </div>

      <div id="reorder-highlights">${highlightsHTML(data.kpis)}</div>
      <div id="reorder-kpis">${kpiStripHTML(data.kpis)}</div>

      <div class="card">
        <div class="summary-bar" id="reorder-summary">
          ${reorderSummaryHTML(data.recommendations)}
        </div>
        <div id="mix-multiplier-summary" style="display: none; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-dim);"></div>
        <div id="suggested-additions-panel" style="display: none;"></div>
        <div id="reorder-table"></div>
      </div>

      <div class="hint-box">
        <strong>Tiered min-max model.</strong> A SKU is restocked up to its ceiling (currently ${data.settings?.ceiling_days ?? '—'} days of supply) once stock drops to the reorder trigger. <strong>Hero SKUs</strong> (<span style="color: #c89b32;">★</span> — top sellers per format at each store by trailing revenue) get protective treatment with their own ceiling. <span class="tag" style="background: rgba(200,155,50,.15); color: #c89b32; font-size: 9px; padding: 1px 5px;">manual</span> rows are stockouts whose demand is below the minimum case fraction — the engine won't auto-order a case, so make the call yourself (Diagnose shows the math).
        All thresholds are tunable in <strong>Settings → Reorder Engine</strong> and apply on the next load.
      </div>
    `;

    // ==== Exclusion state (localStorage-backed, per-store) ====
    // Must be declared BEFORE the columns array because the exclude column's
    // render function references excludedSkus and excludeKey at render time.
    function excludeKey(r) { return `${r.sku}|${r.location_id}`; }
    function exclusionStorageKey() {
      const sf = document.getElementById("store-filter");
      const s = sf ? sf.value : '';
      return `reorder-excluded::${s || 'all'}`;
    }
    function loadExclusions() {
      try {
        const raw = localStorage.getItem(exclusionStorageKey());
        return new Set(raw ? JSON.parse(raw) : []);
      } catch (e) { return new Set(); }
    }
    function saveExclusions(set) {
      try { localStorage.setItem(exclusionStorageKey(), JSON.stringify([...set])); }
      catch (e) {}
    }
    let excludedSkus = loadExclusions();

    // Manual-review (needs_review) rows are EXCLUDED by default — they're
    // sold-out SKUs the engine won't auto-size, so they shouldn't quietly
    // ride along in the order. They stay visible but greyed; ticking the
    // checkbox opts one in (persisted separately so the default-exclude and
    // the normal exclude sets don't collide).
    function reviewStorageKey() {
      const sf = document.getElementById("store-filter");
      return `reorder-review-incl::${(sf ? sf.value : '') || 'all'}`;
    }
    function loadReviewIncluded() {
      try { return new Set(JSON.parse(localStorage.getItem(reviewStorageKey()) || "[]")); }
      catch (e) { return new Set(); }
    }
    function saveReviewIncluded(set) {
      try { localStorage.setItem(reviewStorageKey(), JSON.stringify([...set])); } catch (e) {}
    }
    let reviewIncludedSkus = loadReviewIncluded();

    // Single source of truth for "is this row excluded from the order".
    function isRowExcluded(r) {
      if (r.needs_review) return !reviewIncludedSkus.has(excludeKey(r));
      return excludedSkus.has(excludeKey(r));
    }

    // Summary-bar numbers. "SKUs to order" counts only rows with an actual
    // quantity; zero-qty manual-review stockouts get their own count so the
    // headline isn't inflated by rows that aren't really being ordered.
    function reorderSummaryHTML(rows, badges = []) {
      const orderedCount = rows.filter(r => r.reorder_qty > 0).length;
      const manualCount = rows.filter(r => r.needs_review).length;
      return `
        <div>SKUs to order<strong>${orderedCount}</strong> ${badges.join(' ')}</div>
        ${manualCount > 0 ? `<div title="Stockouts below the case threshold — engine won't auto-order; decide manually.">Manual review<strong style="color: #c89b32;">${manualCount}</strong></div>` : ''}
        <div>Total units<strong>${fmtN(rows.reduce((s, r) => s + r.reorder_qty, 0))}</strong></div>
        <div>Est. wholesale<strong>${fmt$(rows.reduce((s, r) => s + (r.line_total || 0), 0))}</strong></div>
      `;
    }

    const columns = [
      { key: '__include', label: 'Include / Exclude', sortable: false,
        tooltip: "Checked = include in this week's order. Uncheck to exclude. Manual-review (sold-out) rows start excluded — tick to bring one in.",
        render: r => {
          // Inverted: checked = INCLUDED. Manual-review rows default excluded.
          const isExcluded = isRowExcluded(r);
          const tip = r.needs_review
            ? "Manual review: stocked out, engine won't auto-size it. Tick to include in this week's order (you'll set the quantity manually)."
            : "Uncheck to exclude this SKU from this week's order (persists in this browser)";
          return `<input type="checkbox" class="exclude-cb" data-sku="${r.sku}" data-loc="${r.location_id}" data-review="${r.needs_review ? '1' : '0'}" ${isExcluded ? '' : 'checked'} title="${tip}">`;
        } },
      { key: 'urgency', label: 'Status',
        sortValue: r => r.is_pinned ? -2 : ({ trial_add: -1, stockout: 0, critical: 1, high: 2, medium: 3,
                           ok: 4, overstock: 5, dead_stock: 6 }[r.urgency] ?? 9),
        render: r => {
          if (r.is_pinned) {
            const left = r.pin_days_left != null ? `${r.pin_days_left}d left` : '';
            return `<span class="tag" style="background: rgba(200,155,50,.18); color: #d6b446; border-color: rgba(220,190,80,.5);" title="Manually pinned from the OCS Catalogue on ${r.pinned_at || '?'}. Auto-removes after 7 days (assumed ordered).">📌 pinned</span>
              <div class="sku">${r.pinned_at || ''}${left ? ' · ' + left : ''} · <a href="#" class="pin-unpin" data-variant="${escapeHtml(r.ocs_variant || '')}" style="color: var(--accent);">unpin</a></div>`;
          }
          return r.is_trial_add
            ? `<span class="tag" style="background: rgba(80,160,100,.18); color: #6fcf85; border-color: rgba(90,200,110,.45);" title="Trial add from Suggested Additions — peer-popular SKU you don't carry yet. Ordering a small trial quantity; once it sells, the engine takes over.">＋ trial add</span>`
            : `<span class="tag ${urgencyTagClass(r.urgency)}">${r.urgency}</span>`;
        } },
      { key: 'product_name', label: 'Product',
        render: r => {
          // Name on line 1 (just a slim ★ for Heroes); everything else lives
          // on the small line 2 so the product name stays scannable.
          const anchor = r.is_top_sku ? `<span style="color: #c89b32; margin-right: 4px;" title="Hero — top seller in its format at this store by trailing revenue; protected by tiered reorder logic">★</span>` : '';
          // (Data-revenue deal tag moved out from under the product name into
          // its own "Deals" column — see the dealsCell() column below.)
          // Order Fill badges (visibility from latest Order Fill import)
          const ofBadges = (() => {
            const out = [];
            if (r.order_fill_back_in_stock) {
              out.push(`<span class="tag" style="background: rgba(80, 180, 100, 0.18); color: #6fcf85; border-color: rgba(90, 200, 110, 0.45); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Back in stock at OCS as of the latest Order Fill">BACK IN STOCK</span>`);
            }
            if (r.order_fill_new_arrival) {
              out.push(`<span class="tag" style="background: rgba(214, 180, 70, 0.18); color: #d6b446; border-color: rgba(220, 190, 80, 0.45); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Newly listed in the latest Order Fill">NEW</span>`);
            }
            // Flow-Through tier + delivery date are shown in the OCS Avail.
            // column now (as 'Flow-Through Std/Exp' + the date), not as a badge
            // under the product name — keeps the product cell uncluttered.
            return out.join('');
          })();
          // Sale flags — currently/recently discounted SKUs may have inflated velocity
          const saleTag = (() => {
            if (r.sale_flag === 'active') {
              const d = r.sale_flag_detail || {};
              const tip = `Active Sale: ${d.active_days_in_7 || '?'} of last 7 days had >30% of units discounted (avg ${d.avg_discount_pct || '?'}% off). Velocity may be inflated — be cautious about ordering as if this rate is steady-state.`;
              return `<span class="tag" style="background: rgba(214, 180, 70, 0.18); color: #d6b446; border-color: rgba(220, 190, 80, 0.45); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="${tip}">🏷️ Sale</span>`;
            }
            if (r.sale_flag === 'recent') {
              const d = r.sale_flag_detail || {};
              const since = d.days_since_last_promo != null ? `${d.days_since_last_promo}d ago` : 'recent';
              const tip = `Recently Ended Sale: last promo ${since}. Velocity over the past 30 days reflects sale conditions and may revert downward.`;
              return `<span class="tag" style="background: rgba(150, 150, 150, 0.15); color: #999; border-color: rgba(160, 160, 160, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="${tip}">↘️ Post-sale</span>`;
            }
            return '';
          })();
          const badges = `${ofBadges}${saleTag}`;
          return `${anchor}${escapeHtml(r.product_name)}<div class="sku">${r.sku} · ${r.category || "—"}${badges ? `<span style="margin-left: 6px;">${badges}</span>` : ''}</div>`;
        } },
      { key: 'location_id', label: 'Store', render: r => storeLabel(r.location_id) },
      { key: 'on_hand', label: 'On hand', type: 'number', align: 'right',
        render: r => `<span style="${r.on_hand < 4 ? 'color: var(--critical)' : ''}">${r.on_hand}</span>` },
      { key: 'daily_velocity', label: 'Units/day', type: 'number', align: 'right',
        render: r => r.daily_velocity.toFixed(2) },
      { key: 'days_supply', label: 'Days', type: 'number', align: 'right',
        render: r => r.days_supply == null ? '—' : `<span style="${r.days_supply < 4 ? 'color: var(--critical)' : ''}">${r.days_supply.toFixed(1)}</span>` },
      { key: 'ocs_pack_size', label: 'Case Size', type: 'number', align: 'right',
        tooltip: "Case/pack size from OCS catalog. Blank or '—' means the SKU isn't currently in OCS catalog (discontinued or accessory).",
        render: r => r.ocs_pack_size != null && r.ocs_pack_size > 0
          ? r.ocs_pack_size
          : '<span class="muted" title="SKU not in current OCS catalog">—</span>' },
      { key: 'reorder_qty', label: 'Order qty', type: 'number', align: 'right',
        render: r => {
          // Stocked out but demand below the case threshold — engine won't
          // auto-order; surfaced for a manual call instead of hidden.
          if (r.needs_review) {
            return `<span class="tag" style="background: rgba(200,155,50,.15); color: #c89b32; font-weight: 600;"
              title="Stocked out, but 30-day demand is below the minimum case fraction, so the engine won't auto-order a case. Decide manually — click Diagnose for the math.">manual</span>`;
          }
          const casesText = r.reorder_cases ? `<div class="sku">${r.reorder_cases} case${r.reorder_cases === 1 ? '' : 's'}</div>` : '';
          // Show mix multiplier tag if it diverges from 1.0
          let mixTag = '';
          if (r.mix_multiplier && Math.abs(r.mix_multiplier - 1.0) > 0.01) {
            const color = r.mix_multiplier > 1 ? 'var(--accent)' : 'var(--warning)';
            mixTag = `<div class="sku" style="color: ${color}">×${r.mix_multiplier.toFixed(2)} mix</div>`;
          }
          return `<span style="font-family: Georgia, serif; font-size: 15px;">${r.reorder_qty}</span>${casesText}${mixTag}`;
        } },
      { key: 'line_total', label: 'Est. $', type: 'number', align: 'right',
        render: r => r.line_total ? fmt$(r.line_total) : '—' },
      { key: 'deals', label: 'Deals',
        tooltip: "Active data-revenue programs for this SKU: LP Partner (a direct LP/brand agreement), Collective (IRCC / Canna Collective / Seeker), or LTO. Per the stacking rules, a Partner or LTO supersedes a collective, so a collective only shows when no Partner/LTO applies.",
        render: r => dealsCell(r) },
      { key: 'ocs_stock_status', label: 'OCS Avail.', align: 'right',
        tooltip: "Whether OCS will deliver this SKU. 'Yes' = in warehouse stock; 'Flow-Through Std/Exp' = orderable this cycle via the Order Fill, ships from the LP (Std/Exp = delivery tier), with OCS's committed delivery date shown beneath; 'Click-to-Buy' = direct from OCS warehouse this cycle; 'No' = out and not in this cycle's Order Fill; '—' = not in the current OCS catalog.",
        render: r => {
          if (r.ocs_stock_status === 'YES') return '<span class="tag tag-accent">Yes</span>';
          // Orderable via the latest Order Fill even if warehouse stock is "NO"
          // (flow-through ships from the LP). Don't flag these as out of stock.
          const inFill = r.order_fill_flow_thru !== null && r.order_fill_flow_thru !== undefined;
          if (inFill || r.order_fill_back_in_stock || (r.order_fill_available_qty || 0) > 0) {
            if (r.order_fill_flow_thru === true) {
              // Flow-Through: note the delivery tier (Std/Exp) + OCS's committed
              // delivery date (moved here from the old product-column badge).
              const tierAbbr = r.order_fill_delivery_tier === 'Expedited' ? ' Exp'
                             : r.order_fill_delivery_tier === 'Standard' ? ' Std' : '';
              const etaFmt = fmtShortDate(r.order_fill_estimated_delivery);
              const dateNote = etaFmt ? `<div class="sku" style="color: var(--text-dim);">${etaFmt}</div>` : '';
              const tip = `Flow-Through${r.order_fill_delivery_tier ? ' (' + r.order_fill_delivery_tier + ')' : ''}: ships from the LP — orderable even when the OCS warehouse shows 0.${r.order_fill_estimated_delivery ? ' OCS est. delivery ' + r.order_fill_estimated_delivery + '.' : ''}`;
              return `<span class="tag tag-accent" title="${tip}">Flow-Through${tierAbbr}</span>${dateNote}`;
            }
            const label = r.order_fill_flow_thru === false ? 'Click-to-Buy' : 'Orderable';
            return `<span class="tag tag-accent" title="Not in OCS warehouse stock, but available to order this cycle via the Order Fill (${label}).">${label}</span>`;
          }
          if (r.ocs_stock_status === 'NO') return '<span class="tag tag-critical" style="font-weight: 600;">No</span>';
          return '<span class="muted" title="Not in current OCS catalog">—</span>';
        } },
      { key: 'avg_rating', label: 'Rating', type: 'number', align: 'right',
        tooltip: 'Average rating across all managers (1-10). Synced from OCS Catalogue tab.',
        render: r => (typeof ratingDisplay === 'function')
          ? ratingDisplay(r.avg_rating, r.rating_count)
          : (r.avg_rating != null ? `${r.avg_rating.toFixed(1)} (${r.rating_count})` : '—') },
      { key: 'comment_count', label: 'Comments', type: 'number', align: 'right',
        tooltip: 'Number of manager comments on this SKU.',
        render: r => r.comment_count || '' },
    ];

    let currentData = data.recommendations;
    renderTable('reorder-table', currentData, columns, { defaultSort: 'urgency', emptyText: 'No reorder items.' });

    const search = document.getElementById("reorder-search");
    const storeFilter = document.getElementById("store-filter");
    const typeFilter = document.getElementById("type-filter");
    const urgencyFilter = document.getElementById("urgency-filter");
    const ocsOutToggle = document.getElementById("include-ocs-out");
    const mixAwareToggle = document.getElementById("mix-aware");
    const anchorsOnlyToggle = document.getElementById("anchors-only");
    const mixSummaryEl = document.getElementById("mix-multiplier-summary");

    function renderMixSummary(mults) {
      if (!mults) {
        mixSummaryEl.style.display = 'none';
        return;
      }
      const adjusted = Object.entries(mults)
        .filter(([_, m]) => Math.abs(m - 1.0) > 0.01)
        .sort((a, b) => Math.abs(b[1] - 1) - Math.abs(a[1] - 1));
      if (adjusted.length === 0) {
        mixSummaryEl.style.display = 'block';
        mixSummaryEl.innerHTML = `<strong>Mix-aware ON.</strong> No categories have enough drift to adjust — all multipliers = 1.0.`;
        return;
      }
      const parts = adjusted.map(([cat, m]) => {
        const arrow = m > 1 ? '↑' : '↓';
        const color = m > 1 ? 'var(--accent)' : 'var(--warning)';
        return `<span style="color: ${color}">${cat} ×${m.toFixed(2)} ${arrow}</span>`;
      });
      mixSummaryEl.style.display = 'block';
      mixSummaryEl.innerHTML = `<strong>Mix-aware ON.</strong> Adjusted categories (90-day drift): ${parts.join(' · ')}`;
    }

    // ==== UI helpers that depend on exclusion state (already declared above) ====
    function updateExcludedUI() {
      const count = excludedSkus.size;
      const btn = document.getElementById("clear-excluded-btn");
      const cnt = document.getElementById("excluded-count");
      if (cnt) cnt.textContent = count;
      if (btn) btn.style.display = count > 0 ? '' : 'none';
    }
    updateExcludedUI();

    // ==== Category filter population ====
    function populateCategoryFilter() {
      const sel = document.getElementById("category-filter");
      if (!sel) return;
      // Preserve current selection
      const current = sel.value;
      const cats = [...new Set(currentData.map(r => r.category).filter(Boolean))].sort();
      sel.innerHTML = '<option value="">All categories</option>' +
        cats.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`).join("");
    }

    function applyTextFilter() {
      const q = search.value.trim().toLowerCase();
      const anchorsOnly = anchorsOnlyToggle.checked;
      const dataFeesOnly = document.getElementById("data-fees-only").checked;
      const saleFlaggedOnly = document.getElementById("sale-flagged-only").checked;
      const categoryFilter = document.getElementById("category-filter").value;
      const showExcluded = document.getElementById("show-excluded").checked;
      let filtered = currentData;
      if (anchorsOnly) {
        filtered = filtered.filter(r => r.is_top_sku);
      }
      if (dataFeesOnly) {
        // "Rebate qualified" — has either a collective deal OR a direct deal
        filtered = filtered.filter(r => r.data_fee_pct || r.data_fee_is_direct);
      }
      if (saleFlaggedOnly) {
        filtered = filtered.filter(r => r.sale_flag === 'active' || r.sale_flag === 'recent');
      }
      if (categoryFilter) {
        filtered = filtered.filter(r => r.category === categoryFilter);
      }
      if (!showExcluded) {
        // Hide excluded NORMAL rows; keep manual-review rows visible (greyed)
        // so the manager can still see and opt them in.
        filtered = filtered.filter(r => r.needs_review || !isRowExcluded(r));
      }
      if (q) {
        filtered = filtered.filter(r =>
          (r.product_name || '').toLowerCase().includes(q) ||
          (r.sku || '').toLowerCase().includes(q)
        );
      }
      renderTable('reorder-table', filtered, columns, {
        defaultSort: 'urgency',
        rowAttrs: r => isRowExcluded(r)
          ? 'style="opacity: 0.5;" title="Excluded from this week\'s order"'
          : (r.is_pinned ? 'style="background: rgba(200,155,50,.09);"'
            : (r.is_trial_add ? 'style="background: rgba(80,160,100,.08);"' : '')),
      });
      const anchorCount = filtered.filter(r => r.is_top_sku).length;
      const dataFeeCount = filtered.filter(r => r.data_fee_pct || r.data_fee_is_direct).length;
      const saleCount = filtered.filter(r => r.sale_flag === 'active' || r.sale_flag === 'recent').length;
      const excludedCount = currentData.filter(r => !r.needs_review && excludedSkus.has(excludeKey(r))).length;
      const badges = [];
      if (anchorCount > 0 && !anchorsOnly) badges.push(`<span style="color: #c89b32; font-size: 10px;">(${anchorCount} Hero)</span>`);
      if (dataFeeCount > 0 && !dataFeesOnly) badges.push(`<span style="color: #6dab84; font-size: 10px;">(${dataFeeCount} rebate)</span>`);
      if (saleCount > 0 && !saleFlaggedOnly) badges.push(`<span style="color: #d6b446; font-size: 10px;">(${saleCount} on sale)</span>`);
      if (excludedCount > 0 && !showExcluded) badges.push(`<span style="color: var(--text-dim); font-size: 10px;">(${excludedCount} excluded hidden)</span>`);
      document.getElementById("reorder-summary").innerHTML = reorderSummaryHTML(filtered, badges);
    }

    async function refetch() {
      const params = new URLSearchParams();
      if (storeFilter.value) params.set("store", storeFilter.value);
      params.set("top_level", typeFilter.value);
      if (urgencyFilter.value && urgencyFilter.value !== "all") {
        params.set("urgency", urgencyFilter.value);
      }
      if (ocsOutToggle.checked) params.set("include_ocs_out", "true");
      if (mixAwareToggle.checked) params.set("mix_aware", "true");
      // Exposed so the Suggested Additions panel can refresh the table after
      // 'Add' (the new trial-add row needs to appear).
      window._reorderRefetch = refetch;
      // Loading state: spinner in the table, dim the KPI/Highlights panels.
      const tableBox = document.getElementById("reorder-table");
      const kpiBox = document.getElementById("reorder-kpis");
      const hlBox = document.getElementById("reorder-highlights");
      if (tableBox) tableBox.innerHTML = `<div class="loading"><span class="spinner"></span> Updating…</div>`;
      if (kpiBox) kpiBox.classList.add("is-loading");
      if (hlBox) hlBox.classList.add("is-loading");
      try {
        const d = await api(`/api/reorder?${params.toString()}`);
        currentData = d.recommendations;
        if (kpiBox) kpiBox.innerHTML = kpiStripHTML(d.kpis);
        if (hlBox) hlBox.innerHTML = highlightsHTML(d.kpis);
        renderMixSummary(d.mix_multipliers);
        populateCategoryFilter();
        applyTextFilter();
        // Suggested Additions: only show when a single store is selected
        // (cross-store comparisons don't make sense without a target store).
        loadSuggestedAdditions(storeFilter.value);
      } catch (e) {
        if (tableBox) tableBox.innerHTML = `<div class="error"><strong>Couldn't load the reorder report</strong>${escapeHtml(e.message || String(e))}</div>`;
      } finally {
        if (kpiBox) kpiBox.classList.remove("is-loading");
        if (hlBox) hlBox.classList.remove("is-loading");
      }
    }

    storeFilter.addEventListener("change", () => {
      // When store changes, swap the exclusion sets to the new store's
      excludedSkus = loadExclusions();
      reviewIncludedSkus = loadReviewIncluded();
      updateExcludedUI();
      refetch();
    });
    typeFilter.addEventListener("change", refetch);
    urgencyFilter.addEventListener("change", refetch);
    ocsOutToggle.addEventListener("change", refetch);
    mixAwareToggle.addEventListener("change", refetch);
    anchorsOnlyToggle.addEventListener("change", applyTextFilter);
    document.getElementById("data-fees-only").addEventListener("change", applyTextFilter);
    document.getElementById("sale-flagged-only").addEventListener("change", applyTextFilter);
    document.getElementById("category-filter").addEventListener("change", applyTextFilter);
    document.getElementById("show-excluded").addEventListener("change", applyTextFilter);

    // Include/Exclude checkbox click (event delegation — handles dynamic rows)
    // Inverted logic: checked = include (default), unchecked = exclude.
    // Internally we still maintain the excludedSkus set as the source of truth.
    // Unpin a manually-pinned SKU (Add to Reorder) from the status cell.
    document.getElementById("reorder-table").addEventListener("click", async (e) => {
      const a = e.target.closest(".pin-unpin");
      if (!a) return;
      e.preventDefault();
      const variant = a.dataset.variant;
      try {
        await fetch(`${API}/api/reorder/pin?ocs_variant=${encodeURIComponent(variant)}`, {
          method: "DELETE", credentials: "include" });
        refetch();
      } catch (err) { alert("Unpin failed: " + err.message); }
    });

    document.getElementById("reorder-table").addEventListener("change", (e) => {
      const cb = e.target;
      if (!cb.classList.contains("exclude-cb")) return;
      const key = `${cb.dataset.sku}|${cb.dataset.loc}`;
      const isReview = cb.dataset.review === '1';
      if (isReview) {
        // Manual-review rows opt IN via reviewIncludedSkus (default excluded).
        if (cb.checked) reviewIncludedSkus.add(key); else reviewIncludedSkus.delete(key);
        saveReviewIncluded(reviewIncludedSkus);
      } else {
        if (cb.checked) excludedSkus.delete(key);  // checked = include
        else excludedSkus.add(key);                 // unchecked = exclude
        saveExclusions(excludedSkus);
      }
      updateExcludedUI();
      // Re-grey the row in place without a full re-render.
      const row = cb.closest('tr');
      if (row) row.style.opacity = cb.checked ? '' : '0.5';
      // Recompute summary.
      const summary = document.getElementById("reorder-summary");
      const excludedCount = currentData.filter(r => !r.needs_review && excludedSkus.has(excludeKey(r))).length;
      const showExcluded = document.getElementById("show-excluded").checked;
      const anchorsOnly = anchorsOnlyToggle.checked;
      let visible = currentData;
      if (anchorsOnly) visible = visible.filter(r => r.is_top_sku);
      const categoryFilter = document.getElementById("category-filter").value;
      if (categoryFilter) visible = visible.filter(r => r.category === categoryFilter);
      if (!showExcluded) visible = visible.filter(r => r.needs_review || !isRowExcluded(r));
      const anchorCount = visible.filter(r => r.is_top_sku).length;
      const cbBadges = [];
      if (anchorCount > 0 && !anchorsOnly) cbBadges.push(`<span style="color: #c89b32; font-size: 10px;">(${anchorCount} Hero)</span>`);
      if (excludedCount > 0 && !showExcluded) cbBadges.push(`<span style="color: var(--text-dim); font-size: 10px;">(${excludedCount} excluded hidden)</span>`);
      summary.innerHTML = reorderSummaryHTML(visible, cbBadges);
    });

    // Clear exclusions button
    document.getElementById("clear-excluded-btn").addEventListener("click", () => {
      if (excludedSkus.size === 0) return;
      if (!confirm(`Clear ${excludedSkus.size} exclusion mark(s) for this store? This cannot be undone.`)) return;
      excludedSkus.clear();
      saveExclusions(excludedSkus);
      updateExcludedUI();
      applyTextFilter();
    });

    // Legend button — shows what every tag means
    document.getElementById("reorder-legend-btn").addEventListener("click", showReorderLegend);
    // Diagnose button — open a modal to look up why a specific SKU is/isn't on the report
    document.getElementById("reorder-diagnose-btn").addEventListener("click", showReorderDiagnose);

    // Populate category filter from initial data and keep it in sync
    populateCategoryFilter();

    document.getElementById("reorder-excel-btn").addEventListener("click", () => {
      const params = new URLSearchParams();
      if (storeFilter.value) params.set("store", storeFilter.value);
      params.set("top_level", typeFilter.value);
      if (urgencyFilter.value && urgencyFilter.value !== "all") params.set("urgency", urgencyFilter.value);
      if (ocsOutToggle.checked) params.set("include_ocs_out", "true");
      if (mixAwareToggle.checked) params.set("mix_aware", "true");
      downloadUrl(`/api/export/reorder?${params.toString()}`);
    });
    search.addEventListener("input", applyTextFilter);

    // ==== Export to OCS Template ====
    // Fills the selected store's latest auto-pulled OrderExport with the
    // engine's reorder quantities and downloads it, ready to upload to OCS.
    const exportOcsBtn = document.getElementById("reorder-export-ocs-btn");
    if (exportOcsBtn) exportOcsBtn.addEventListener("click", async () => {
      const store = storeFilter.value;
      if (!store) {
        alert("Select a single store (store filter, top-right) before exporting an OCS order template — orders are placed per store.");
        return;
      }
      const orig = exportOcsBtn.innerHTML;
      exportOcsBtn.disabled = true;
      exportOcsBtn.textContent = "Preparing…";
      try {
        const res = await fetch(`/api/reorder/export-ocs-template?store=${encodeURIComponent(store)}`, { credentials: "same-origin" });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || "Export failed");
        }
        const blob = await res.blob();
        const cd = res.headers.get("content-disposition") || "";
        const m = cd.match(/filename="?([^"]+)"?/);
        const fname = m ? m[1] : `OCS_Order_${store}.xlsx`;
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert("Export failed: " + e.message);
      } finally {
        exportOcsBtn.disabled = false;
        exportOcsBtn.innerHTML = orig;
      }
    });

    // ==== Compare My Order ====
    // Upload a manager's built OCS order (CartExport/OrderExport .xlsx with
    // quantities) and diff it against the engine's recommendation for the store.
    const compareBtn = document.getElementById("reorder-compare-btn");
    const compareFile = document.getElementById("reorder-compare-file");
    if (compareBtn && compareFile) {
      compareBtn.addEventListener("click", () => {
        const store = storeFilter.value;
        if (!store) {
          alert("Select a single store (store filter, top-right) before comparing an order — orders are placed per store.");
          return;
        }
        compareFile.value = "";
        compareFile.click();
      });
      compareFile.addEventListener("change", async () => {
        const file = compareFile.files[0];
        if (!file) return;
        const store = storeFilter.value;
        if (!store) { alert("Select a store first."); return; }
        const orig = compareBtn.innerHTML;
        compareBtn.disabled = true;
        compareBtn.textContent = "Comparing…";
        try {
          const fd = new FormData();
          fd.append("file", file);
          fd.append("location_id", store);
          const res = await fetch("/api/order-fill/compare", { method: "POST", body: fd, credentials: "same-origin" });
          const d = await res.json().catch(() => ({ detail: res.statusText }));
          if (!res.ok) throw new Error(d.detail || "Comparison failed");
          showOrderCompare(d, store, file.name);
        } catch (e) {
          alert("Comparison failed: " + e.message);
        } finally {
          compareBtn.disabled = false;
          compareBtn.innerHTML = orig;
        }
      });
    }

  } catch (e) { showError(e); }
}

// ========================================================================
// Reorder Report — "Compare My Order" modal
// ========================================================================
// Renders the variance report from /api/order-fill/compare: a manager's built
// OCS order vs the engine's recommendation, bucketed into missed / under /
// over / on-target with dollar deltas.
function showOrderCompare(data, store, fileName) {
  const s = data.summary || {};
  const lines = data.lines || [];
  const b = s.buckets || {};
  const money = (n) => (n < 0 ? "-$" : "$") + Math.abs(Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const bucketMeta = {
    missed:    { label: "Missed", color: "#d66464", bg: "rgba(214,100,100,0.15)", desc: "Engine wanted it — none ordered" },
    under:     { label: "Under-ordered", color: "#dc965a", bg: "rgba(220,150,90,0.15)", desc: "Ordered less than recommended" },
    over:      { label: "Over-ordered", color: "#6aa6d6", bg: "rgba(106,166,214,0.15)", desc: "Ordered more than recommended" },
    on_target: { label: "On target", color: "#6fcf85", bg: "rgba(80,180,100,0.15)", desc: "Matches the recommendation" },
  };
  const bucketTag = (bk) => {
    const m = bucketMeta[bk] || { label: bk, color: "#999", bg: "rgba(150,150,150,0.15)" };
    return `<span class="tag" style="background: ${m.bg}; color: ${m.color}; font-size: 9px; padding: 1px 6px; white-space: nowrap;">${m.label}</span>`;
  };
  const urgencyTag = (u) => {
    if (!u) return "";
    const cls = urgencyTagClass(u);
    return `<span class="tag ${cls}" style="font-size: 9px; padding: 1px 5px;">${u}</span>`;
  };

  // Bucket summary chips
  const chip = (bk) => {
    const m = bucketMeta[bk];
    return `<div style="flex: 1; min-width: 110px; background: ${m.bg}; border: 1px solid ${m.color}33; border-radius: 6px; padding: 8px 10px;">
      <div style="font-size: 20px; font-weight: 600; color: ${m.color};">${b[bk] || 0}</div>
      <div style="font-size: 11px; color: var(--text-dim);">${m.label}</div>
      <div style="font-size: 10px; color: var(--text-faint);">${m.desc}</div>
    </div>`;
  };

  const critWarn = (s.missed_critical_count || 0) > 0
    ? `<div style="margin: 10px 0 0; padding: 8px 12px; background: rgba(214,100,100,0.12); border: 1px solid rgba(214,100,100,0.4); border-radius: 6px; font-size: 12px; color: #d66464;">
         ⚠ <strong>${s.missed_critical_count}</strong> stockout/critical SKU(s) the engine flagged were <strong>not ordered</strong>. These are likely lost sales — review the Missed rows below.
       </div>`
    : "";

  const rowHtml = (l) => {
    const dColor = l.delta_cost > 0 ? "#6aa6d6" : (l.delta_cost < 0 ? "#dc965a" : "var(--text-dim)");
    const heroStar = l.is_top_sku ? ' <span style="color:#c89b32;" title="Hero SKU">★</span>' : "";
    const notOffered = !l.in_template ? ' <span class="tag" style="font-size:8px;padding:0 4px;background:rgba(150,150,150,0.15);color:#999;">not offered</span>' : "";
    return `<tr style="border-bottom: 1px solid var(--border);">
      <td style="padding: 6px 8px;">${bucketTag(l.bucket)}</td>
      <td style="padding: 6px 8px;">
        <div style="font-size: 12px;">${escapeHtml(l.product_name || l.sku)}${heroStar}${notOffered}</div>
        <div style="font-size: 10px; color: var(--text-faint);">${escapeHtml(l.brand || "")}${l.brand ? " · " : ""}${escapeHtml(l.sku)}</div>
      </td>
      <td style="padding: 6px 8px; text-align: center;">${urgencyTag(l.urgency)}</td>
      <td style="padding: 6px 8px; text-align: right;">${l.on_hand != null ? l.on_hand : "—"}</td>
      <td style="padding: 6px 8px; text-align: right;">${l.daily_velocity != null ? l.daily_velocity.toFixed(2) : "—"}</td>
      <td style="padding: 6px 8px; text-align: right; font-weight: 600;">${l.ordered_cases}</td>
      <td style="padding: 6px 8px; text-align: right; font-weight: 600;">${l.engine_cases}</td>
      <td style="padding: 6px 8px; text-align: right; color: ${dColor};">${l.delta_cases > 0 ? "+" : ""}${l.delta_cases}</td>
      <td style="padding: 6px 8px; text-align: right; color: ${dColor};">${money(l.delta_cost)}</td>
    </tr>`;
  };

  const overlay = document.createElement("div");
  overlay.id = "compare-overlay";
  overlay.style.cssText = "position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;";
  overlay.innerHTML = `
    <div style="background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; max-width: 1000px; width: 100%; max-height: 92vh; overflow: auto;">
      <div style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline;">
        <div>
          <h3 style="margin: 0;">Order vs. Recommendation — ${escapeHtml(store)}</h3>

            <div style="font-size: 11px; color: var(--text-faint);">${s.ordered_cases_total || 0} cases · ${s.ordered_lines || 0} lines</div>

          <div style="flex: 1; min-width: 150px;">
            <div style="font-size: 11px; color: var(--text-dim);">Engine recommended</div>
            <div style="font-size: 22px; font-weight: 600;">${money(s.engine_cost_total)}</div>
            <div style="font-size: 11px; color: var(--text-faint);">${s.engine_cases_total || 0} cases · ${s.engine_lines || 0} lines</div>
          </div>
          <div style="flex: 1; min-width: 150px;">
            <div style="font-size: 11px; color: var(--text-dim);">Net variance</div>
            <div style="font-size: 22px; font-weight: 600; color: ${(s.delta_cost_total||0) < 0 ? '#dc965a' : '#6aa6d6'};">${money(s.delta_cost_total)}</div>

          ${chip("missed")}${chip("under")}${chip("over")}${chip("on_target")}
        </div>
        ${critWarn}
        <p style="font-size: 11px; color: var(--text-faint); margin: 14px 0 6px;">
          Quantities in <strong>cases</strong>. Δ = ordered − recommended. Engine anchored to the latest sales date, same as the Reorder Report. Sorted by biggest dollar gap.
        </p>
        <div style="overflow-x: auto;">
          <table style="width: 100%; font-size: 12px; border-collapse: collapse;">
            <thead>
              <tr style="text-align: left; border-bottom: 2px solid var(--border); color: var(--text-dim); font-size: 11px;">
                <th style="padding: 6px 8px;">Status</th>
                <th style="padding: 6px 8px;">Product</th>
                <th style="padding: 6px 8px; text-align: center;">Urgency</th>
                <th style="padding: 6px 8px; text-align: right;">On hand</th>
                <th style="padding: 6px 8px; text-align: right;">Velocity</th>
                <th style="padding: 6px 8px; text-align: right;">Ordered</th>
                <th style="padding: 6px 8px; text-align: right;">Rec.</th>
                <th style="padding: 6px 8px; text-align: right;">Δ cases</th>
                <th style="padding: 6px 8px; text-align: right;">Δ $</th>
              </tr>
            </thead>
            <tbody>
              ${lines.length ? lines.map(rowHtml).join("") : `<tr><td colspan="9" style="padding: 20px; text-align: center; color: var(--text-dim);">No differences to show — the order matches the recommendation, or nothing was ordered.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("compare-close").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
}

function urgencyTagClass(u) {
  return ({
    stockout: "tag-stockout", critical: "tag-critical",
    high: "tag-warning", medium: "tag-info",
  })[u] || "tag";
}

async function renderStockouts() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading"><span class="spinner"></span> Loading stockouts…</div>`;
  try {
    const [locs, initialData] = await Promise.all([
      api("/api/locations"),
      api("/api/stockouts"),
    ]);
    let data = initialData;

    main.innerHTML = `
      <div class="section-header">
        <div>
          <div class="kicker">Active Stockouts · Lost Sales</div>
          <h2>Selling fast, inventory at zero</h2>
        </div>
        <div class="controls-row">
          <input type="search" id="stockout-search" placeholder="Search...">
          <select id="stockout-type-filter">
            <option value="">Cannabis + Accessories</option>
            <option value="Cannabis">Cannabis only</option>
            <option value="Accessories">Accessories only</option>
          </select>
          <select id="stockout-store-filter">
            <option value="">All stores</option>
            ${locs.map(l => `<option value="${l.id}">${l.short_name || l.name}</option>`).join("")}
          </select>
          <span class="tag tag-critical" id="stockout-risk">${fmt$(data.revenue_at_risk)}/mo at risk</span>
          ${excelButtonHtml("stockout-excel-btn")}
        </div>
      </div>

      <div class="card">
        <div id="stockout-table"></div>
      </div>
    `;

    const columns = [
      { key: 'product_name', label: 'Product',
        render: r => {
          const ocsTag = r.ocs_out_of_stock
            ? '<span class="tag tag-critical" style="font-size: 9px; padding: 1px 5px; margin-right: 4px;" title="Currently out of stock at OCS too">OCS OUT</span>'
            : '';
          const rebate = rebateBadgeHtml(r);
          return `${rebate}${ocsTag}${escapeHtml(r.product_name)}<div class="sku">${r.sku} · ${r.category || "—"}</div>`;
        } },
      { key: 'location_id', label: 'Store', render: r => storeLabel(r.location_id) },
      { key: 'units_7d', label: '7D', type: 'number', align: 'right', group: 'Units Sold',
        tooltip: 'Total units sold in the trailing 7 days.' },
      { key: 'units_14d', label: '14D', type: 'number', align: 'right', group: 'Units Sold',
        tooltip: 'Total units sold in the trailing 14 days.' },
      { key: 'units_30d', label: '30D', type: 'number', align: 'right', group: 'Units Sold',
        tooltip: 'Total units sold in the trailing 30 days.' },
      { key: 'velocity_7d', label: '/day 7D', type: 'number', align: 'right', group: 'Sales Velocity',
        tooltip: 'Trailing 7-day units sold ÷ 7 = average units sold per day over the past week. Best signal for current demand.',
        render: r => (r.velocity_7d || 0).toFixed(2) },
      { key: 'velocity_14d', label: '/day 14D', type: 'number', align: 'right', group: 'Sales Velocity',
        tooltip: 'Trailing 14-day units sold ÷ 14. Smooths out single-week noise.',
        render: r => (r.velocity_14d || 0).toFixed(2) },
      { key: 'daily_velocity', label: '/day 30D', type: 'number', align: 'right', group: 'Sales Velocity',
        tooltip: 'Trailing 30-day units sold ÷ 30. The default reorder-engine velocity. Smoothest but slowest to react to trend changes.',
        render: r => r.daily_velocity.toFixed(2) },
      { key: 'revenue_30d', label: 'Revenue 30D', type: 'number', align: 'right',
        tooltip: 'Total revenue from this SKU over the trailing 30 days at this store.',
        render: r => fmt$(r.revenue_30d) },
      { key: 'note', label: 'Reason for Stockout / Other Notes', sortable: false,
        tooltip: 'Click to add or edit a note explaining the stockout.',
        render: r => `<input type="text" class="stockout-note" data-sku="${r.sku}" data-loc="${r.location_id}" value="${escapeHtml(r.note || '')}" placeholder="add note…" style="width: 220px; font-size: 11px; padding: 4px 6px;">` },
    ];

    let currentData = data.items;
    const wireNoteListeners = () => {
      document.querySelectorAll('.stockout-note').forEach(input => {
        input.addEventListener('blur', async () => {
          const sku = input.dataset.sku;
          const loc = input.dataset.loc;
          const note = input.value.trim();
          try {
            await fetch('/api/stockouts/note', {
              method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({sku, location_id: loc, note}),
            });
            // Visual confirmation
            input.style.borderColor = 'var(--ok, #6a7)';
            setTimeout(() => { input.style.borderColor = ''; }, 1000);
          } catch (e) {
            input.style.borderColor = 'var(--critical)';
          }
        });
      });
    };
    const redraw = () => {
      const q = document.getElementById("stockout-search").value.trim().toLowerCase();
      const filtered = q
        ? currentData.filter(r => (r.product_name || '').toLowerCase().includes(q) || (r.sku || '').toLowerCase().includes(q))
        : currentData;
      renderTable('stockout-table', filtered, columns, { defaultSort: 'revenue_30d', defaultDir: 'desc' });
      wireNoteListeners();
    };
    renderTable('stockout-table', currentData, columns, {
      defaultSort: 'revenue_30d', defaultDir: 'desc',
      emptyText: 'No active stockouts. Nice.'
    });
    wireNoteListeners();

    const refetch = async () => {
      const params = new URLSearchParams();
      const type = document.getElementById("stockout-type-filter").value;
      const store = document.getElementById("stockout-store-filter").value;
      if (type) params.set("top_level", type);
      if (store) params.set("store", store);
      const url = params.toString() ? `/api/stockouts?${params.toString()}` : "/api/stockouts";
      data = await api(url);
      currentData = data.items;
      document.getElementById("stockout-risk").textContent = `${fmt$(data.revenue_at_risk)}/mo at risk`;
      redraw();
    };

    document.getElementById("stockout-search").addEventListener("input", redraw);
    document.getElementById("stockout-type-filter").addEventListener("change", refetch);
    document.getElementById("stockout-store-filter").addEventListener("change", refetch);

    document.getElementById("stockout-excel-btn").addEventListener("click", () => {
      const params = new URLSearchParams();
      const type = document.getElementById("stockout-type-filter").value;
      const store = document.getElementById("stockout-store-filter").value;
      if (type) params.set("top_level", type);
      if (store) params.set("store", store);
      downloadUrl(`/api/export/stockouts?${params.toString()}`);
    });

  } catch (e) { showError(e); }
}

// ========================================================================
// DEAD STOCK
// ========================================================================
// DEAD STOCK / OVERSTOCK — unified slow-mover + over-stocked view
// ========================================================================
// Single tab combining what used to be Dead Stock and Overstock.
// Data comes from /api/dead-stock-overstock which returns both buckets.
//
// The two buckets answer different questions:
//   DEAD       → "should we liquidate / discount this?"
//   OVERSTOCK  → "should we transfer some elsewhere?"
//
// Bucket filter lets users see one or the other; the default is both.

async function renderDeadStock() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading"><span class="spinner"></span> Loading slow movers &amp; overstock…</div>`;
  try {
    const [locs, initialData] = await Promise.all([
      api("/api/locations"),
      api("/api/dead-stock-overstock"),
    ]);
    let data = initialData;

    main.innerHTML = `
      <div class="section-header">
        <div>
          <div class="kicker">Dead Stock & Overstock · Capital tied up</div>
          <h2 id="ds-heading" style="white-space: nowrap;">Slow movers and over-stocked items</h2>
        </div>
        <div class="controls-row">
          <input type="search" id="ds-search" placeholder="Search...">
          <select id="ds-bucket-filter" title="Dead = no sales in window. Overstock = selling but >50 days on hand.">
            <option value="">Both buckets</option>
            <option value="dead">Dead only</option>
            <option value="overstock">Overstock only</option>
          </select>
          <select id="ds-type-filter">
            <option value="">Cannabis + Accessories</option>
            <option value="Cannabis">Cannabis only</option>
            <option value="Accessories">Accessories only</option>
          </select>
          <select id="ds-store-filter">
            <option value="">All stores</option>
            ${locs.map(l => `<option value="${l.id}">${l.short_name || l.name}</option>`).join("")}
          </select>
          <select id="ds-window" title="For DEAD bucket: how many days of sales history define 'dead'. Longer = stricter.">
            <option value="14">14d window</option>
            <option value="30" selected>30d window</option>
            <option value="60">60d window</option>
            <option value="90">90d window</option>
          </select>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Include items selling slowly (below 0.05/day), not just zero-sales items.">
            <input id="ds-nearly" type="checkbox"> Include nearly-dead
          </label>
          <span class="tag tag-warning" id="ds-totals">${fmt$(data.totals.combined_value)} tied up</span>
          ${excelButtonHtml("ds-excel-btn")}
        </div>
      </div>

      <div class="card">
        <div id="ds-summary" style="font-size: 11px; color: var(--text-dim); padding: 4px 16px 12px;">
          Dead: <strong style="color: var(--critical);">${fmt$(data.totals.dead_value)}</strong> ·
          Overstock: <strong style="color: var(--warning);">${fmt$(data.totals.overstock_value)}</strong>
        </div>
        <div class="table-scroll sticky-cols-4" id="ds-table"></div>
      </div>
    `;

    const bucketTag = b => {
      if (b === 'dead') return '<span class="tag tag-critical" style="font-size: 9px; padding: 1px 5px;">DEAD</span>';
      if (b === 'overstock') return '<span class="tag tag-warning" style="font-size: 9px; padding: 1px 5px;">OVER</span>';
      return '';
    };

    const fmtDate = (d) => {
      // d is ISO YYYY-MM-DD (already compact). Don't round-trip through
      // new Date(): it parses date-only strings as UTC midnight, which
      // displays as the PREVIOUS day in any western timezone.
      return d ? String(d).slice(0, 10) : '—';
    };

    const fmtDays = (n) => n == null ? '—' : (typeof n === 'number' ? Math.round(n) : n);

    const columns = [
      { key: 'bucket', label: 'Bucket', tooltip: 'DEAD = no sales in window. OVER = selling but >50 days on hand.',
        render: r => bucketTag(r.bucket) },
      { key: 'product_name', label: 'Product',
        render: r => `${rebateBadgeHtml(r)}${escapeHtml(r.product_name)}<div class="sku">${r.sku}</div>` },
      { key: 'location_id', label: 'Store', render: r => storeLabel(r.location_id) },
      { key: 'category', label: 'Category', render: r => r.category || '—' },
      { key: 'on_hand', label: 'On hand', type: 'number', align: 'right',
        tooltip: 'Current units on hand at this store.' },
      { key: 'days_on_hand', label: 'Days on hand', type: 'number', align: 'right',
        tooltip: 'Estimated days until current stock runs out at recent velocity. "—" = no recent sales.',
        render: r => fmtDays(r.days_on_hand) },
      { key: 'days_since_last_sold', label: 'Days since sold', type: 'number', align: 'right',
        tooltip: 'How many days since this SKU last sold at this store.',
        render: r => fmtDays(r.days_since_last_sold) },
      { key: 'last_received_date', label: 'Last received',
        tooltip: 'Most recent date this SKU was received at this store (from OCS invoices).',
        render: r => fmtDate(r.last_received_date) },
      { key: 'units_window', label: 'Sold in window', type: 'number', align: 'right',
        tooltip: 'Units sold within the dead-stock window selected above.',
        render: r => r.units_window || 0 },
      { key: 'daily_velocity', label: 'Units/day', type: 'number', align: 'right',
        tooltip: 'Average units sold per day over the selected window.',
        render: r => (r.daily_velocity || 0).toFixed(2) },
      { key: 'cost_tied_up', label: 'Cost tied up', type: 'number', align: 'right',
        render: r => fmt$2(r.cost_tied_up) },
      { key: 'retail_value', label: 'Retail value', type: 'number', align: 'right',
        render: r => fmt$2(r.retail_value) },
    ];

    let currentData = data.items;
    const redraw = () => {
      const q = document.getElementById("ds-search").value.trim().toLowerCase();
      const filtered = q
        ? currentData.filter(r => (r.product_name || '').toLowerCase().includes(q) || (r.sku || '').toLowerCase().includes(q))
        : currentData;
      renderTable('ds-table', filtered, columns, { defaultSort: 'cost_tied_up', defaultDir: 'desc' });
    };
    renderTable('ds-table', currentData, columns, {
      defaultSort: 'cost_tied_up', defaultDir: 'desc',
      emptyText: 'Nothing dead or overstocked. Nice.'
    });

    const refetch = async () => {
      const params = new URLSearchParams();
      const bucket = document.getElementById("ds-bucket-filter").value;
      const type = document.getElementById("ds-type-filter").value;
      const store = document.getElementById("ds-store-filter").value;
      const window = document.getElementById("ds-window").value;
      const nearly = document.getElementById("ds-nearly").checked;
      if (bucket) params.set("bucket", bucket);
      if (type) params.set("top_level", type);
      if (store) params.set("store", store);
      if (window) params.set("window_days", window);
      if (nearly) params.set("nearly_dead", "true");
      const url = `/api/dead-stock-overstock?${params.toString()}`;
      const tableBox = document.getElementById("ds-table");
      if (tableBox) tableBox.innerHTML = `<div class="loading"><span class="spinner"></span> Updating…</div>`;
      try {
        data = await api(url);
      } catch (e) {
        if (tableBox) tableBox.innerHTML = `<div class="error"><strong>Couldn't load dead stock / overstock</strong>${escapeHtml(e.message || String(e))}</div>`;
        return;
      }
      currentData = data.items;
      document.getElementById("ds-totals").textContent = `${fmt$(data.totals.combined_value)} tied up`;
      document.getElementById("ds-summary").innerHTML =
        `Dead: <strong style="color: var(--critical);">${fmt$(data.totals.dead_value)}</strong> · ` +
        `Overstock: <strong style="color: var(--warning);">${fmt$(data.totals.overstock_value)}</strong>`;
      redraw();
    };

    ["ds-search"].forEach(id => document.getElementById(id).addEventListener("input", redraw));
    ["ds-bucket-filter","ds-type-filter","ds-store-filter","ds-window","ds-nearly"].forEach(
      id => document.getElementById(id).addEventListener("change", refetch));

    document.getElementById("ds-excel-btn").addEventListener("click", () => {
      const params = new URLSearchParams();
      const bucket = document.getElementById("ds-bucket-filter").value;
      const type = document.getElementById("ds-type-filter").value;
      const store = document.getElementById("ds-store-filter").value;
      const window_days = document.getElementById("ds-window").value;
      const nearly = document.getElementById("ds-nearly").checked;
      if (bucket) params.set("bucket", bucket);
      if (type) params.set("top_level", type);
      if (store) params.set("store", store);
      if (window_days) params.set("window_days", window_days);
      if (nearly) params.set("nearly_dead", "true");
      // The export endpoint doesn't yet exist for the unified view; fall back
      // to dead-stock export until that's added.
      downloadUrl(`/api/export/dead-stock?${params.toString()}`);
    });
  } catch (e) { showError(e); }
}

// ========================================================================
// Helpers
// ========================================================================
function escapeHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// Prettify an LP/supplier name that OCS stores in ALL CAPS (e.g.
// "PEACE NATURALS PROJECT INC." -> "Peace Naturals Project Inc."). Names that are
// already mixed-case (e.g. "HydRx Farms ltd.") are left untouched.
function titleCaseLp(s) {
  if (!s) return '';
  s = String(s);
  if (/[a-z]/.test(s)) return s;            // already mixed-case — leave it
  return s.toLowerCase().replace(/[a-z0-9]+/g, w => w.charAt(0).toUpperCase() + w.slice(1));
}
// Reduce a licensed-producer legal name to its trade name: for a numbered corp
// doing business as a brand ('10392804 Canada Inc. DBA Sweet Vengeance'), keep
// only the part after 'DBA'. Otherwise return the name unchanged.
function lpTradeName(s) {
  if (!s) return s;
  const m = /\bd\.?b\.?a\.?\b[:\s]*(.+)$/i.exec(String(s));
  return m ? m[1].trim() : s;
}
// Case- and punctuation-insensitive key for matching LP/brand names.
function normLp(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ''); }
