// System Health — operational visibility
// ========================================================================
// Single page that answers: "Is this system healthy right now?"
// Sections: data freshness per source, per-store coverage, DB stats,
// recent activity stream, backup status, manual backup button.
//
// Polls /api/system/health on tab load. Refresh button re-polls.

async function renderSystemHealth() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading"><span class="spinner"></span> Checking system health…</div>`;
  try {
    const data = await api("/api/system/health");

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <div>
            <div class="kicker">Admin · Operational Visibility</div>
            <h2 style="white-space: nowrap;">System Health</h2>
          </div>
          <div>
            <button class="btn" id="sh-refresh">Refresh</button>
            <button class="btn" id="sh-backup-now" style="margin-left: 6px;">Backup now</button>
          </div>
        </div>
        <div style="font-size: 11px; color: var(--text-dim);">Last checked: ${escapeHtml(data.checked_at)}</div>
      </div>

      <div class="hint-box" style="margin-bottom: 14px;">
        <strong>Quick read:</strong> green = healthy, yellow = aging, red = stale. If anything is red, click into the relevant import workflow and refresh that data source.
      </div>

      <div id="sh-content"></div>
    `;

    document.getElementById("sh-refresh").addEventListener("click", renderSystemHealth);
    document.getElementById("sh-backup-now").addEventListener("click", async () => {
      const btn = document.getElementById("sh-backup-now");
      btn.disabled = true; btn.textContent = "Backing up...";
      try {
        const res = await fetch(`${API}/api/system/backup-now`, { method: 'POST' });
        if (!res.ok) {
          const err = await res.json();
          alert("Backup failed: " + (err.detail || "unknown"));
        } else {
          const result = await res.json();
          alert(`Backup created: ${result.path}\nSize: ${(result.size_bytes / 1024).toFixed(1)} KB\n${result.pruned ? `Pruned ${result.pruned} old backups` : 'No old backups to prune'}`);
          await renderSystemHealth();
          return;
        }
      } catch (e) {
        alert("Backup failed: " + e.message);
      } finally {
        btn.disabled = false; btn.textContent = "Backup now";
      }
    });

    renderSystemHealthContent(data);
  } catch (e) { showError(e); }
}

function renderSystemHealthContent(data) {
  const container = document.getElementById("sh-content");

  // Status pill helper. Returns colored tag based on age vs thresholds.
  const sourceTag = (src) => {
    if (src.age_days === null || src.age_days === undefined) {
      if (src.row_count > 0) return '<span class="tag" style="background: rgba(120, 120, 120, 0.15); color: var(--text-dim); font-size: 10px;">UNTRACKED</span>';
      return '<span class="tag" style="background: rgba(214, 100, 100, 0.15); color: #d66464; font-size: 10px;">EMPTY</span>';
    }
    if (src.age_days <= (src.expected_cadence_days || 1)) return '<span class="tag" style="background: rgba(80, 180, 100, 0.15); color: #6dab84; font-size: 10px;">FRESH</span>';
    if (src.age_days <= (src.stale_after_days || 30)) return '<span class="tag" style="background: rgba(214, 180, 70, 0.15); color: #c89b32; font-size: 10px;">AGING</span>';
    return '<span class="tag" style="background: rgba(214, 100, 100, 0.15); color: #d66464; font-size: 10px;">STALE</span>';
  };

  const storeFreshnessTag = (ageDays, thresholdDays) => {
    if (ageDays === null || ageDays === undefined) return '<span style="color: var(--text-faint);">—</span>';
    if (ageDays <= thresholdDays) return `<span style="color: #6dab84;">${ageDays}d</span>`;
    if (ageDays <= thresholdDays * 3) return `<span style="color: #c89b32;">${ageDays}d</span>`;
    return `<span style="color: #d66464; font-weight: 600;">${ageDays}d</span>`;
  };

  // ----- Build sections -----
  let html = '';

  // 1. Data sources
  html += `
    <div class="card" style="margin-bottom: 16px;">
      <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
        <strong>Data Sources</strong>
        <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">${data.sources.length} sources tracked</span>
      </div>
      <table style="font-size: 12px; margin: 0;">
        <thead>
          <tr>
            <th>Source</th>
            <th>Last update</th>
            <th class="num">Age</th>
            <th class="num">Rows</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${data.sources.map(s => `
            <tr>
              <td><strong>${escapeHtml(s.label)}</strong>${s.note ? `<div class="sku">${escapeHtml(s.note)}</div>` : ''}</td>
              <td>${s.last_update || '<span style="color: var(--text-faint);">—</span>'}</td>
              <td class="num">${s.age_days !== null && s.age_days !== undefined ? `${s.age_days}d` : '—'}</td>
              <td class="num">${(s.row_count !== undefined ? s.row_count : (s.snapshot_count !== undefined ? s.snapshot_count : 0)).toLocaleString()}</td>
              <td>${sourceTag(s)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  // 2. Per-store coverage
  html += `
    <div class="card" style="margin-bottom: 16px;">
      <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
        <strong>Per-store coverage</strong>
        <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">Last data per store, age in days</span>
      </div>
      <table style="font-size: 12px; margin: 0;">
        <thead>
          <tr>
            <th>Store</th>
            <th>Last IOH</th>
            <th class="num">IOH age</th>
            <th>Last Sales</th>
            <th class="num">Sales age</th>
            <th class="num">MI imports</th>
            <th class="num">MI age</th>
          </tr>
        </thead>
        <tbody>
          ${data.per_store.length === 0 ? `
            <tr><td colspan="7" style="padding: 16px; color: var(--text-dim); text-align: center;">No active stores configured.</td></tr>
          ` : data.per_store.map(s => `
            <tr>
              <td><strong>${escapeHtml(s.store_name)}</strong></td>
              <td style="font-size: 11px;">${s.last_ioh ? s.last_ioh.split(' ')[0] : '<span style="color: var(--text-faint);">—</span>'}</td>
              <td class="num">${storeFreshnessTag(s.ioh_age_days, 3)}</td>
              <td style="font-size: 11px;">${s.last_sales || '<span style="color: var(--text-faint);">—</span>'}</td>
              <td class="num">${storeFreshnessTag(s.sales_age_days, 2)}</td>
              <td class="num">${s.mi_imports || 0}</td>
              <td class="num">${storeFreshnessTag(s.mi_age_days, 21)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  // 3. DB stats + backups
  if (data.db_stats && !data.db_stats.error) {
    const top10 = Object.entries(data.db_stats.table_counts || {})
      .filter(([_, c]) => c !== null && c > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 10);

    html += `
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div class="card">
          <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
            <strong>Database</strong>
          </div>
          <div style="padding: 14px;">
            <div style="font-size: 12px; line-height: 1.7;">
              <div><strong>Size:</strong> ${escapeHtml(data.db_stats.db_size_human)}</div>
              <div><strong>Total rows:</strong> ${data.db_stats.total_rows.toLocaleString()}</div>
              <div><strong>Last modified:</strong> ${escapeHtml(data.db_stats.modified_at)}</div>
              <div style="margin-top: 8px; font-weight: 600; font-size: 11px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em;">Top 10 tables</div>
              ${top10.map(([t, c]) => `
                <div style="display: flex; justify-content: space-between; font-size: 11px;">
                  <code>${escapeHtml(t)}</code>
                  <span class="num">${c.toLocaleString()}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="card">
          <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
            <strong>Backups</strong>
          </div>
          <div style="padding: 14px;">
            ${data.backup_summary && data.backup_summary.count > 0 ? `
              <div style="font-size: 12px; line-height: 1.7;">
                <div><strong>Backup count:</strong> ${data.backup_summary.count}</div>
                <div><strong>Latest:</strong> ${escapeHtml(data.backup_summary.latest.filename)}</div>
                <div><strong>Latest age:</strong> ${escapeHtml(data.backup_summary.latest.created_at)}</div>
                <div><strong>Total size:</strong> ${(data.backup_summary.total_size_bytes / 1024 / 1024).toFixed(2)} MB</div>
                <div style="font-size: 11px; color: var(--text-dim); margin-top: 8px;">
                  Nightly automatic at 3am. Retention: 30 daily + 13 weekly Sundays.
                  Stored in <code>backups/</code> folder.
                </div>
              </div>
            ` : `
              <div style="font-size: 12px; color: var(--text-dim);">
                No backups yet. Click "Backup now" above to create the first one,
                or wait for the nightly 3am scheduler.
              </div>
            `}
          </div>
        </div>
      </div>
    `;
  }

  // 4. Recent activity
  html += `
    <div class="card" style="margin-bottom: 16px;">
      <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
        <strong>Recent activity</strong>
        <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">Last 20 events across all sources</span>
      </div>
      ${data.recent_activity.length === 0 ? `
        <div style="padding: 16px; color: var(--text-dim); font-size: 12px;">
          No recent activity logged.
        </div>
      ` : `
        <table style="font-size: 12px; margin: 0;">
          <thead><tr><th>When</th><th>Kind</th><th>Detail</th></tr></thead>
          <tbody>
            ${data.recent_activity.map(e => `
              <tr>
                <td style="color: var(--text-dim); font-size: 11px;">${escapeHtml(e.timestamp || '?')}</td>
                <td><span class="tag" style="font-size: 9px;">${escapeHtml(e.kind)}</span></td>
                <td>${escapeHtml(e.summary)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    </div>
  `;

  container.innerHTML = html;
}

// ========================================================================
// Settings — engine tuning UI
// ========================================================================
// Lets the user tweak engine parameters (reorder ceilings, velocity floor,
// pack-size threshold, hero classification, promo cascade, etc.) without
// touching code. Every change is logged in app_settings_history.
//
// UX:
//   - Settings grouped by section (Reorder Engine, Hero Classification, etc.)
//   - Each row: label + tooltip + value input + "Default: X" + "Reset" link
//   - Modified settings are highlighted (different background)
//   - Save button at the bottom of each section commits all changes in that section
//   - Recent changes panel shows the audit trail

async function renderSettings() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading"><span class="spinner"></span> Loading settings…</div>`;
  try {
    const [data, me] = await Promise.all([api("/api/settings"), api("/api/auth/me")]);
    const isAdmin = !!(me && me.logged_in && me.role === 'admin') || !!(me && me.bootstrap_mode);
    const sections = data.sections || {};
    const sectionNames = Object.keys(sections);

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <div>
            <div class="kicker">${isAdmin ? 'Admin · Engine Tuning' : 'Engine Tuning · Read-only'}</div>
            <h2 style="white-space: nowrap;">Settings</h2>
          </div>
          ${isAdmin ? `<div style="font-size: 11px; color: var(--text-dim);">
            Logged in as: <strong id="settings-author-display">${escapeHtml(getAuthor() || 'click to set name')}</strong>
            <button id="settings-set-author" class="btn-link" style="margin-left: 8px;">change</button>
          </div>` : ''}
        </div>
      </div>

      ${isAdmin ? `<div class="hint-box" style="margin-bottom: 14px;">
        Every change here flows through to the reorder engine on the next /api/reorder call. No restart needed.
        Changes are logged to the audit trail at the bottom. If you need to undo something, "Reset to default" is one click away.
      </div>` : `<div class="hint-box" style="margin-bottom: 14px;">
        <strong>Read-only view.</strong> These are the live engine settings — reorder ceilings, Hero classification, promo cascade, and the rest — so you can see exactly what the system is using. Only the administrator can change them.
      </div>`}

      <div id="settings-sections">
        ${sectionNames.map(name => renderSettingsSection(name, sections[name], isAdmin)).join("")}
      </div>

      <div class="card" style="margin-top: 24px;">
        <div style="padding: 16px; border-bottom: 1px solid var(--border);">
          <strong>Recent Changes</strong>
          <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">Audit trail of settings modifications</span>
        </div>
        <div id="settings-history" style="padding: 8px;">
          <div style="color: var(--text-faint); font-size: 11px; padding: 16px;">Loading…</div>
        </div>
      </div>
    `;

    if (isAdmin) {
      document.getElementById("settings-set-author").addEventListener("click", () => {
        const n = (prompt("Your name:", getAuthor() || "") || "").trim();
        if (n) {
          setAuthor(n);
          document.getElementById("settings-author-display").textContent = n;
        }
      });
      wireUpSettingsControls();
    }
    loadSettingsHistory();
  } catch (e) { showError(e); }
}

function renderSettingsSection(sectionName, settings, editable = true) {
  const rows = settings.map(s => {
    const inputId = `setting-${s.key.replace(/\./g, "-")}`;
    const isPercent = s.value_type === "percent";
    const isInt = s.value_type === "int" || s.value_type === "days";
    const step = isInt ? "1" : (s.value_type === "float" ? "0.01" : "0.1");
    const suffix = isPercent ? "%" : (s.value_type === "days" ? " days" : "");
    const modifiedStyle = s.is_modified
      ? 'background: rgba(214, 180, 70, 0.06); border-left: 2px solid var(--warning, #c89b32);'
      : '';

    return `
      <div class="setting-row" data-key="${escapeHtml(s.key)}" style="display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); ${modifiedStyle}">
        <div>
          <div style="font-size: 12px;">
            <strong>${escapeHtml(s.label)}</strong>
            ${s.is_modified ? '<span class="tag" style="font-size: 9px; padding: 1px 5px; margin-left: 6px; background: rgba(214,180,70,0.15); color: #c89b32;">MODIFIED</span>' : ''}
          </div>
          ${s.description ? `<div style="font-size: 11px; color: var(--text-dim); margin-top: 2px;">${escapeHtml(s.description)}</div>` : ''}
          <div style="font-size: 10px; color: var(--text-faint); margin-top: 2px;">
            Default: ${s.default_value}${suffix}
            ${s.min_value !== null ? ` · min: ${s.min_value}${suffix}` : ''}
            ${s.max_value !== null ? ` · max: ${s.max_value}${suffix}` : ''}
            · key: <code>${escapeHtml(s.key)}</code>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 4px;">
          ${editable
            ? `<input type="number" id="${inputId}" class="setting-input" data-key="${escapeHtml(s.key)}"
                 value="${isInt ? Math.round(s.value) : s.value}"
                 step="${step}"
                 min="${s.min_value !== null ? s.min_value : ''}"
                 max="${s.max_value !== null ? s.max_value : ''}"
                 style="width: 80px; text-align: right;">`
            : `<span style="font-family: ui-monospace, Menlo, monospace; font-size: 14px;">${isInt ? Math.round(s.value) : s.value}</span>`}
          <span style="font-size: 11px; color: var(--text-dim);">${suffix}</span>
        </div>
        <div style="display: flex; gap: 6px;">
          ${editable ? `<button class="btn setting-save" data-key="${escapeHtml(s.key)}" style="font-size: 11px;">Save</button>` : ''}
          ${editable && s.is_modified ? `<button class="btn-link setting-reset" data-key="${escapeHtml(s.key)}" style="font-size: 11px;">Reset</button>` : ''}
        </div>
      </div>
    `;
  }).join("");

  return `
    <div class="card" style="margin-bottom: 16px;">
      <div style="padding: 14px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
        <strong>${escapeHtml(sectionName)}</strong>
      </div>
      ${rows}
    </div>
  `;
}

function wireUpSettingsControls() {
  // Save individual setting
  document.querySelectorAll(".setting-save").forEach(btn => {
    btn.addEventListener("click", () => saveSetting(btn.dataset.key));
  });
  // Reset to default
  document.querySelectorAll(".setting-reset").forEach(btn => {
    btn.addEventListener("click", () => resetSetting(btn.dataset.key));
  });
  // Save on Enter key in input
  document.querySelectorAll(".setting-input").forEach(input => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        saveSetting(input.dataset.key);
      }
    });
  });
}

async function saveSetting(key) {
  const input = document.querySelector(`.setting-input[data-key="${CSS.escape(key)}"]`);
  if (!input) return;
  const value = parseFloat(input.value);
  if (isNaN(value)) { alert("Invalid number"); return; }
  const author = ensureAuthor() || "anonymous";

  try {
    const res = await fetch(`${API}/api/settings/${encodeURIComponent(key)}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value, changed_by: author }),
    });
    if (!res.ok) {
      const err = await res.json();
      alert("Save failed: " + (err.detail || "unknown"));
      return;
    }
    // Quick visual feedback
    const row = document.querySelector(`.setting-row[data-key="${CSS.escape(key)}"]`);
    if (row) {
      row.style.transition = "background 600ms";
      const orig = row.style.background;
      row.style.background = "rgba(80, 180, 100, 0.2)";
      setTimeout(() => { row.style.background = orig; }, 600);
    }
    // Refresh the page state so Modified tag + Reset button update
    setTimeout(() => renderSettings(), 700);
  } catch (e) { alert("Save failed: " + e.message); }
}

async function resetSetting(key) {
  if (!confirm(`Reset ${key} to default?`)) return;
  const author = ensureAuthor() || "anonymous";
  try {
    const res = await fetch(`${API}/api/settings/${encodeURIComponent(key)}/reset`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ changed_by: author }),
    });
    if (!res.ok) {
      const err = await res.json();
      alert("Reset failed: " + (err.detail || "unknown"));
      return;
    }
    await renderSettings();
  } catch (e) { alert("Reset failed: " + e.message); }
}

async function loadSettingsHistory() {
  try {
    const data = await api("/api/settings/_history?limit=50");
    const container = document.getElementById("settings-history");
    if (!container) return;
    if (data.items.length === 0) {
      container.innerHTML = '<div style="color: var(--text-faint); font-size: 11px; padding: 16px;">No changes yet.</div>';
      return;
    }
    container.innerHTML = `
      <table style="font-size: 11px;">
        <thead><tr>
          <th>When</th>
          <th>Setting</th>
          <th class="num">Old</th>
          <th class="num">New</th>
          <th>By</th>
          <th>Note</th>
        </tr></thead>
        <tbody>
          ${data.items.map(h => `
            <tr>
              <td style="color: var(--text-dim);">${h.changed_at}</td>
              <td><code>${escapeHtml(h.key)}</code></td>
              <td class="num" style="color: var(--text-faint);">${h.old_value !== null ? h.old_value : '—'}</td>
              <td class="num"><strong>${h.new_value}</strong></td>
              <td>${escapeHtml(h.changed_by || '—')}</td>
              <td style="color: var(--text-dim);">${escapeHtml(h.note || '')}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  } catch (e) {
    const container = document.getElementById("settings-history");
    if (container) {
      container.innerHTML = `<div class="error" style="padding: 16px; font-size: 11px;">Couldn't load history: ${escapeHtml(e.message)}</div>`;
    }
  }
}

// ========================================================================
// Router
// ========================================================================
const routes = {
  overview: renderOverview,
  reorder: renderReorder,
  stockouts: renderStockouts,
  deadstock: renderDeadStock,
  overstock: renderOverstock,
  transfers: renderTransfers,
  "cross-store": renderCrossStore,
  promos: renderPromos,
  inventory: renderInventory,
  "ocs-catalogue": renderOcsCatalogue,
  "market-intel": renderMarketIntel,
  mix: renderMixAnalysis,
  competitors: renderCompetitors,
  outcomes: renderOutcomes,
  analytics: renderAnalytics,
  "partner-coverage": renderPartnerCoverage,
  partners: renderPartners,
  ltos: renderLTOs,
  "data-lp-partners": renderDataLpPartners,
  "monthly-reports": renderMonthlyReports,
  settings: renderSettings,
  users: renderUsers,
  "email-scraper": renderEmailScraper,
  "ocs-connector": renderOcsConnector,
  "system-health": renderSystemHealth,
};

// Three-tier page access: admin > gm (General Manager) > manager (Store
// Manager). The server enforces this too; this keeps the UI coherent (hidden
// nav + a clear message on direct navigation). A page absent from PAGE_ACCESS
// is open to everyone logged in. 'settings' is gm+ here (renders read-only for
// non-admins); writes are admin-only server-side.
const ROLE_RANK = { admin: 3, gm: 2, manager: 1, regular: 1 };
const PAGE_ACCESS = {
  // admin only — system config, users, credentials
  users: "admin", "email-scraper": "admin", "ocs-connector": "admin", "system-health": "admin",
  // GM or admin — financials + read-only settings
  analytics: "gm", "partner-coverage": "gm", partners: "gm", ltos: "gm", "data-lp-partners": "gm",
  "monthly-reports": "gm", settings: "gm",
};
function _myRoleRank() {
  const r = (_currentUser && _currentUser.logged_in) ? (_currentUser.role || "manager") : "manager";
  return ROLE_RANK[r] ?? 1;
}
function canAccessPage(page) {
  const need = PAGE_ACCESS[page];
  if (!need) return true;
  if (_currentUser && _currentUser.bootstrap_mode) return true;
  return _myRoleRank() >= (ROLE_RANK[need] || 3);
}

function goto(page) {
  if (!canAccessPage(page)) {
    document.getElementById("main").innerHTML =
      `<div class="error"><strong>Not authorized</strong>You don't have access to this section.</div>`;
    return;
  }
  document.querySelectorAll("nav button[data-page]").forEach(b => b.classList.remove("active"));
  const btn = document.querySelector(`nav button[data-page="${page}"]`);
  if (btn) btn.classList.add("active");
  if (routes[page]) routes[page]();
}

// Page-navigation buttons (those with data-page attribute)
document.querySelectorAll("nav button[data-page]").forEach(btn => {
  btn.addEventListener("click", () => goto(btn.dataset.page));
});

// Collapsible group headers (data-toggle attribute)
document.querySelectorAll(".nav-group-header[data-toggle]").forEach(hdr => {
  hdr.addEventListener("click", () => {
    const group = hdr.closest(".nav-group");
    if (!group) return;
    group.classList.toggle("collapsed");
    // Persist collapse state per group in localStorage
    try {
      const groupName = hdr.dataset.toggle;
      const isCollapsed = group.classList.contains("collapsed");
      localStorage.setItem(`nav-group-${groupName}-collapsed`, isCollapsed ? "1" : "0");
    } catch (e) { /* private browsing — ignore */ }
  });
});

// Restore collapsed state from previous session
document.querySelectorAll(".nav-group[data-group]").forEach(group => {
  try {
    const groupName = group.dataset.group;
    if (localStorage.getItem(`nav-group-${groupName}-collapsed`) === "1") {
      group.classList.add("collapsed");
    }
  } catch (e) { /* ignore */ }
});

updateStatus();
ensureStoreNames().then(() => renderOverview());
loadCurrentUser();
</script>
