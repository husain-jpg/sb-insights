<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SB Insights</title>
<style>
  :root {
    --bg: #0a0e0c;
    --bg-elev: #111815;
    --bg-elev-2: #17201c;
    --bg-elev-3: #1d2823;
    --border: #1f2a25;
    --border-strong: #2a3832;
    --text: #e8ebe9;
    --text-dim: #8a9690;
    --text-faint: #5a655f;
    --accent: #7dd67a;
    --warning: #e8b447;
    --critical: #e85a5a;
    --info: #6aa6d6;
    --purple: #b07fd1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
  }
  aside {
    width: 220px;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    position: sticky; top: 0; left: 0;
    height: 100vh;
    display: flex; flex-direction: column;
    padding: 24px 0;
    flex-shrink: 0;
    z-index: 50;
  }
  .logo { padding: 0 20px 24px; flex-shrink: 0; }
  .logo h1 {
    font-family: Georgia, serif;
    font-size: 17px; font-weight: 400;
    display: flex; align-items: center; gap: 10px;
  }
  .logo-mark {
    width: 24px; height: 24px; background: var(--accent);
    border-radius: 3px; display: inline-flex; align-items: center;
    justify-content: center; color: var(--bg); font-weight: 700;
  }
  .logo-sub {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.1em; color: var(--text-faint);
    margin-left: 34px; margin-top: 2px; text-transform: uppercase;
  }
  nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;  /* allows flex child to shrink and scroll */
  }
  /* Group containers in the new IA */
  .nav-group {
    margin-bottom: 4px;
  }
  .nav-group-header {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 9px 20px;
    background: transparent; border: none;
    color: var(--text-faint); font-size: 10px;
    font-family: ui-monospace, Menlo, monospace;
    text-transform: uppercase; letter-spacing: 0.1em;
    cursor: pointer; text-align: left;
    transition: color 120ms;
    user-select: none;
  }
  .nav-group-header:hover { color: var(--text-dim); }
  .nav-group-header .arrow {
    display: inline-block; width: 8px;
    transition: transform 120ms;
    color: var(--text-faint);
  }
  .nav-group.collapsed .arrow { transform: rotate(-90deg); }
  .nav-group.collapsed .nav-group-items { display: none; }
  .nav-group-items button {
    padding-left: 30px;  /* indent nested items */
  }
  nav button {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 11px 20px;
    background: transparent; border: none;
    border-left: 2px solid transparent;
    color: var(--text-dim); font-size: 13px;
    font-family: inherit; cursor: pointer; text-align: left;
    transition: all 120ms;
  }
  nav button:hover { color: var(--text); }
  nav button.active {
    background: var(--bg-elev-2); color: var(--text);
    border-left-color: var(--accent);
  }
  nav button .badge {
    margin-left: auto; background: var(--critical); color: var(--bg);
    font-family: ui-monospace, Menlo, monospace; font-size: 9px;
    font-weight: 700; padding: 2px 6px; border-radius: 2px;
    min-width: 18px; text-align: center;
  }
  .status-pane {
    padding: 16px 20px; border-top: 1px solid var(--border);
    font-size: 10px; font-family: ui-monospace, Menlo, monospace;
    color: var(--text-faint); line-height: 1.6;
    flex-shrink: 0;
  }
  .status-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; margin-right: 6px;
  }
  .status-ok { background: var(--accent); }
  .status-warn { background: var(--warning); }

  main {
    flex: 1; padding: 32px 40px; max-width: 1500px; min-width: 0;
  }
  .section-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 20px; gap: 16px;
  }
  .kicker {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--text-faint); margin-bottom: 6px;
    text-transform: uppercase;
  }
  .section-header h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px; font-weight: 400;
    letter-spacing: -0.01em;
  }

  .tag {
    display: inline-block;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.08em;
    padding: 3px 7px; border-radius: 3px;
    text-transform: uppercase; font-weight: 600; line-height: 1.2;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .tag-accent { background: rgba(125,214,122,0.1); color: var(--accent); border-color: transparent; }
  .tag-critical { background: rgba(232,90,90,0.12); color: var(--critical); border-color: transparent; }
  .tag-warning { background: rgba(232,180,71,0.12); color: var(--warning); border-color: transparent; }
  .tag-info { background: rgba(106,166,214,0.12); color: var(--info); border-color: transparent; }
  .tag-stockout { background: rgba(232,90,90,0.2); color: var(--critical); border-color: transparent; }

  .card {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 4px;
  }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 4px; padding: 20px; position: relative; overflow: hidden;
    cursor: pointer;
    transition: transform 120ms, border-color 120ms;
  }
  .kpi-card[data-clickable]:hover {
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 3px; height: 100%;
  }
  .kpi-card.green::before { background: var(--accent); }
  .kpi-card.red::before { background: var(--critical); }
  .kpi-card.amber::before { background: var(--warning); }
  .kpi-card.blue::before { background: var(--info); }
  .kpi-card.purple::before { background: var(--purple); }
  .kpi-label {
    font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    letter-spacing: 0.12em; color: var(--text-faint);
    margin-bottom: 10px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
  }
  .kpi-link-arrow {
    font-size: 14px; color: var(--text-faint); letter-spacing: 0;
  }
  .kpi-card[data-clickable]:hover .kpi-link-arrow { color: var(--accent); }
  .kpi-value {
    font-family: Georgia, serif; font-size: 34px; line-height: 1;
    margin-bottom: 8px;
  }
  .kpi-detail { font-size: 12px; color: var(--text-dim); }

  .store-card {
    background: var(--bg-elev); padding: 18px; border-radius: 4px;
    border: 1px solid var(--border);
    display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 20px;
    align-items: center;
  }
  .store-header-row {
    display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 20px;
    padding: 12px 18px; font-family: ui-monospace, Menlo, monospace;
    font-size: 9px; letter-spacing: 0.1em; color: var(--text-faint);
    text-transform: uppercase;
  }
  .store-compare-block {
    display: flex; flex-direction: column; gap: 4px;
  }
  .store-compare-main {
    font-family: Georgia, serif; font-size: 20px; line-height: 1;
  }
  .store-compare-delta {
    font-size: 11px; font-family: ui-monospace, Menlo, monospace;
  }
  .delta-pos { color: var(--accent); }
  .delta-neg { color: var(--critical); }
  .delta-flat { color: var(--text-dim); }
  .store-id-label {
    font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    color: var(--text-faint);
  }
  .store-name-label { font-size: 14px; font-weight: 500; margin-top: 2px; }

  table {
    width: 100%; border-collapse: collapse;
  }
  thead th {
    background: var(--bg-elev-2); padding: 12px 16px;
    font-family: ui-monospace, Menlo, monospace; font-size: 9px;
    letter-spacing: 0.1em; color: var(--text-faint);
    text-transform: uppercase; text-align: left;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
    user-select: none;
  }
  thead th.num { text-align: right; }
  thead th.sortable { cursor: pointer; }
  thead th.sortable:hover { color: var(--text); background: var(--bg-elev-3); }
  thead th.sortable .sort-icon {
    display: inline-block; margin-left: 4px; opacity: 0.4; font-size: 8px;
  }
  thead th.sorted .sort-icon { opacity: 1; color: var(--accent); }
  tbody td {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    font-size: 13px;
    background: var(--bg-elev);
  }
  tbody td.num {
    text-align: right; font-family: ui-monospace, Menlo, monospace;
  }
  tbody td.muted { color: var(--text-dim); }
  tbody tr:hover td { background: var(--bg-elev-2); }

  /* Sticky-column support: wrap a table in <div class="sticky-cols-1"> etc.
     The first N columns will freeze when horizontal-scrolling. Background
     overrides standard td bg to ensure scrolling content doesn't bleed
     through. Each sticky-cols-X class freezes the first X columns. */
  .sticky-cols-1 thead th:first-child,
  .sticky-cols-1 tbody td:first-child {
    position: sticky; left: 0; z-index: 4;
    background: var(--bg-elev);
  }
  .sticky-cols-1 thead th:first-child {
    z-index: 6; background: var(--bg-elev-2);
  }
  .sticky-cols-1 tbody tr:hover td:first-child { background: var(--bg-elev-2); }

  .sticky-cols-4 thead th:nth-child(-n+4),
  .sticky-cols-4 tbody td:nth-child(-n+4) {
    position: sticky; z-index: 4; background: var(--bg-elev);
  }
  .sticky-cols-4 thead th:nth-child(-n+4) {
    z-index: 6; background: var(--bg-elev-2);
  }
  .sticky-cols-4 tbody tr:hover td:nth-child(-n+4) { background: var(--bg-elev-2); }
  /* Each sticky col needs its own `left` offset. JS sets these via inline
     styles after table render based on actual column widths. Fallback values
     here cover typical column widths so it works even without JS adjustments. */
  .sticky-cols-4 thead th:nth-child(1),
  .sticky-cols-4 tbody td:nth-child(1) { left: 0; }
  .sticky-cols-4 thead th:nth-child(2),
  .sticky-cols-4 tbody td:nth-child(2) { left: 220px; }
  .sticky-cols-4 thead th:nth-child(3),
  .sticky-cols-4 tbody td:nth-child(3) { left: 320px; }
  .sticky-cols-4 thead th:nth-child(4),
  .sticky-cols-4 tbody td:nth-child(4) { left: 400px; }

  /* Tables in sticky-col mode need horizontal scroll on their wrapper. */
  .table-scroll { overflow-x: auto; }
  .sku {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; color: var(--text-faint); margin-top: 3px;
  }

  select, input[type="text"], input[type="search"] {
    background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px;
    padding: 6px 10px; font-size: 11px;
    font-family: ui-monospace, Menlo, monospace;
  }
  input[type="search"] { width: 220px; }

  .controls-row {
    display: flex; gap: 8px; align-items: center;
  }

  .loading {
    padding: 40px; text-align: center; color: var(--text-faint);
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px; letter-spacing: 0.1em;
  }
  .error {
    padding: 20px; border-left: 3px solid var(--critical);
    background: rgba(232,90,90,0.06); color: var(--text-dim);
    font-size: 13px; line-height: 1.5;
  }
  .error strong { color: var(--critical); display: block; margin-bottom: 6px; }

  .hint-box {
    padding: 16px; background: rgba(106,166,214,0.06);
    border: 1px solid rgba(106,166,214,0.2); border-radius: 4px;
    margin-top: 16px; font-size: 11px; color: var(--text-dim);
    line-height: 1.5; display: flex; gap: 8px; align-items: flex-start;
  }
  .hint-box::before { content: 'ℹ'; color: var(--info); font-size: 14px; }

  .btn-tab {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 14px; font-size: 11px; cursor: pointer; border-radius: 3px;
    text-transform: uppercase; letter-spacing: 0.05em;
    font-family: ui-monospace, Menlo, monospace;
  }
  .btn-tab:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-tab.active { background: var(--bg-elev-2); color: var(--accent); border-color: var(--accent); }
  .btn-link {
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; padding: 4px 8px; font-size: 11px;
    text-decoration: underline; font-family: inherit;
  }
  .btn-link:hover { color: var(--critical); }

  .summary-bar {
    display: flex; gap: 24px; padding: 16px 20px;
    background: var(--bg-elev-2); border-bottom: 1px solid var(--border);
  }
  .summary-bar div { font-size: 11px; color: var(--text-dim); }
  .summary-bar strong {
    display: block; font-size: 16px; color: var(--text);
    font-family: Georgia, serif; font-weight: 400;
  }

  .empty-state {
    padding: 60px 20px; text-align: center; color: var(--text-faint);
  }
  .empty-state h3 { font-family: Georgia, serif; font-size: 18px; margin-bottom: 8px; color: var(--text-dim); }
  .empty-state p { font-size: 13px; line-height: 1.5; max-width: 500px; margin: 0 auto; }
</style>
</head>
<body>
<aside>
  <div class="logo">
    <h1>
      <span class="logo-mark">SB</span>
      SB Insights
    </h1>
    <div class="logo-sub">CANNABIS OPS</div>
  </div>
  <nav id="nav">
    <button data-page="overview" class="active">▸ Overview</button>

    <div class="nav-group" data-group="inventory">
      <button class="nav-group-header" data-toggle="inventory">

        <button data-page="reorder">▸ Reorder Report <span class="badge" id="badge-reorder" style="display:none"></span></button>

    <div class="nav-group" data-group="settings">
      <button class="nav-group-header" data-toggle="settings">

  </nav>
  <div class="status-pane" id="status-pane">
    <div><span class="status-dot status-ok"></span>Local database</div>
    <div><span class="status-dot status-warn"></span>Cova API (pending)</div>
    <div id="status-info" style="margin-top: 8px;"></div>
  </div>
  <div id="user-pane" style="border-top: 1px solid var(--border); padding: 10px 14px; font-size: 11px; color: var(--text-dim);">
    <div id="user-pane-content">Loading user...</div>
  </div>

<main id="main">
  <div class="loading">Loading...</div>

<script>
const API = "";
const fmt$ = n => "$" + Number(n || 0).toLocaleString("en-CA", { maximumFractionDigits: 0 });
const fmt$2 = n => "$" + Number(n || 0).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtN = n => Number(n || 0).toLocaleString("en-CA");
const fmtPct = n => (n >= 0 ? "+" : "") + Number(n || 0).toFixed(1) + "%";

// Store id -> short name cache, populated on first /api/locations call.
// Any tab rendering store codes can call storeLabel('S1') -> 'Livingstone'.
const _storeNames = {};
async function ensureStoreNames() {
  if (Object.keys(_storeNames).length > 0) return _storeNames;
  try {
    const locs = await api("/api/locations");
    for (const l of locs) _storeNames[l.id] = l.short_name || l.name || l.id;
  } catch (e) { /* fall back to id */ }
  return _storeNames;
}
function storeLabel(id) {
  if (!id) return '—';
  return _storeNames[id] || id;
}

// Shared helper: render the rebate/data-fee badge. Used in Reorder, Stockouts,
// Dead Stock, Promotions — anywhere a SKU is shown and a rebate badge helps
// answer "do I get paid for this product?"
//
// Returns empty string if no active deal. Returns purple DIRECT tag for direct
// deals (which exclude the SKU from collectives) and green collective tag with
// rate + basis for collective deals (Canna Collective, IRCC, Seeker).
function rebateBadgeHtml(r) {
  if (r.data_fee_is_direct) {
    return `<span class="tag" style="background: rgba(140, 100, 180, 0.15); color: #a78bd9; border-color: rgba(160, 110, 200, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Direct deal with ${r.data_fee_partner} — this SKU is excluded from collective rebate programs">DIRECT</span>`;
  }
  if (r.data_fee_pct) {
    const basis = r.data_fee_basis === 'wholesale_cost' ? 'WS' : r.data_fee_basis === 'retail_sales' ? 'RT' : '';
    const partnerShort = r.data_fee_partner === 'Canna Collective' ? 'CC' : (r.data_fee_partner || '');
    return `<span class="tag" style="background: rgba(70, 140, 90, 0.15); color: #6dab84; border-color: rgba(80, 160, 100, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Active data revenue deal: ${r.data_fee_partner} pays ${r.data_fee_pct}% of ${r.data_fee_basis === 'wholesale_cost' ? 'wholesale cost' : 'retail sales'} for this SKU">${partnerShort}: ${r.data_fee_pct}% ${basis}</span>`;
  }
  return '';
}

async function api(path) {
  const r = await fetch(API + path, { credentials: "include" });
  if (r.status === 401) {
    // Session expired or never logged in — bounce to login
    window.location.href = "/login";
    throw new Error("Not authenticated");
  }
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`${r.status}: ${t}`);
  }
  return r.json();
}

// Trigger a file download from any URL by opening it in a hidden link.
// The browser picks up the Content-Disposition header for the filename.
function downloadUrl(url) {
  const a = document.createElement('a');
  a.href = url;
  a.download = '';  // hint to treat as download
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 1000);
}

// Build a reusable "Download Excel" button matching site styling.
function excelButtonHtml(buttonId) {
  return `<button id="${buttonId}" class="excel-btn" title="Download current view as Excel"
    style="background: #059669; color: white; border: 1px solid #047857; padding: 6px 12px;
           border-radius: 4px; font-family: inherit; font-size: 11px; cursor: pointer;
           display: inline-flex; align-items: center; gap: 6px;">
    <span style="font-size: 14px">↓</span> Download Excel
  </button>`;
}

function showError(e) {
  document.getElementById("main").innerHTML = `
    <div class="error">
      <strong>Couldn't load data</strong>
      ${e.message}
      <br><br>
      <span style="color: var(--text-faint); font-size: 11px;">
        Check the terminal window for errors. Most common fix: make sure you've imported Cova exports first.
      </span>
    </div>
  `;
}

// ========================================================================
// SORTABLE TABLE — reusable mechanism
// ========================================================================
// Each sortable table stores its data + column config in state,
// and re-renders on header click. This is simpler than per-table sort code.

const tableState = {};  // id -> {rows, columns, sortCol, sortDir}

function renderTable(tableId, rows, columns, opts = {}) {
  // columns: [{ key, label, type, align, render, width }]
  tableState[tableId] = { rows, columns, sortCol: opts.defaultSort || null, sortDir: opts.defaultDir || 'asc', opts };
  _drawTable(tableId);
}

function _drawTable(tableId) {
  const s = tableState[tableId];
  const container = document.getElementById(tableId);
  if (!container) return;

  // Sort rows
  let displayRows = [...s.rows];
  if (s.sortCol) {
    const col = s.columns.find(c => c.key === s.sortCol);
    const dir = s.sortDir === 'asc' ? 1 : -1;
    displayRows.sort((a, b) => {
      const av = col && col.sortValue ? col.sortValue(a) : a[s.sortCol];
      const bv = col && col.sortValue ? col.sortValue(b) : b[s.sortCol];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * dir;
      if (col && col.type === 'number') return ((+av) - (+bv)) * dir;
      return String(av).localeCompare(String(bv)) * dir;
    });
  }

  // Detect if any columns have a `group` — render two header rows when so.
  // Row 1: group parent cells (colspan over their member columns).
  // Row 2: leaf header cells with sort affordance.
  const hasGroups = s.columns.some(c => c.group);
  let theadRows = '';

  if (hasGroups) {
    // Walk columns building contiguous group segments.
    const segments = [];
    let cur = null;
    for (const c of s.columns) {
      const g = c.group || null;
      if (cur && cur.group === g) {
        cur.columns.push(c);
      } else {
        cur = { group: g, columns: [c] };
        segments.push(cur);
      }
    }
    const groupRow = segments.map(seg => {
      const label = seg.group || '';
      // Visible group cell vs. spacer cell (no group) — different styling.
      const styling = seg.group
        ? 'text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); border-bottom: 1px solid var(--border); padding: 6px 0;'
        : 'border-bottom: none; background: transparent;';
      return `<th colspan="${seg.columns.length}" style="${styling}">${escapeHtml(label)}</th>`;
    }).join('');
    theadRows += `<tr>${groupRow}</tr>`;
  }

  const thead = s.columns.map(c => {
    const align = c.align === 'right' ? 'num' : '';
    const sortable = c.sortable !== false ? 'sortable' : '';
    const sorted = s.sortCol === c.key ? 'sorted' : '';
    const arrow = s.sortCol === c.key ? (s.sortDir === 'asc' ? '▲' : '▼') : '↕';
    const titleAttr = c.tooltip ? ` title="${c.tooltip.replace(/"/g, '&quot;')}"` : '';
    return `<th class="${align} ${sortable} ${sorted}" data-col="${c.key}"${titleAttr}>
      ${c.label}${sortable ? `<span class="sort-icon">${arrow}</span>` : ''}
    </th>`;
  }).join('');
  theadRows += `<tr>${thead}</tr>`;

  const tbody = displayRows.length === 0
    ? `<tr><td colspan="${s.columns.length}" class="loading">${s.opts.emptyText || 'No rows.'}</td></tr>`
    : displayRows.map(row => {
        return '<tr>' + s.columns.map(c => {
          const align = c.align === 'right' ? 'num' : '';
          const val = c.render ? c.render(row) : (row[c.key] ?? '');
          return `<td class="${align}">${val}</td>`;
        }).join('') + '</tr>';
      }).join('');

  container.innerHTML = `
    <table>
      <thead>${theadRows}</thead>
      <tbody>${tbody}</tbody>
    </table>
  `;

  // Wire up header clicks
  container.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (s.sortCol === col) {
        s.sortDir = s.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        s.sortCol = col;
        s.sortDir = 'desc';  // default to desc for new column
      }
      _drawTable(tableId);
    });
  });
}

function deltaClass(d) {
  if (d == null) return 'delta-flat';
  if (d > 0.5) return 'delta-pos';
  if (d < -0.5) return 'delta-neg';
  return 'delta-flat';
}

// ========================================================================
// REORDER
// ========================================================================
// ========================================================================
// Suggested Additions — peer-popular SKUs you don't carry, surfaced atop
// the Reorder Report. Auto-refreshes when the store filter changes.
// ========================================================================
// Kept collapsed by default to not disrupt the existing reorder flow. Click
// the header bar to expand. Action buttons (snooze/dismiss/added) update
// state and remove the row.

let _suggestedExpanded = false;  // remembered across refetches

async function loadSuggestedAdditions(locationId) {
  const panel = document.getElementById("suggested-additions-panel");
  if (!panel) return;

  // No store selected → hide the panel entirely
  if (!locationId) {
    panel.style.display = "none";
    panel.innerHTML = "";
    return;
  }

  // Fetch suggestions
  let data;
  try {
    data = await api(`/api/reorder/suggested-additions?location_id=${encodeURIComponent(locationId)}&limit=20`);
  } catch (e) {
    panel.style.display = "none";
    return;
  }

  if (data.warning && data.count === 0) {
    // Show a small explanatory bar so user knows the feature exists but has no data yet
    panel.style.display = "block";
    panel.innerHTML = `
      <div style="padding: 10px 16px; background: var(--bg-elev-2); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-dim);">
        💡 Suggested Additions disabled: ${escapeHtml(data.warning)}
      </div>
    `;
    return;
  }

  if (!data.items || data.items.length === 0) {
    panel.style.display = "none";
    return;
  }

  const importedDate = data.imported_at ? data.imported_at.slice(0, 10) : '?';
  const ageDays = data.imported_at ? Math.floor((Date.now() - new Date(data.imported_at).getTime()) / 86400000) : null;
  const stale = ageDays !== null && ageDays > 21;

  const totalCost = data.items.reduce((sum, it) => sum + (it.suggested_cost || 0), 0);

  panel.style.display = "block";
  panel.innerHTML = `
    <div style="background: rgba(180, 140, 40, 0.08); border-bottom: 1px solid var(--border);">
      <div style="padding: 10px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;" id="sa-header">
        <div style="font-size: 12px;">
          <strong style="color: #c89b32;">⭐ Suggested Additions</strong>
          <span style="color: var(--text-dim); margin-left: 8px;">${data.count} peer-popular SKU${data.count === 1 ? '' : 's'} you don't carry · trial cost ~${fmt$(totalCost)}</span>
          ${stale ? '<span class="tag" style="background: rgba(214, 100, 100, 0.15); color: #d66464; font-size: 10px; margin-left: 8px;">STALE DATA</span>' : ''}
        </div>
        <div style="font-size: 11px; color: var(--text-dim);">
          <span style="margin-right: 12px;">Last imported: ${importedDate}${ageDays !== null ? ` (${ageDays}d ago)` : ''}</span>
          <span id="sa-toggle-arrow">${_suggestedExpanded ? '▾' : '▸'}</span>
        </div>
      </div>
      <div id="sa-body" style="display: ${_suggestedExpanded ? 'block' : 'none'};">
        <div style="padding: 8px 16px; font-size: 11px; color: var(--text-dim); background: var(--bg-elev-2); border-top: 1px solid var(--border);">
          These SKUs sell well at peer stores in your municipality but you don't carry them. Suggested quantities are conservative trial orders (1-2 cases). Once stocked, regular reorder takes over.
        </div>
        <div id="sa-table"></div>
      </div>
    </div>
  `;

  document.getElementById("sa-header").addEventListener("click", () => {
    _suggestedExpanded = !_suggestedExpanded;
    document.getElementById("sa-body").style.display = _suggestedExpanded ? "block" : "none";
    document.getElementById("sa-toggle-arrow").textContent = _suggestedExpanded ? "▾" : "▸";
  });

  renderSuggestedTable(data.items, locationId);
}

function renderSuggestedTable(items, locationId) {
  const container = document.getElementById("sa-table");
  if (!container) return;

  const rows = items.map((it, idx) => {
    const stockTag = it.stock_status === "YES"
      ? '<span class="tag tag-accent" style="font-size: 9px;">In stock</span>'
      : '<span class="tag tag-critical" style="font-size: 9px;">Out</span>';
    return `
      <tr>
        <td style="font-variant-numeric: tabular-nums; color: var(--text-dim);">${idx + 1}</td>
        <td>
          <strong>${escapeHtml(it.item_name || it.sku)}</strong>
          <div class="sku">${escapeHtml(it.brand || '—')} · ${escapeHtml(it.subcategory || '—')} · ${escapeHtml(it.size || '—')}</div>
        </td>
        <td class="num" title="Avg units sold per peer store during the period">${it.municipality_units ? it.municipality_units.toFixed(0) : '—'}</td>
        <td class="num" title="Avg units sold per day at peer stores when SKU sells">${it.municipality_velocity ? it.municipality_velocity.toFixed(2) : '—'}</td>
        <td class="num">${it.unit_price ? fmt$2(it.unit_price) : '—'}</td>
        <td class="num">${it.pack_size || '—'}</td>
        <td class="num"><strong>${it.suggested_units}u</strong><div class="sku">${it.suggested_cases}c</div></td>
        <td class="num"><strong>${fmt$2(it.suggested_cost)}</strong></td>
        <td style="text-align: center;">${stockTag}</td>
        <td>
          <div style="display: flex; gap: 4px;">
            <button class="btn-link sa-action-btn" data-sku="${escapeHtml(it.sku)}" data-action="added"
                    title="Mark as decided to add. Hides from this list. You'll need to place the order manually through your normal OCS workflow."
                    style="font-size: 10px; color: #6dab84;">Add</button>
            <button class="btn-link sa-action-btn" data-sku="${escapeHtml(it.sku)}" data-action="snooze"
                    title="Hide for 90 days, then re-evaluate"
                    style="font-size: 10px; color: var(--text-dim);">Snooze</button>
            <button class="btn-link sa-action-btn" data-sku="${escapeHtml(it.sku)}" data-action="dismiss"
                    title="Hide indefinitely"
                    style="font-size: 10px; color: #d66464;">Dismiss</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");

  container.innerHTML = `
    <table class="data-table" style="margin: 0;">
      <thead>
        <tr>
          <th>#</th>
          <th>Product</th>
          <th class="num" title="Cumulative units sold per peer store during period">Peer units</th>
          <th class="num" title="Per-day velocity at peer stores when SKU sells">Vel /day</th>
          <th class="num">Wholesale</th>
          <th class="num">Case</th>
          <th class="num">Suggested</th>
          <th class="num">Trial cost</th>
          <th>OCS</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  container.querySelectorAll(".sa-action-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const sku = btn.dataset.sku;
      const action = btn.dataset.action;
      const author = ensureAuthor() || "anonymous";
      try {
        const res = await fetch(`${API}/api/reorder/suggested-additions/${encodeURIComponent(sku)}/action`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            location_id: locationId, action, author_name: author,
            ...(action === 'snooze' ? { snooze_days: 90 } : {}),
          }),
        });
        if (!res.ok) {
          const err = await res.json();
          alert("Action failed: " + (err.detail || "unknown"));
          return;
        }
        // Reload the panel to remove the actioned SKU
        loadSuggestedAdditions(locationId);
      } catch (e) {
        alert("Action failed: " + e.message);
      }
    });
  });
}

          ${row(tag("background: rgba(80, 180, 100, 0.18); color: #6fcf85; border-color: rgba(90, 200, 110, 0.45);", "BACK IN STOCK"), "Back in stock", "Back in stock at OCS as of the latest Order Fill template.")}
          ${row(tag("background: rgba(214, 180, 70, 0.18); color: #d6b446; border-color: rgba(220, 190, 80, 0.45);", "NEW"), "New arrival", "Newly listed in OCS's latest Order Fill.")}
          ${row(tag("background: rgba(106, 166, 214, 0.15); color: #6aa6d6; border-color: rgba(116, 176, 224, 0.4);", "CTB"), "Click-to-Buy", "Ships directly from OCS warehouse. Shortest lead time (~5 days).")}
          ${row(tag("background: rgba(220, 150, 90, 0.15); color: #dc965a; border-color: rgba(230, 165, 100, 0.4);", "FT-EXP"), "Flow Through Expedited", "Cova-managed Flow Through, expedited tier. Mid lead time (~12 days).")}
          ${row(tag("background: rgba(180, 130, 100, 0.15); color: #c08560; border-color: rgba(190, 140, 110, 0.4);", "FT-STD"), "Flow Through Standard", "Cova-managed Flow Through, standard tier. Longest lead time (~19 days).")}
        </table>

        <h4 style="margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);">Mix Multiplier</h4>
        <table style="font-size: 13px;">
          ${row('<span style="color: var(--accent); font-family: Georgia, serif;">×1.15 mix</span>', "Boosted by mix", "Category is underweight at this store relative to chain average. Order qty boosted up to +25%. Hero SKUs are exempt.")}
          ${row('<span style="color: var(--warning); font-family: Georgia, serif;">×0.85 mix</span>', "Reduced by mix", "Category is overweight at this store. Order qty reduced up to -30%. Hero SKUs are exempt.")}
        </table>

        <p style="font-size: 11px; color: var(--text-faint); margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);">
          Tip: hover over any tag in the report to see SKU-specific details.
        </p>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("legend-close").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
}

// ========================================================================
// Reorder Report — SKU Diagnose modal
// ========================================================================
// Asks the user for a SKU + store, then calls /api/reorder/diagnose to show
// every filter check the engine applied and the verdict.
async function showReorderDiagnose() {
  const sku = prompt("Enter a SKU to diagnose (e.g., the Cova SKU shown under product names):");
  if (!sku || !sku.trim()) return;
  let locId = "";
  try {
    const sf = document.getElementById("store-filter");
    if (sf && sf.value) locId = sf.value;
  } catch (e) { /* ignore */ }
  if (!locId) {
    locId = prompt("Enter the store ID (S1, S2, S3, ..., S8):") || "";
  }
  if (!locId.trim()) return;

  const overlay = document.createElement("div");
  overlay.id = "diagnose-overlay";
  overlay.style.cssText = "position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;";
  overlay.innerHTML = `
    <div style="background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; max-width: 800px; width: 100%; max-height: 90vh; overflow: auto;">
      <div style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline;">
        <h3 style="margin: 0;">SKU Diagnostic</h3>
        <button id="diagnose-close" class="btn" style="font-size: 11px;">Close</button>
      </div>
      <div id="diagnose-body" style="padding: 16px 20px;">
        <div class="loading">Diagnosing...</div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("diagnose-close").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });

  try {
    const data = await api(`/api/reorder/diagnose?sku=${encodeURIComponent(sku.trim())}&location_id=${encodeURIComponent(locId.trim())}`);
    const body = document.getElementById("diagnose-body");

    if (!data.found) {
      body.innerHTML = `<div class="error" style="padding: 16px;">${escapeHtml(data.excluded_reason || 'SKU not found')}</div>`;
      return;
    }

    const verdictBadge = data.verdict === "included"
      ? '<span class="tag" style="background: rgba(80, 180, 100, 0.18); color: #6fcf85; padding: 2px 8px;">INCLUDED</span>'
      : '<span class="tag" style="background: rgba(214, 100, 100, 0.18); color: #d66464; padding: 2px 8px;">EXCLUDED</span>';

    const inp = data.inputs;
    const inputsHtml = `
      <table style="font-size: 12px; width: 100%;">
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Product</td><td><strong>${escapeHtml(inp.name || '?')}</strong></td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Brand / LP</td><td>${escapeHtml(inp.brand || '?')} · ${escapeHtml(inp.lp || '?')}</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Category</td><td>${escapeHtml(inp.category || '?')} → ${escapeHtml(inp.subcategory || '?')}</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Top-level</td><td>${escapeHtml(inp.top_level_classification || '?')}</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">On hand</td><td>${inp.on_hand} units (as of ${inp.inventory_as_of || '?'})</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Velocity</td><td>${inp.velocity_per_day} units/day (${inp.units_sold_30d} units over last 30 days)</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Days of cover</td><td>${inp.days_of_cover}</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">Pack size</td><td>${inp.pack_size}</td></tr>
        <tr><td style="padding: 4px 8px; color: var(--text-dim);">OCS stock</td><td>${escapeHtml(inp.ocs_stock_status || '?')} · price ${inp.ocs_unit_price ? '$' + inp.ocs_unit_price.toFixed(2) : '?'}</td></tr>
        ${inp.min_qty_anchor != null || inp.max_qty_anchor != null ? `<tr><td style="padding: 4px 8px; color: var(--text-dim);">Min/Max override</td><td>min: ${inp.min_qty_anchor ?? '—'}, max: ${inp.max_qty_anchor ?? '—'}</td></tr>` : ''}
      </table>
    `;

    const checksHtml = data.checks.map(c => `
      <tr>
        <td style="padding: 8px 10px; vertical-align: top; white-space: nowrap; font-size: 18px;">${c.passed ? '<span style="color: #6fcf85;">✓</span>' : '<span style="color: #d66464;">✗</span>'}</td>
        <td style="padding: 8px 10px; vertical-align: top;">
          <strong>${escapeHtml(c.name)}</strong>
          <div style="color: var(--text-dim); font-size: 12px; margin-top: 2px;">${escapeHtml(c.explanation)}</div>
        </td>
      </tr>
    `).join('');

    body.innerHTML = `
      <div style="margin-bottom: 16px;">
        <div style="font-size: 14px; margin-bottom: 6px;">
          <strong>${escapeHtml(data.sku)}</strong> at <strong>${escapeHtml(data.location_id)}</strong>
        </div>
        <div>Verdict: ${verdictBadge}</div>
        ${data.excluded_reason ? `<div style="margin-top: 8px; font-size: 12px; color: #d66464;">${escapeHtml(data.excluded_reason)}</div>` : ''}
      </div>

      <h4 style="margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);">Inputs the engine sees</h4>
      <div class="card" style="padding: 8px; margin-bottom: 20px;">${inputsHtml}</div>

      <h4 style="margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);">Filter checks (in engine order)</h4>
      <div class="card"><table style="font-size: 13px; width: 100%;">${checksHtml}</table></div>

      <p style="font-size: 11px; color: var(--text-faint); margin-top: 16px;">
        Settings applied:
        Hero ceiling ${inp.settings_applied.hero_ceiling_days}d ·
        Regular ceiling ${inp.settings_applied.regular_ceiling_days}d ·
        Min velocity ${inp.settings_applied.min_velocity}/day ·
        Pack threshold ${inp.settings_applied.pack_size_min_pct}% ·
        Overstock ${inp.settings_applied.overstock_days}d
      </p>
    `;
  } catch (e) {
    document.getElementById("diagnose-body").innerHTML = `<div class="error" style="padding: 16px;">${escapeHtml(e.message)}</div>`;
  }
}

async function renderReorder() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">LOADING REORDER QUEUE...</div>`;
  try {
    const [locs, data] = await Promise.all([
      api("/api/locations"),
      api("/api/reorder"),  // defaults to Cannabis-only server-side
    ]);

    // Header KPI strip — scope-level summary (store + type), explains why the
    // week's order is the size it is. Rebuilt on store/type/urgency changes via
    // refetch(); unaffected by client-side search/category/exclusion filters.
    function kpiStripHTML(k) {
      if (!k) return '';
      const doh = (k.days_on_hand == null)
        ? '—'
        : `${k.days_on_hand}<span style="font-size:13px; color:var(--text-dim); font-family:inherit;"> d</span>`;
      const slowRange = `${k.slow_days}–${k.dead_days - 1}`;
      // Compact card: smaller padding + value so all 5 fit one row.
      const card = (cls, label, value, detail, title) => `
        <div class="kpi-card ${cls}" style="cursor:default; padding:13px 14px;" title="${title}">
          <div class="kpi-label" style="margin-bottom:6px;"><span>${label}</span></div>
          <div class="kpi-value" style="font-size:22px;">${value}</div>
          <div class="kpi-detail">${detail}</div>
        </div>`;
      return `
      <div class="kpi-grid" style="grid-template-columns: repeat(5, 1fr); gap: 10px;">
        ${card('blue','Days On Hand', doh,
          `${fmt$(k.on_hand_value)} at cost${k.inventory_as_of ? ` · as of ${k.inventory_as_of}` : ''}`,
          'On-hand value (at actual cost) ÷ daily burn (trailing 30-day cost of product sold ÷ 30).')}
        ${card('purple','Weekly Burn', fmt$(k.weekly_burn_cost), 'Cost sold, 30-day avg',
          'Cost of product sold, averaged over the trailing 30 days, expressed per week.')}
        ${card('green','Suggested Reorder', fmt$(k.reorder_cost),
          `${fmtN(k.reorder_units)} u · ${fmtN(k.reorder_skus)} SKUs`,
          "This week's suggested reorder at OCS wholesale cost.")}
        ${card('red','Active Stockouts', fmtN(k.active_stockouts), 'Selling SKUs at 0 qty',
          'SKUs that are selling but currently at 0 on-hand.')}
        ${card('amber','Slow + Dead', fmt$(k.slow_dead_total_value),
          `Slow ${fmt$(k.slow_stock_value)} · Dead ${fmt$(k.dead_stock_value)}`,
          `On-hand value not sold in ${k.slow_days}+ days. Slow = sold ${slowRange}d ago (${fmtN(k.slow_stock_skus)} SKUs); Dead = ${k.dead_days}+d ago (${fmtN(k.dead_stock_skus)} SKUs).`)}
      </div>`;
    }

    // Plain-English manager guidance derived from the KPIs (current store/type
    // scope). Shown above the KPI strip.
    function highlightsHTML(k) {
      if (!k) return '';
      const pts = [];
      const doh = k.days_on_hand;
      if (doh != null) {
        if (doh > 35) pts.push(`<strong>Heavily stocked</strong> — ~${doh} days on hand (target 21–28). Tighten ordering: prioritize Hero / high-velocity SKUs and avoid topping up slow movers.`);
        else if (doh > 28) pts.push(`<strong>Slightly heavy</strong> — ~${doh} days on hand (target 21–28). Favor Heroes; ease off slower SKUs.`);
        else if (doh >= 21) pts.push(`<strong>Well-balanced</strong> — ~${doh} days on hand, within the 21–28-day target.`);
        else if (doh >= 14) pts.push(`<strong>Slightly lean</strong> — ~${doh} days on hand; keep Heroes well-covered.`);
        else pts.push(`<strong>Running lean</strong> — ~${doh} days on hand; watch for stockouts on fast movers.`);
      }
      const sd = k.slow_dead_total_value || 0, oh = k.on_hand_value || 0;
      if (sd > 0) {
        const pct = oh > 0 ? Math.round(sd / oh * 100) : 0;
        pts.push(`<strong>${fmt$(sd)}${pct ? ` (~${pct}%)` : ''}</strong> hasn't sold in ${k.slow_days}+ days — work it down via clearance/promos before it ages further.`);
      }
      if (k.active_stockouts > 0) {
        pts.push(`<strong>${fmtN(k.active_stockouts)} selling SKUs are stocked out</strong> — these are the priority to restock.`);
      }
      if ((k.weekly_burn_cost || 0) > 0) {
        const pct = Math.round((k.reorder_cost || 0) / k.weekly_burn_cost * 100);
        pts.push(`This week's suggested order is <strong>${fmt$(k.reorder_cost)}</strong> — about ${pct}% of a typical week's sales (at cost).`);
      }
      if (!pts.length) return '';
      return `
        <div class="card" style="margin-bottom: 16px; padding: 14px 16px; border-left: 3px solid var(--accent);">
          <div class="kicker" style="margin-bottom: 8px;">Highlights</div>
          <ul style="margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6;">
            ${pts.map(p => `<li>${p}</li>`).join('')}
          </ul>
        </div>`;
    }

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <div>
            <div class="kicker">OCS Reorder Queue</div>
            <h2 style="white-space: nowrap;">Suggested Weekly Reorder</h2>
          </div>
          <div style="display: flex; gap: 8px;">
            <button id="reorder-export-ocs-btn" class="btn btn-primary" style="white-space: nowrap;"
                    title="Fill the selected store's latest OCS order template with these reorder quantities, ready to upload to OCS. Select a single store first.">
              <span style="font-size: 14px; line-height: 1;">⤒</span> Export to OCS Template
            </button>
            <button id="reorder-excel-btn" class="btn" style="white-space: nowrap;">
              <span style="font-size: 14px; line-height: 1;">⤓</span> Download Excel
            </button>
          </div>
        </div>
        <div class="controls-row" style="margin-top: 4px;">
          <input type="search" id="reorder-search" placeholder="Search product name or SKU...">
          <select id="urgency-filter">
            <option value="all" selected>All urgencies</option>
            <option value="stockout">Stockout</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
          </select>
          <select id="type-filter">
            <option value="Cannabis" selected>Cannabis only</option>
            <option value="Accessories">Accessories only</option>
            <option value="All">All types</option>
          </select>
          <select id="category-filter" title="Filter by product classification (Pre-Rolls, Dried Flower, etc.)">
            <option value="">All categories</option>
          </select>
          <select id="store-filter">
            <option value="">All stores</option>
            ${locs.map(l => `<option value="${l.id}">${l.short_name || l.name}</option>`).join("")}
          </select>
        </div>
        <div class="controls-row" style="font-size: 11px; flex-wrap: wrap;">
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;">
            <input type="checkbox" id="include-ocs-out" style="margin: 0;">
            Show OCS-out items
          </label>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Adjust order quantities based on category mix drift vs 90-day sales. Underweight categories get up to +25%, overweight get up to -30%. Note: does NOT inflate Hero quantities.">
            <input type="checkbox" id="mix-aware" style="margin: 0;">
            Mix-aware
          </label>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Show only Hero SKUs — these are top-5 within each (category, size) bucket and get protected reorder treatment.">
            <input type="checkbox" id="anchors-only" style="margin: 0;">
            Heroes only
          </label>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Show only SKUs with an active data revenue deal — collective rebate (IRCC/CC/Seeker) or direct brand/LP deal.">
            <input type="checkbox" id="data-fees-only" style="margin: 0;">
            Rebate qualified only
          </label>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Show only SKUs currently flagged as on sale (active LTO / heuristic-detected promo activity).">
            <input type="checkbox" id="sale-flagged-only" style="margin: 0;">
            On sale only
          </label>
          <label style="font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer;" title="Show items you've excluded from this week's order. Exclusions persist in this browser.">
            <input type="checkbox" id="show-excluded" style="margin: 0;">
            Show excluded
          </label>
          <button id="clear-excluded-btn" class="btn" style="font-size: 11px; height: 28px; padding: 0 10px; display: none;" title="Remove all exclusion marks for this store">Clear exclusions (<span id="excluded-count">0</span>)</button>
          <button id="reorder-legend-btn" class="btn" style="font-size: 11px; height: 28px; padding: 0 10px; margin-left: auto;" title="What do all these tags mean?">? Legend</button>
          <button id="reorder-diagnose-btn" class="btn" style="font-size: 11px; height: 28px; padding: 0 10px;" title="Look up why a specific SKU is or isn't on the report">🔍 Diagnose SKU</button>
        </div>
      </div>

      <div id="reorder-highlights">${highlightsHTML(data.kpis)}</div>
      <div id="reorder-kpis">${kpiStripHTML(data.kpis)}</div>

      <div class="card">
        <div class="summary-bar" id="reorder-summary">
          <div>SKUs<strong>${data.count}</strong></div>
          <div>Total units<strong>${fmtN(data.total_units)}</strong></div>
          <div>Est. wholesale<strong>${fmt$(data.total_wholesale_cost)}</strong></div>
        </div>
        <div id="mix-multiplier-summary" style="display: none; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-dim);"></div>
        <div id="suggested-additions-panel" style="display: none;"></div>
        <div id="reorder-table"></div>
      </div>

      <div class="hint-box">
        <strong>Tiered min-max model.</strong> Long-tail SKUs: skipped if selling &lt; 3.5/week; otherwise restocked to 21-day supply when under 11 days. <strong>Hero SKUs</strong> (top 50 per store by trailing 90-day revenue, shown as <span class="tag" style="background: rgba(180, 140, 40, 0.15); color: #c89b32; border-color: rgba(200, 155, 50, 0.4); font-size: 9px; padding: 1px 5px;">★ HERO</span>) get protective treatment: no velocity floor, wider 28-day ceiling.
        Toggle <strong>Mix-aware</strong> to let category drift adjust the ceiling per-SKU. Toggle <strong>Heroes only</strong> to see just the Top 50 Hero items.
      </div>
    `;

    // ==== Exclusion state (localStorage-backed, per-store) ====
    // Must be declared BEFORE the columns array because the exclude column's
    // render function references excludedSkus and excludeKey at render time.
    function excludeKey(r) { return `${r.sku}|${r.location_id}`; }
    function exclusionStorageKey() {
      const sf = document.getElementById("store-filter");
      const s = sf ? sf.value : '';
      return `reorder-excluded::${s || 'all'}`;
    }
    function loadExclusions() {
      try {
        const raw = localStorage.getItem(exclusionStorageKey());
        return new Set(raw ? JSON.parse(raw) : []);
      } catch (e) { return new Set(); }
    }
    function saveExclusions(set) {
      try { localStorage.setItem(exclusionStorageKey(), JSON.stringify([...set])); }
      catch (e) {}
    }
    let excludedSkus = loadExclusions();

    const columns = [
      { key: '__include', label: 'Include / Exclude', sortable: false,
        tooltip: "Checked = include in this week's order. Uncheck to exclude.",
        render: r => {
          // Inverted: checked = INCLUDED (default). Unchecked = excluded.
          // The underlying excludedSkus set still tracks exclusions.
          const isExcluded = excludedSkus.has(excludeKey(r));
          return `<input type="checkbox" class="exclude-cb" data-sku="${r.sku}" data-loc="${r.location_id}" ${isExcluded ? '' : 'checked'} title="Uncheck to exclude this SKU from this week's order (persists in this browser)">`;
        } },
      { key: 'urgency', label: 'Status',
        render: r => `<span class="tag ${urgencyTagClass(r.urgency)}">${r.urgency}</span>` },
      { key: 'product_name', label: 'Product',
        render: r => {
          const anchor = r.is_top_sku ? `<span class="tag" style="background: rgba(180, 140, 40, 0.15); color: #c89b32; border-color: rgba(200, 155, 50, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Top 50 SKU by trailing 90-day revenue — protected by tiered reorder logic">★ HERO</span>` : '';
          const dataFee = (() => {
            if (r.data_fee_is_direct) {
              return `<span class="tag" style="background: rgba(140, 100, 180, 0.15); color: #a78bd9; border-color: rgba(160, 110, 200, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Direct deal with ${r.data_fee_partner} — this SKU is excluded from collective rebate programs">DIRECT</span>`;
            }
            if (r.data_fee_pct) {
              const basis = r.data_fee_basis === 'wholesale_cost' ? 'WS' : r.data_fee_basis === 'retail_sales' ? 'RT' : '';
              const partnerShort = r.data_fee_partner === 'Canna Collective' ? 'CC' : (r.data_fee_partner || '');
              return `<span class="tag" style="background: rgba(70, 140, 90, 0.15); color: #6dab84; border-color: rgba(80, 160, 100, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Active data revenue deal: ${r.data_fee_partner} pays ${r.data_fee_pct}% of ${r.data_fee_basis === 'wholesale_cost' ? 'wholesale cost' : 'retail sales'} for this SKU">${partnerShort}: ${r.data_fee_pct}% ${basis}</span>`;
            }
            return '';
          })();
          // Order Fill badges (visibility from latest Order Fill import)
          const ofBadges = (() => {
            const out = [];
            if (r.order_fill_back_in_stock) {
              out.push(`<span class="tag" style="background: rgba(80, 180, 100, 0.18); color: #6fcf85; border-color: rgba(90, 200, 110, 0.45); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Back in stock at OCS as of the latest Order Fill">BACK IN STOCK</span>`);
            }
            if (r.order_fill_new_arrival) {
              out.push(`<span class="tag" style="background: rgba(214, 180, 70, 0.18); color: #d6b446; border-color: rgba(220, 190, 80, 0.45); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Newly listed in the latest Order Fill">NEW</span>`);
            }
            // Flow Through tier badge — only if SKU is in latest Order Fill
            if (r.order_fill_flow_thru === false) {
              const eta = r.order_fill_estimated_delivery ? ` (delivery ${r.order_fill_estimated_delivery})` : '';
              out.push(`<span class="tag" style="background: rgba(106, 166, 214, 0.15); color: #6aa6d6; border-color: rgba(116, 176, 224, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Click-to-Buy: ships direct from OCS warehouse${eta}">CTB</span>`);
            } else if (r.order_fill_flow_thru === true) {
              const tier = r.order_fill_delivery_tier;
              const eta = r.order_fill_estimated_delivery ? ` (delivery ${r.order_fill_estimated_delivery})` : '';
              if (tier === 'Expedited') {
                out.push(`<span class="tag" style="background: rgba(220, 150, 90, 0.15); color: #dc965a; border-color: rgba(230, 165, 100, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Flow Through Expedited: longer lead time than CTB${eta}">FT-EXP</span>`);
              } else if (tier === 'Standard') {
                out.push(`<span class="tag" style="background: rgba(180, 130, 100, 0.15); color: #c08560; border-color: rgba(190, 140, 110, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="Flow Through Standard: longest lead time${eta}">FT-STD</span>`);
              }
            }
            return out.join('');
          })();
          // Sale flags — currently/recently discounted SKUs may have inflated velocity
          const saleTag = (() => {
            if (r.sale_flag === 'active') {
              const d = r.sale_flag_detail || {};
              const tip = `Active Sale: ${d.active_days_in_7 || '?'} of last 7 days had >30% of units discounted (avg ${d.avg_discount_pct || '?'}% off). Velocity may be inflated — be cautious about ordering as if this rate is steady-state.`;
              return `<span class="tag" style="background: rgba(214, 180, 70, 0.18); color: #d6b446; border-color: rgba(220, 190, 80, 0.45); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="${tip}">🏷️ Active Sale</span>`;
            }
            if (r.sale_flag === 'recent') {
              const d = r.sale_flag_detail || {};
              const since = d.days_since_last_promo != null ? `${d.days_since_last_promo}d ago` : 'recent';
              const tip = `Recently Ended Sale: last promo ${since}. Velocity over the past 30 days reflects sale conditions and may revert downward.`;
              return `<span class="tag" style="background: rgba(150, 150, 150, 0.15); color: #999; border-color: rgba(160, 160, 160, 0.4); font-size: 9px; padding: 1px 5px; margin-right: 4px; vertical-align: middle;" title="${tip}">↘️ Recently Ended Sale</span>`;
            }
            return '';
          })();
          return `${anchor}${dataFee}${ofBadges}${saleTag}${escapeHtml(r.product_name)}<div class="sku">${r.sku} · ${r.category || "—"}</div>`;
        } },
      { key: 'location_id', label: 'Store', render: r => storeLabel(r.location_id) },
      { key: 'on_hand', label: 'On hand', type: 'number', align: 'right',
        render: r => `<span style="${r.on_hand < 4 ? 'color: var(--critical)' : ''}">${r.on_hand}</span>` },
      { key: 'daily_velocity', label: 'Units/day', type: 'number', align: 'right',
        render: r => r.daily_velocity.toFixed(2) },
      { key: 'days_supply', label: 'Days', type: 'number', align: 'right',
        render: r => r.days_supply == null ? '—' : `<span style="${r.days_supply < 4 ? 'color: var(--critical)' : ''}">${r.days_supply.toFixed(1)}</span>` },
      { key: 'ocs_pack_size', label: 'Case Size', type: 'number', align: 'right',
        tooltip: "Case/pack size from OCS catalog. Blank or '—' means the SKU isn't currently in OCS catalog (discontinued or accessory).",
        render: r => r.ocs_pack_size != null && r.ocs_pack_size > 0
          ? r.ocs_pack_size
          : '<span class="muted" title="SKU not in current OCS catalog">—</span>' },
      { key: 'reorder_qty', label: 'Order qty', type: 'number', align: 'right',
        render: r => {
          const casesText = r.reorder_cases ? `<div class="sku">${r.reorder_cases} case${r.reorder_cases === 1 ? '' : 's'}</div>` : '';
          // Show mix multiplier tag if it diverges from 1.0
          let mixTag = '';
          if (r.mix_multiplier && Math.abs(r.mix_multiplier - 1.0) > 0.01) {
            const color = r.mix_multiplier > 1 ? 'var(--accent)' : 'var(--warning)';
            mixTag = `<div class="sku" style="color: ${color}">×${r.mix_multiplier.toFixed(2)} mix</div>`;
          }
          return `<span style="font-family: Georgia, serif; font-size: 15px;">${r.reorder_qty}</span>${casesText}${mixTag}`;
        } },
      { key: 'line_total', label: 'Est. $', type: 'number', align: 'right',
        render: r => r.line_total ? fmt$(r.line_total) : '—' },
      { key: 'ocs_stock_status', label: 'OCS In-Stock', align: 'right',
        tooltip: "Whether OCS has this SKU available to order. 'Yes' = in stock, 'No' = out at OCS, '—' = SKU not in current OCS catalog (likely discontinued or an accessory).",
        render: r => {
          if (r.ocs_stock_status === 'YES') return '<span class="tag tag-accent">Yes</span>';
          if (r.ocs_stock_status === 'NO') return '<span class="tag tag-critical" style="font-weight: 600;">No</span>';
          return '<span class="muted" title="Not in current OCS catalog">—</span>';
        } },
      { key: 'avg_rating', label: 'Rating', type: 'number', align: 'right',
        tooltip: 'Average rating across all managers (1-10). Synced from OCS Catalogue tab.',
        render: r => (typeof ratingDisplay === 'function')
          ? ratingDisplay(r.avg_rating, r.rating_count)
          : (r.avg_rating != null ? `${r.avg_rating.toFixed(1)} (${r.rating_count})` : '—') },
      { key: 'comment_count', label: 'Comments', type: 'number', align: 'right',
        tooltip: 'Number of manager comments on this SKU.',
        render: r => r.comment_count || '' },
    ];

    let currentData = data.recommendations;
    renderTable('reorder-table', currentData, columns, { defaultSort: 'urgency', emptyText: 'No reorder items.' });

    const search = document.getElementById("reorder-search");
    const storeFilter = document.getElementById("store-filter");
    const typeFilter = document.getElementById("type-filter");
    const urgencyFilter = document.getElementById("urgency-filter");
    const ocsOutToggle = document.getElementById("include-ocs-out");
    const mixAwareToggle = document.getElementById("mix-aware");
    const anchorsOnlyToggle = document.getElementById("anchors-only");
    const mixSummaryEl = document.getElementById("mix-multiplier-summary");

    function renderMixSummary(mults) {
      if (!mults) {
        mixSummaryEl.style.display = 'none';
        return;
      }
      const adjusted = Object.entries(mults)
        .filter(([_, m]) => Math.abs(m - 1.0) > 0.01)
        .sort((a, b) => Math.abs(b[1] - 1) - Math.abs(a[1] - 1));
      if (adjusted.length === 0) {
        mixSummaryEl.style.display = 'block';
        mixSummaryEl.innerHTML = `<strong>Mix-aware ON.</strong> No categories have enough drift to adjust — all multipliers = 1.0.`;
        return;
      }
      const parts = adjusted.map(([cat, m]) => {
        const arrow = m > 1 ? '↑' : '↓';
        const color = m > 1 ? 'var(--accent)' : 'var(--warning)';
        return `<span style="color: ${color}">${cat} ×${m.toFixed(2)} ${arrow}</span>`;
      });
      mixSummaryEl.style.display = 'block';
      mixSummaryEl.innerHTML = `<strong>Mix-aware ON.</strong> Adjusted categories (90-day drift): ${parts.join(' · ')}`;
    }

    // ==== UI helpers that depend on exclusion state (already declared above) ====
    function updateExcludedUI() {
      const count = excludedSkus.size;
      const btn = document.getElementById("clear-excluded-btn");
      const cnt = document.getElementById("excluded-count");
      if (cnt) cnt.textContent = count;
      if (btn) btn.style.display = count > 0 ? '' : 'none';
    }
    updateExcludedUI();

    // ==== Category filter population ====
    function populateCategoryFilter() {
      const sel = document.getElementById("category-filter");
      if (!sel) return;
      // Preserve current selection
      const current = sel.value;
      const cats = [...new Set(currentData.map(r => r.category).filter(Boolean))].sort();
      sel.innerHTML = '<option value="">All categories</option>' +
        cats.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`).join("");
    }

    function applyTextFilter() {
      const q = search.value.trim().toLowerCase();
      const anchorsOnly = anchorsOnlyToggle.checked;
      const dataFeesOnly = document.getElementById("data-fees-only").checked;
      const saleFlaggedOnly = document.getElementById("sale-flagged-only").checked;
      const categoryFilter = document.getElementById("category-filter").value;
      const showExcluded = document.getElementById("show-excluded").checked;
      let filtered = currentData;
      if (anchorsOnly) {
        filtered = filtered.filter(r => r.is_top_sku);
      }
      if (dataFeesOnly) {
        // "Rebate qualified" — has either a collective deal OR a direct deal
        filtered = filtered.filter(r => r.data_fee_pct || r.data_fee_is_direct);
      }
      if (saleFlaggedOnly) {
        filtered = filtered.filter(r => r.sale_flag === 'active' || r.sale_flag === 'recent');
      }
      if (categoryFilter) {
        filtered = filtered.filter(r => r.category === categoryFilter);
      }
      if (!showExcluded) {
        filtered = filtered.filter(r => !excludedSkus.has(excludeKey(r)));
      }
      if (q) {
        filtered = filtered.filter(r =>
          (r.product_name || '').toLowerCase().includes(q) ||
          (r.sku || '').toLowerCase().includes(q)
        );
      }
      renderTable('reorder-table', filtered, columns, { defaultSort: 'urgency' });
      const anchorCount = filtered.filter(r => r.is_top_sku).length;
      const dataFeeCount = filtered.filter(r => r.data_fee_pct || r.data_fee_is_direct).length;
      const saleCount = filtered.filter(r => r.sale_flag === 'active' || r.sale_flag === 'recent').length;
      const excludedCount = currentData.filter(r => excludedSkus.has(excludeKey(r))).length;
      const badges = [];
      if (anchorCount > 0 && !anchorsOnly) badges.push(`<span style="color: #c89b32; font-size: 10px;">(${anchorCount} Hero)</span>`);
      if (dataFeeCount > 0 && !dataFeesOnly) badges.push(`<span style="color: #6dab84; font-size: 10px;">(${dataFeeCount} rebate)</span>`);
      if (saleCount > 0 && !saleFlaggedOnly) badges.push(`<span style="color: #d6b446; font-size: 10px;">(${saleCount} on sale)</span>`);
      if (excludedCount > 0 && !showExcluded) badges.push(`<span style="color: var(--text-dim); font-size: 10px;">(${excludedCount} excluded hidden)</span>`);
      document.getElementById("reorder-summary").innerHTML = `
        <div>SKUs<strong>${filtered.length}</strong> ${badges.join(' ')}</div>
        <div>Total units<strong>${fmtN(filtered.reduce((s, r) => s + r.reorder_qty, 0))}</strong></div>
        <div>Est. wholesale<strong>${fmt$(filtered.reduce((s, r) => s + (r.line_total || 0), 0))}</strong></div>
      `;
    }

    async function refetch() {
      const params = new URLSearchParams();
      if (storeFilter.value) params.set("store", storeFilter.value);
      params.set("top_level", typeFilter.value);
      if (urgencyFilter.value && urgencyFilter.value !== "all") {
        params.set("urgency", urgencyFilter.value);
      }
      if (ocsOutToggle.checked) params.set("include_ocs_out", "true");
      if (mixAwareToggle.checked) params.set("mix_aware", "true");
      const d = await api(`/api/reorder?${params.toString()}`);
      currentData = d.recommendations;
      const kpiBox = document.getElementById("reorder-kpis");
      if (kpiBox) kpiBox.innerHTML = kpiStripHTML(d.kpis);
      const hlBox = document.getElementById("reorder-highlights");
      if (hlBox) hlBox.innerHTML = highlightsHTML(d.kpis);
      renderMixSummary(d.mix_multipliers);
      populateCategoryFilter();
      applyTextFilter();
      // Suggested Additions: only show when a single store is selected
      // (cross-store comparisons don't make sense without a target store).
      loadSuggestedAdditions(storeFilter.value);
    }

    storeFilter.addEventListener("change", () => {
      // When store changes, swap the exclusion set to the new store's
      excludedSkus = loadExclusions();
      updateExcludedUI();
      refetch();
    });
    typeFilter.addEventListener("change", refetch);
    urgencyFilter.addEventListener("change", refetch);
    ocsOutToggle.addEventListener("change", refetch);
    mixAwareToggle.addEventListener("change", refetch);
    anchorsOnlyToggle.addEventListener("change", applyTextFilter);
    document.getElementById("data-fees-only").addEventListener("change", applyTextFilter);
    document.getElementById("sale-flagged-only").addEventListener("change", applyTextFilter);
    document.getElementById("category-filter").addEventListener("change", applyTextFilter);
    document.getElementById("show-excluded").addEventListener("change", applyTextFilter);

    // Include/Exclude checkbox click (event delegation — handles dynamic rows)
    // Inverted logic: checked = include (default), unchecked = exclude.
    // Internally we still maintain the excludedSkus set as the source of truth.
    document.getElementById("reorder-table").addEventListener("change", (e) => {
      const cb = e.target;
      if (!cb.classList.contains("exclude-cb")) return;
      const key = `${cb.dataset.sku}|${cb.dataset.loc}`;
      if (cb.checked) excludedSkus.delete(key);  // checked = include
      else excludedSkus.add(key);                 // unchecked = exclude
      saveExclusions(excludedSkus);
      updateExcludedUI();
      // Don't re-render immediately — keep the row visible so user can uncheck
      // if they clicked by mistake. Recompute summary only.
      const summary = document.getElementById("reorder-summary");
      const excludedCount = currentData.filter(r => excludedSkus.has(excludeKey(r))).length;
      const showExcluded = document.getElementById("show-excluded").checked;
      const anchorsOnly = anchorsOnlyToggle.checked;
      let visible = currentData;
      if (anchorsOnly) visible = visible.filter(r => r.is_top_sku);
      const categoryFilter = document.getElementById("category-filter").value;
      if (categoryFilter) visible = visible.filter(r => r.category === categoryFilter);
      if (!showExcluded) visible = visible.filter(r => !excludedSkus.has(excludeKey(r)));
      const anchorCount = visible.filter(r => r.is_top_sku).length;
      summary.innerHTML = `
        <div>SKUs<strong>${visible.length}</strong>${anchorCount > 0 && !anchorsOnly ? ` <span style="color: #c89b32; font-size: 10px;">(${anchorCount} Hero)</span>` : ''}${excludedCount > 0 && !showExcluded ? ` <span style="color: var(--text-dim); font-size: 10px;">(${excludedCount} excluded hidden)</span>` : ''}</div>
        <div>Total units<strong>${fmtN(visible.reduce((s, r) => s + r.reorder_qty, 0))}</strong></div>
        <div>Est. wholesale<strong>${fmt$(visible.reduce((s, r) => s + (r.line_total || 0), 0))}</strong></div>
      `;
    });

    // Clear exclusions button
    document.getElementById("clear-excluded-btn").addEventListener("click", () => {
      if (excludedSkus.size === 0) return;
      if (!confirm(`Clear ${excludedSkus.size} exclusion mark(s) for this store? This cannot be undone.`)) return;
      excludedSkus.clear();
      saveExclusions(excludedSkus);
      updateExcludedUI();
      applyTextFilter();
    });

    // Legend button — shows what every tag means
    document.getElementById("reorder-legend-btn").addEventListener("click", showReorderLegend);
    // Diagnose button — open a modal to look up why a specific SKU is/isn't on the report
    document.getElementById("reorder-diagnose-btn").addEventListener("click", showReorderDiagnose);

    // Populate category filter from initial data and keep it in sync
    populateCategoryFilter();

    document.getElementById("reorder-excel-btn").addEventListener("click", () => {
      const params = new URLSearchParams();
      if (storeFilter.value) params.set("store", storeFilter.value);
      params.set("top_level", typeFilter.value);
      if (urgencyFilter.value && urgencyFilter.value !== "all") params.set("urgency", urgencyFilter.value);
      if (ocsOutToggle.checked) params.set("include_ocs_out", "true");
      if (mixAwareToggle.checked) params.set("mix_aware", "true");
      downloadUrl(`/api/export/reorder?${params.toString()}`);
    });
    search.addEventListener("input", applyTextFilter);

    // ==== Export to OCS Template ====
    // Fills the selected store's latest auto-pulled OrderExport with the
    // engine's reorder quantities and downloads it, ready to upload to OCS.
    const exportOcsBtn = document.getElementById("reorder-export-ocs-btn");
    if (exportOcsBtn) exportOcsBtn.addEventListener("click", async () => {
      const store = storeFilter.value;
      if (!store) {
        alert("Select a single store (store filter, top-right) before exporting an OCS order template — orders are placed per store.");
        return;
      }
      const orig = exportOcsBtn.innerHTML;
      exportOcsBtn.disabled = true;
      exportOcsBtn.textContent = "Preparing…";
      try {
        const res = await fetch(`/api/reorder/export-ocs-template?store=${encodeURIComponent(store)}`, { credentials: "same-origin" });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || "Export failed");
        }
        const blob = await res.blob();
        const cd = res.headers.get("content-disposition") || "";
        const m = cd.match(/filename="?([^"]+)"?/);
        const fname = m ? m[1] : `OCS_Order_${store}.xlsx`;
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert("Export failed: " + e.message);
      } finally {
        exportOcsBtn.disabled = false;
        exportOcsBtn.innerHTML = orig;
      }
    });

  } catch (e) { showError(e); }
}

function urgencyTagClass(u) {
  return ({
    stockout: "tag-stockout", critical: "tag-critical",
    high: "tag-warning", medium: "tag-info",
  })[u] || "tag";
}

// STOCKOUTS
// ========================================================================
async function renderStockouts() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">LOADING STOCKOUTS...</div>`;
  try {
    const [locs, initialData] = await Promise.all([
      api("/api/locations"),
      api("/api/stockouts"),
    ]);
    let data = initialData;

    main.innerHTML = `
      <div class="section-header">
        <div>
          <div class="kicker">Active Stockouts · Lost Sales</div>
          <h2>Selling fast, inventory at zero</h2>
        </div>
        <div class="controls-row">
          <input type="search" id="stockout-search" placeholder="Search...">
          <select id="stockout-type-filter">
            <option value="">Cannabis + Accessories</option>
            <option value="Cannabis">Cannabis only</option>
            <option value="Accessories">Accessories only</option>
          </select>
          <select id="stockout-store-filter">
            <option value="">All stores</option>
            ${locs.map(l => `<option value="${l.id}">${l.short_name || l.name}</option>`).join("")}
          </select>
          <span class="tag tag-critical" id="stockout-risk">${fmt$(data.revenue_at_risk)}/mo at risk</span>
          ${excelButtonHtml("stockout-excel-btn")}
        </div>
      </div>

      <div class="card">
        <div id="stockout-table"></div>
      </div>
    `;

    const columns = [
      { key: 'product_name', label: 'Product',
        render: r => {
          const ocsTag = r.ocs_out_of_stock
            ? '<span class="tag tag-critical" style="font-size: 9px; padding: 1px 5px; margin-right: 4px;" title="Currently out of stock at OCS too">OCS OUT</span>'
            : '';
          const rebate = rebateBadgeHtml(r);
          return `${rebate}${ocsTag}${escapeHtml(r.product_name)}<div class="sku">${r.sku} · ${r.category || "—"}</div>`;
        } },
      { key: 'location_id', label: 'Store', render: r => storeLabel(r.location_id) },
      { key: 'units_7d', label: '7D', type: 'number', align: 'right', group: 'Units Sold',
        tooltip: 'Total units sold in the trailing 7 days.' },
      { key: 'units_14d', label: '14D', type: 'number', align: 'right', group: 'Units Sold',
        tooltip: 'Total units sold in the trailing 14 days.' },
      { key: 'units_30d', label: '30D', type: 'number', align: 'right', group: 'Units Sold',
        tooltip: 'Total units sold in the trailing 30 days.' },
      { key: 'velocity_7d', label: '/day 7D', type: 'number', align: 'right', group: 'Sales Velocity',
        tooltip: 'Trailing 7-day units sold ÷ 7 = average units sold per day over the past week. Best signal for current demand.',
        render: r => (r.velocity_7d || 0).toFixed(2) },
      { key: 'velocity_14d', label: '/day 14D', type: 'number', align: 'right', group: 'Sales Velocity',
        tooltip: 'Trailing 14-day units sold ÷ 14. Smooths out single-week noise.',
        render: r => (r.velocity_14d || 0).toFixed(2) },
      { key: 'daily_velocity', label: '/day 30D', type: 'number', align: 'right', group: 'Sales Velocity',
        tooltip: 'Trailing 30-day units sold ÷ 30. The default reorder-engine velocity. Smoothest but slowest to react to trend changes.',
        render: r => r.daily_velocity.toFixed(2) },
      { key: 'revenue_30d', label: 'Revenue 30D', type: 'number', align: 'right',
        tooltip: 'Total revenue from this SKU over the trailing 30 days at this store.',
        render: r => fmt$(r.revenue_30d) },
      { key: 'note', label: 'Reason for Stockout / Other Notes', sortable: false,
        tooltip: 'Click to add or edit a note explaining the stockout.',
        render: r => `<input type="text" class="stockout-note" data-sku="${r.sku}" data-loc="${r.location_id}" value="${escapeHtml(r.note || '')}" placeholder="add note…" style="width: 220px; font-size: 11px; padding: 4px 6px;">` },
    ];

    let currentData = data.items;
    const wireNoteListeners = () => {
      document.querySelectorAll('.stockout-note').forEach(input => {
        input.addEventListener('blur', async () => {
          const sku = input.dataset.sku;
          const loc = input.dataset.loc;
          const note = input.value.trim();
          try {
            await fetch('/api/stockouts/note', {
              method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({sku, location_id: loc, note}),
            });
            // Visual confirmation
            input.style.borderColor = 'var(--ok, #6a7)';
            setTimeout(() => { input.style.borderColor = ''; }, 1000);
          } catch (e) {
            input.style.borderColor = 'var(--critical)';
          }
        });
      });
    };
    const redraw = () => {
      const q = document.getElementById("stockout-search").value.trim().toLowerCase();
      const filtered = q
        ? currentData.filter(r => (r.product_name || '').toLowerCase().includes(q) || (r.sku || '').toLowerCase().includes(q))
        : currentData;
      renderTable('stockout-table', filtered, columns, { defaultSort: 'revenue_30d', defaultDir: 'desc' });
      wireNoteListeners();
    };
    renderTable('stockout-table', currentData, columns, {
      defaultSort: 'revenue_30d', defaultDir: 'desc',
      emptyText: 'No active stockouts. Nice.'
    });
    wireNoteListeners();

    const refetch = async () => {
      const params = new URLSearchParams();
      const type = document.getElementById("stockout-type-filter").value;
      const store = document.getElementById("stockout-store-filter").value;
      if (type) params.set("top_level", type);
      if (store) params.set("store", store);
      const url = params.toString() ? `/api/stockouts?${params.toString()}` : "/api/stockouts";
      data = await api(url);
      currentData = data.items;
      document.getElementById("stockout-risk").textContent = `${fmt$(data.revenue_at_risk)}/mo at risk`;
      redraw();
    };

    document.getElementById("stockout-search").addEventListener("input", redraw);

async function renderDeadStock() {
  const main = document.getElementById("main");
