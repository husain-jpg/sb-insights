    `;

    // Wire up detail expansion
    document.querySelectorAll(".mr-detail-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const month = btn.dataset.month;
        const row = document.querySelector(`tr.mr-detail-row[data-month="${month}"]`);
        const content = row.querySelector(".mr-detail-content");
        if (row.style.display === "none") {
          row.style.display = "table-row";
          btn.textContent = "Hide files";
          try {
            const detail = await api(`/api/monthly-reports/${month}`);
            const reportLabel = (t) => ({
              diagnostic: '<span class="tag tag-info" style="font-size: 9px; padding: 1px 5px;">Diagnostic</span>',
              sales_by_product: '<span class="tag tag-accent" style="font-size: 9px; padding: 1px 5px;">Sales by Product</span>',
              inventory: '<span class="tag" style="font-size: 9px; padding: 1px 5px;">Inventory</span>',
              other: '<span class="tag" style="font-size: 9px; padding: 1px 5px;">Other</span>',
            })[t] || '';
            const fmtKB = (b) => (b / 1024).toFixed(0) + ' KB';
            content.innerHTML = `
              <div style="display: flex; flex-direction: column; gap: 12px;">
                ${detail.stores.map(s => `
                  <div style="border-left: 2px solid var(--accent); padding-left: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
                      <strong>${escapeHtml(s.store)}</strong>
                      <button class="btn mr-package-btn" data-month="${month}" data-store="${escapeHtml(s.store)}" style="font-size: 10px; height: 24px;">Package this store only</button>
                    </div>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px;">
                      ${s.files.map(f => `
                        <div style="background: var(--bg-elev); padding: 4px 8px; border-radius: 4px;">
                          ${reportLabel(f.report_type)} ${escapeHtml(f.name)} <span style="color: var(--text-faint);">(${fmtKB(f.size_bytes)})</span>
                        </div>
                      `).join("")}
                    </div>
                  </div>
                `).join("")}
              </div>
            `;
            // Re-wire the per-store package buttons that were just added
            wireUpPackageButtons();
          } catch (e) {
            content.innerHTML = `<div class="error" style="font-size: 11px;">${escapeHtml(e.message)}</div>`;
          }
        } else {
          row.style.display = "none";
          btn.textContent = "View files";
        }
      });
    });

    // Top-level package buttons (per-month "all stores")
    wireUpPackageButtons();

    function wireUpPackageButtons() {
      document.querySelectorAll(".mr-package-btn").forEach(btn => {
        if (btn.dataset.wired === "1") return;
        btn.dataset.wired = "1";
        btn.addEventListener("click", () => {
          const month = btn.dataset.month;
          const store = btn.dataset.store || "";
          // Find the matching collective dropdown for THIS month
          const select = document.querySelector(`select.mr-collective[data-month="${month}"]`);
          const collective = select ? select.value : "";
          const params = new URLSearchParams();
          if (store) params.set("store", store);
          if (collective) params.set("collective", collective);
          downloadUrl(`/api/monthly-reports/${month}/package?${params.toString()}`);
        });
      });
    }
  } catch (e) { showError(e); }
}

// ========================================================================
// Market Intelligence — OCS regional/municipal benchmarks
// ========================================================================
// Two views toggleable via tabs:
//   1. Gap Report — top municipality SKUs you don't carry
//   2. Performance Comparison — SKUs you carry, your velocity vs peer avg
//
// Honest caveats baked into UI: stale data warning, "top regional ≠ right
// for your customers" hint, period mismatch if comparing across imports.

let _miCurrentStore = null;
let _miCurrentView = "gap";  // 'gap' | 'comparison' | 'imports'

async function renderMarketIntel() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">LOADING MARKET INTELLIGENCE...</div>`;
  try {
    // Fetch imports list to populate store dropdown
    const data = await api("/api/market-intelligence/imports");
    // /api/locations returns a flat array, not {locations: [...]}.
    // Defensive: handle either shape just in case.
    const locsRaw = await api("/api/locations").catch(() => []);
    const stores = { locations: Array.isArray(locsRaw) ? locsRaw : (locsRaw.locations || []) };
    const folders = await api("/api/market-intelligence/folders").catch(() => ({ folders: [] }));

    // Group imports by location to find latest per store
    const importsByStore = {};
    for (const imp of (data.items || [])) {
      if (!importsByStore[imp.location_id]) importsByStore[imp.location_id] = [];
      importsByStore[imp.location_id].push(imp);
    }

    // Pick a default store if none chosen yet — prefer a store with data
    if (!_miCurrentStore && data.items && data.items.length > 0) {
      _miCurrentStore = data.items[0].location_id;
    }
    // Fallback: if our selected store has no data, switch to one that does
    if (_miCurrentStore && !importsByStore[_miCurrentStore] && data.items && data.items.length > 0) {
      _miCurrentStore = data.items[0].location_id;
    }

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div>
          <div class="kicker">OCS Regional & Municipal Benchmarks</div>
          <h2 style="white-space: nowrap;">Market Intelligence</h2>
        </div>
        <div class="controls-row">
          <select id="mi-store-select">
            ${stores.locations.map(loc => {
              const has = importsByStore[loc.id];
              const label = has ? loc.name : `${loc.name} (no data)`;
              const sel = loc.id === _miCurrentStore ? 'selected' : '';
              return `<option value="${loc.id}" ${sel} ${has ? '' : 'disabled'}>${escapeHtml(label)}</option>`;
            }).join('')}
          </select>
          <div style="display: flex; gap: 4px; margin-left: 12px;">
            <button class="btn ${_miCurrentView === 'gap' ? 'btn-primary' : ''}" data-view="gap" id="mi-view-gap">Gap Report</button>
            <button class="btn ${_miCurrentView === 'comparison' ? 'btn-primary' : ''}" data-view="comparison" id="mi-view-comparison">Performance vs Peers</button>
            <button class="btn ${_miCurrentView === 'imports' ? 'btn-primary' : ''}" data-view="imports" id="mi-view-imports">Imports</button>
          </div>
        </div>
      </div>

      <div class="card" style="padding: 14px 16px; margin-bottom: 14px; font-size: 12px; line-height: 1.6;">
        <div style="font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; font-weight: 600;">About this data</div>
        <div style="color: var(--text-dim);">OCS provides per-store sales benchmarks vs. other stores in your municipality. Updated every ~48 hours on the OCS portal.</div>

        <div style="font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 8px; font-weight: 600;">Recommended cadence</div>
        <div style="color: var(--text-dim);">Import bi-weekly using a <strong style="color: var(--text);">trailing 30-day window</strong> in OCS. Balances signal stability with freshness — 30-day captures enough sales-days to make peer velocities meaningful, and bi-weekly imports overlap by ~16 days to smooth week-to-week noise. Stale warnings fire after 21 days.</div>

        <div style="font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 8px; font-weight: 600;">Today's workflow (manual)</div>
        <div style="color: var(--text-dim);">Download both files for each store from the OCS portal. Drop into <code style="background: var(--bg-elev-2); padding: 1px 6px; border-radius: 3px;">imports/market_intelligence/{YYYY-MM-DD}/{StoreName}/</code> then click <strong style="color: var(--text);">Imports</strong> → Import all.</div>

        <div style="font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 8px; font-weight: 600;">Automation status</div>
        <div style="color: var(--text-dim);">OCS confirmed no API or scheduled email export available (May 2026). Manual import remains the permanent workflow.</div>

        <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--text-faint); font-size: 11px;">
          ⚠ Top regional sellers ≠ guaranteed winners for your customers. Use as a hypothesis generator, not a directive. Adding SKUs commits real shelf space + capital.
        </div>
      </div>

      <div id="mi-content"></div>
    `;

    document.getElementById("mi-store-select").addEventListener("change", e => {
      _miCurrentStore = e.target.value;
      loadMiContent();
    });
    document.querySelectorAll('[id^="mi-view-"]').forEach(btn => {
      btn.addEventListener('click', () => {
        _miCurrentView = btn.dataset.view;
        renderMarketIntel();  // re-render to update active button
      });
    });

    // Handle empty-data case after we've rendered the chrome
    const hasImports = data.items && data.items.length > 0;
    const hasFolders = folders.folders && folders.folders.length > 0;
    if (!hasImports && !hasFolders) {
      document.getElementById("mi-content").innerHTML = `
        <div class="card" style="padding: 32px; text-align: center;">
          <div style="font-size: 14px; margin-bottom: 8px;">No market intelligence data yet</div>
          <div style="font-size: 12px; color: var(--text-dim);">
            Drop OCS exports (Average Sales Units + Sales Velocity reports) into:<br>
            <code style="background: var(--bg-elev-2); padding: 1px 6px; border-radius: 3px; margin-top: 4px; display: inline-block;">imports/market_intelligence/{YYYY-MM-DD}/{StoreName}/</code>
            <br>Then click <strong>Imports</strong> above and run the import.
          </div>
        </div>
      `;
      return;
    }

    loadMiContent();
  } catch (e) { showError(e); }
}

async function loadMiContent() {
  if (_miCurrentView === "imports") {
    return loadMiImportsView();
  }
  if (!_miCurrentStore) {
    document.getElementById("mi-content").innerHTML = '<div class="card" style="padding: 24px; color: var(--text-dim); font-size: 12px;">Pick a store above.</div>';
    return;
  }
  if (_miCurrentView === "gap") {
    return loadMiGapView();
  }
  if (_miCurrentView === "comparison") {
    return loadMiComparisonView();
  }
}

async function loadMiGapView() {
  const container = document.getElementById("mi-content");
  container.innerHTML = `<div class="loading">Loading gap report...</div>`;
  try {
    const data = await api(`/api/market-intelligence/gap-report?location_id=${encodeURIComponent(_miCurrentStore)}&limit=200`);
    if (!data.items || data.items.length === 0) {
      container.innerHTML = `<div class="card" style="padding: 24px; color: var(--text-dim); font-size: 12px;">${data.warning || 'No gap data available.'}</div>`;
      return;
    }

    const importedDate = data.imported_at ? data.imported_at.slice(0, 10) : '?';
    const period = data.period_start && data.period_end
      ? `${data.period_start} → ${data.period_end} (${data.period_days || '?'} days)`
      : '?';
    const ageDays = data.imported_at ? Math.floor((Date.now() - new Date(data.imported_at).getTime()) / 86400000) : null;
    const stale = ageDays !== null && ageDays > 21;

    container.innerHTML = `
      <div class="card" style="padding: 12px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 11px; color: var(--text-dim);">
          <strong>Period:</strong> ${period} &nbsp;·&nbsp;
          <strong>Imported:</strong> ${importedDate}${ageDays !== null ? ` (${ageDays}d ago)` : ''} &nbsp;·&nbsp;
          <strong>Showing:</strong> top ${data.items.length} SKUs you don't carry
        </div>
        ${stale ? '<span class="tag" style="background: rgba(214, 100, 100, 0.15); color: #d66464; font-size: 10px;">STALE — re-import recommended</span>' : ''}
      </div>

      <div class="card">
        <div id="mi-gap-table"></div>
      </div>
    `;

    const columns = [
      { key: 'rank', label: '#', type: 'number', align: 'right',
        render: (r, i) => i + 1, sortValue: (r, i) => i },
      { key: 'item_name', label: 'Product',
        render: r => `${escapeHtml(r.item_name || r.sku)}<div class="sku">${escapeHtml(r.brand || '—')} · ${escapeHtml(r.supplier || '—')}</div>` },
      { key: 'subcategory', label: 'Category', render: r => r.subcategory || '—' },
      { key: 'size', label: 'Size', render: r => r.size || '—' },
      { key: 'municipality_units', label: 'Peer units (per store)', type: 'number', align: 'right',
        tooltip: 'Average units sold per peer store in your municipality during the period.',
        render: r => r.municipality_units ? r.municipality_units.toFixed(0) : '—' },
      { key: 'municipality_velocity', label: 'Peer velocity (/day)', type: 'number', align: 'right',
        tooltip: 'Average daily units when the SKU sells — only counts days with sales.',
        render: r => r.municipality_velocity ? r.municipality_velocity.toFixed(2) : '—' },
      { key: 'unit_price', label: 'Wholesale', type: 'number', align: 'right',
        render: r => r.unit_price ? fmt$2(r.unit_price) : '—' },
      { key: 'pack_size', label: 'Case', type: 'number', align: 'right',
        render: r => r.pack_size || '—' },
      { key: 'stock_status', label: 'OCS', align: 'center',
        render: r => r.stock_status === 'YES'
          ? '<span class="tag tag-accent" style="font-size: 9px;">In stock</span>'
          : (r.stock_status === 'NO' ? '<span class="tag tag-critical" style="font-size: 9px;">Out</span>' : '<span class="tag" style="font-size: 9px;">?</span>') },
    ];
    renderTable('mi-gap-table', data.items, columns, { defaultSort: null, emptyText: 'No gap SKUs.' });
  } catch (e) {
    container.innerHTML = `<div class="error" style="padding: 16px;">${escapeHtml(e.message)}</div>`;
  }
}

async function loadMiComparisonView() {
  const container = document.getElementById("mi-content");
  container.innerHTML = `<div class="loading">Loading performance comparison...</div>`;
  try {
    const data = await api(`/api/market-intelligence/performance-comparison?location_id=${encodeURIComponent(_miCurrentStore)}&limit=500`);
    if (!data.items || data.items.length === 0) {
      container.innerHTML = `<div class="card" style="padding: 24px; color: var(--text-dim); font-size: 12px;">${data.warning || 'No performance data available.'}</div>`;
      return;
    }

    const underweight = data.items.filter(x => x.performance_flag === 'underweight').length;
    const outperforming = data.items.filter(x => x.performance_flag === 'outperforming').length;
    const inLine = data.items.filter(x => x.performance_flag === 'in_line').length;

    container.innerHTML = `
      <div class="card" style="padding: 12px 16px; margin-bottom: 12px;">
        <div style="font-size: 11px; color: var(--text-dim); display: flex; gap: 24px;">
          <div><strong>${data.items.length}</strong> SKUs you carry that are also in the municipality data</div>
          <div><span style="color: var(--critical);">●</span> ${underweight} underweight</div>
          <div><span style="color: var(--ok, #6a7);">●</span> ${outperforming} outperforming</div>
          <div><span style="color: var(--text-dim);">●</span> ${inLine} in line</div>
        </div>
      </div>

      <div class="card">
        <div id="mi-comparison-table"></div>
      </div>
    `;

    const flagTag = (flag) => {
      if (flag === 'underweight') return '<span class="tag tag-critical" style="font-size: 9px;">UNDERWEIGHT</span>';
      if (flag === 'outperforming') return '<span class="tag tag-accent" style="font-size: 9px;">OUTPERFORMING</span>';
      if (flag === 'in_line') return '<span class="tag" style="font-size: 9px;">IN LINE</span>';
      return '';
    };

    const columns = [
      { key: 'item_name', label: 'Product',
        render: r => `${escapeHtml(r.item_name || r.sku)}<div class="sku">${escapeHtml(r.brand || '—')}</div>` },
      { key: 'subcategory', label: 'Category', render: r => r.subcategory || '—' },
      { key: 'your_units', label: 'You', type: 'number', align: 'right',
        tooltip: 'Cumulative units sold at THIS store during the period.',
        render: r => r.your_units ? r.your_units.toFixed(0) : '—' },
      { key: 'municipality_units', label: 'Peer avg', type: 'number', align: 'right',
        tooltip: 'Average units sold per peer store in your municipality.',
        render: r => r.municipality_units ? r.municipality_units.toFixed(0) : '—' },
      { key: 'units_ratio', label: 'Ratio', type: 'number', align: 'right',
        tooltip: 'Your units ÷ peer average. <0.5 = underweight, >1.5 = outperforming.',
        render: r => r.units_ratio !== null && r.units_ratio !== undefined ? `${r.units_ratio.toFixed(2)}×` : '—' },
      { key: 'performance_flag', label: 'Flag', align: 'center',
        render: r => flagTag(r.performance_flag) },
      { key: 'your_velocity', label: 'Your /day', type: 'number', align: 'right',
        render: r => r.your_velocity ? r.your_velocity.toFixed(2) : '—' },
      { key: 'municipality_velocity', label: 'Peer /day', type: 'number', align: 'right',
        render: r => r.municipality_velocity ? r.municipality_velocity.toFixed(2) : '—' },
    ];
    renderTable('mi-comparison-table', data.items, columns, {
      defaultSort: 'municipality_units', defaultSortDesc: true,
      emptyText: 'No comparison data.'
    });
  } catch (e) {
    container.innerHTML = `<div class="error" style="padding: 16px;">${escapeHtml(e.message)}</div>`;
  }
}

async function loadMiImportsView() {
  const container = document.getElementById("mi-content");
  container.innerHTML = `<div class="loading">Loading imports...</div>`;
  try {
    const [imports, folders] = await Promise.all([
      api("/api/market-intelligence/imports"),
      api("/api/market-intelligence/folders"),
    ]);

    const pendingFolders = folders.folders.filter(f => f.file_count > 0);

    container.innerHTML = `
      <div class="card" style="margin-bottom: 16px;">
        <div style="padding: 14px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2); display: flex; justify-content: space-between; align-items: center;">
          <div>
            <strong>Folders ready to import</strong>
            <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">${pendingFolders.length} folder(s) found</span>
          </div>
          ${pendingFolders.length > 1 ? `
            <button class="btn" id="mi-import-all-btn" style="font-size: 11px;">⚡ Import all (${pendingFolders.length})</button>
          ` : ''}
        </div>
        ${pendingFolders.length === 0 ? `
          <div style="padding: 16px; color: var(--text-dim); font-size: 12px;">
            No folders found. Drop OCS exports into <code style="background: var(--bg-elev-2); padding: 1px 6px;">imports/market_intelligence/{YYYY-MM-DD}/{StoreName}/</code>.
          </div>
        ` : `
          <table style="font-size: 12px;">
            <thead><tr><th>Date</th><th>Store</th><th>Files</th><th></th></tr></thead>
            <tbody>
              ${pendingFolders.map(f => `
                <tr>
                  <td>${f.date}</td>
                  <td><strong>${escapeHtml(f.store_name)}</strong></td>
                  <td style="font-size: 10px; color: var(--text-dim);">${f.files.map(escapeHtml).join('<br>')}</td>
                  <td><button class="btn mi-import-btn" data-date="${f.date}" data-store="${escapeHtml(f.store_name)}" style="font-size: 11px;">Import</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `}
      </div>

      <div class="card">
        <div style="padding: 14px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
          <strong>Import history</strong>
        </div>
        ${imports.items.length === 0 ? `
          <div style="padding: 16px; color: var(--text-dim); font-size: 12px;">No imports yet.</div>
        ` : `
          <table style="font-size: 11px;">
            <thead><tr><th>Imported</th><th>Store</th><th>Period</th><th class="num">SKUs</th><th>Municipality</th></tr></thead>
            <tbody>
              ${imports.items.map(imp => `
                <tr>
                  <td style="color: var(--text-dim);">${imp.imported_at}</td>
                  <td><strong>${escapeHtml(imp.store_name || imp.location_id)}</strong></td>
                  <td>${imp.period_start || '?'} → ${imp.period_end || '?'} (${imp.period_days || '?'}d)</td>
                  <td class="num">${imp.sku_count}</td>
                  <td>${imp.has_municipality ? 'Yes' : '<span style="color: var(--text-faint);">No (Innisfil-style)</span>'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `}
      </div>
    `;

    document.querySelectorAll(".mi-import-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "Importing...";
        try {
          const res = await fetch(`${API}/api/market-intelligence/import`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: btn.dataset.date, store_name: btn.dataset.store }),
          });
          if (!res.ok) {
            const err = await res.json();
            alert("Import failed: " + (err.detail || "unknown"));
            btn.disabled = false;
            btn.textContent = "Import";
            return;
          }
          const result = await res.json();
          alert(`Imported ${result.sku_count} SKUs for ${result.store_name}.`);
          await loadMiImportsView();
        } catch (e) {
          alert("Import failed: " + e.message);
          btn.disabled = false;
          btn.textContent = "Import";
        }
      });
    });

    // Bulk "Import all" button — processes every pending folder in one call.
    // Continues on per-folder failures rather than aborting the whole batch.
    const allBtn = document.getElementById("mi-import-all-btn");
    if (allBtn) {
      allBtn.addEventListener("click", async () => {
        if (!confirm(`Import all ${pendingFolders.length} pending folders?`)) return;
        allBtn.disabled = true;
        allBtn.textContent = "Importing all...";
        try {
          const res = await fetch(`${API}/api/market-intelligence/import-all`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
          });
          if (!res.ok) {
            const err = await res.json();
            alert("Bulk import failed: " + (err.detail || "unknown"));
            allBtn.disabled = false;
            allBtn.textContent = `⚡ Import all (${pendingFolders.length})`;
            return;
          }
          const result = await res.json();
          // Build a summary of what happened
          const lines = [`Bulk import complete:`, ``,
                         `✓ Imported: ${result.success_count}`,
                         result.fail_count ? `✗ Failed: ${result.fail_count}` : null,
                         result.skip_count ? `· Skipped: ${result.skip_count}` : null,
                        ].filter(Boolean);
          if (result.fail_count > 0) {
            lines.push("", "Failures:");
            for (const r of result.results.filter(x => x.status === "error")) {
              lines.push(`  ${r.date} / ${r.store_name}: ${r.error}`);
            }
          }
          alert(lines.join("\n"));
          await loadMiImportsView();
        } catch (e) {
          alert("Bulk import failed: " + e.message);
          allBtn.disabled = false;
          allBtn.textContent = `⚡ Import all (${pendingFolders.length})`;
        }
      });
    }
  } catch (e) {
    container.innerHTML = `<div class="error" style="padding: 16px;">${escapeHtml(e.message)}</div>`;
  }
}

// ========================================================================
// User identity pane (sidebar footer) + logout
// ========================================================================
let _currentUser = null;

async function loadCurrentUser() {
  try {
    const res = await fetch("/api/auth/me", { credentials: "include" });
    const data = await res.json();
    _currentUser = data;
    renderUserPane(data);
  } catch (e) {
    document.getElementById("user-pane-content").innerHTML = '<span style="color: var(--critical);">Auth error</span>';
  }
}

function renderUserPane(data) {
  const pane = document.getElementById("user-pane-content");
  if (!pane) return;
  if (data.bootstrap_mode) {
    pane.innerHTML = `
      <div style="font-size: 11px;">
        <strong style="color: var(--accent);">⚠ Bootstrap mode</strong>
        <div style="color: var(--text-dim); margin-top: 4px;">
          No users yet. Run<br><code style="background: var(--bg-elev-2); padding: 1px 6px;">py create_admin.py</code><br>to set up first admin.
        </div>
      </div>
    `;
    return;
  }
  if (!data.logged_in) {
    pane.innerHTML = `<a href="/login" style="color: var(--accent);">Sign in</a>`;
    return;
  }
  pane.innerHTML = `
    <div style="font-weight: 600; color: var(--text);">${escapeHtml(data.name || data.email)}</div>
    <div style="font-size: 10px;">${escapeHtml(data.email)} · ${escapeHtml(data.role)}</div>
    <button id="logout-btn" style="margin-top: 6px; background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0; font-size: 10px; text-decoration: underline;">Sign out</button>
  `;
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
    window.location.href = "/login";
  });
}

async function renderUsers() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">LOADING USERS...</div>`;
  try {
    const data = await api("/api/users");
    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <div>
            <div class="kicker">Admin · Authentication</div>
            <h2 style="white-space: nowrap;">Users</h2>
          </div>
          <button class="btn btn-primary" id="users-add-btn">+ Add user</button>
        </div>
      </div>

      <div class="hint-box" style="margin-bottom: 14px;">
        <strong>Adding users:</strong> set a temporary password (min 12 chars). The user will be forced to change it on first login. Share the email + temp password with them through a secure channel (in person, encrypted message). Don't email passwords.
      </div>

      <div class="card">
        <table style="font-size: 12px; margin: 0;">
          <thead>
            <tr><th>Email</th><th>Name</th><th>Role</th><th>Status</th><th>Last login</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.items.map(u => `
              <tr>
                <td><strong>${escapeHtml(u.email)}</strong></td>
                <td>${escapeHtml(u.name || '—')}</td>
                <td><span class="tag" style="font-size: 9px;">${escapeHtml(u.role)}</span></td>
                <td>${u.is_active ? '<span style="color: #6dab84;">Active</span>' : '<span style="color: var(--text-faint);">Disabled</span>'}${u.must_change_password ? ' · <span style="color: var(--accent);">must change pw</span>' : ''}</td>
                <td style="font-size: 11px; color: var(--text-dim);">${u.last_login_at || 'Never'}</td>
                <td>
                  <button class="btn-link user-reset-btn" data-id="${u.id}" data-email="${escapeHtml(u.email)}" style="font-size: 10px;">Reset pw</button>
                  ${u.is_active ? `<button class="btn-link user-deactivate-btn" data-id="${u.id}" data-email="${escapeHtml(u.email)}" style="font-size: 10px; color: var(--critical);">Disable</button>` : `<button class="btn-link user-reactivate-btn" data-id="${u.id}" style="font-size: 10px; color: #6dab84;">Re-enable</button>`}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    document.getElementById("users-add-btn").addEventListener("click", async () => {
      const email = prompt("Email for new user:");
      if (!email) return;
      const name = prompt("Display name (optional):") || "";
      const role = prompt("Role (admin or regular)?", "regular") || "regular";
      const tempPw = prompt("Temp password (min 12 chars). User will be forced to change on first login:");
      if (!tempPw || tempPw.length < 12) { alert("Password too short"); return; }
      try {
        const res = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, name, role, temp_password: tempPw }),
        });
        const result = await res.json();
        if (!res.ok) { alert("Failed: " + (result.detail || "unknown")); return; }
        alert(`User created. Share these with them:\n\nEmail: ${email}\nTemp password: ${tempPw}\n\nThey'll change it on first login.`);
        renderUsers();
      } catch (e) { alert("Error: " + e.message); }
    });

    document.querySelectorAll(".user-reset-btn").forEach(b => {
      b.addEventListener("click", async () => {
        const tempPw = prompt(`Reset password for ${b.dataset.email}. Enter new temp password (min 12 chars):`);
        if (!tempPw || tempPw.length < 12) { alert("Password too short"); return; }
        const res = await fetch(`/api/users/${b.dataset.id}/reset-password`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ temp_password: tempPw }),
        });
        if (res.ok) {
          alert(`Password reset. Share this with the user:\n\nEmail: ${b.dataset.email}\nTemp password: ${tempPw}`);
          renderUsers();
        } else { alert("Failed"); }
      });
    });

    document.querySelectorAll(".user-deactivate-btn").forEach(b => {
      b.addEventListener("click", async () => {
        if (!confirm(`Disable ${b.dataset.email}? Their sessions will end immediately.`)) return;
        const res = await fetch(`/api/users/${b.dataset.id}/deactivate`, {
          method: "POST", credentials: "include",
        });
        if (res.ok) renderUsers(); else alert("Failed");
      });
    });

    document.querySelectorAll(".user-reactivate-btn").forEach(b => {
      b.addEventListener("click", async () => {
        const res = await fetch(`/api/users/${b.dataset.id}/reactivate`, {
          method: "POST", credentials: "include",
        });
        if (res.ok) renderUsers(); else alert("Failed");
      });
    });
  } catch (e) { showError(e); }
}

// Email Scraper — configure auto-import accounts
// ========================================================================
// OCS Connector — configure + validate the auto-pull of catalogue + Order Fill
// ========================================================================
async function renderOcsConnector() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">LOADING OCS CONNECTOR...</div>`;
  try {
    const [cfg, locs] = await Promise.all([api("/api/ocs/config"), api("/api/locations")]);
    window._ocsLocs = locs;
    const last = cfg.configured
      ? `Last run: ${cfg.last_run_at || 'never'} · ${cfg.last_status || '—'}${cfg.last_error ? ' · ' + escapeHtml(cfg.last_error) : ''}`
      : 'Not configured yet.';

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div><div class="kicker">Admin · OCS Auto-import</div><h2>OCS Connector</h2></div>
      </div>

      <div class="hint-box" style="margin-bottom: 14px;">
        <strong>What this does:</strong> logs into the OCS B2B portal and pulls the <strong>catalogue</strong> (chain-wide) and each store's <strong>OrderExport</strong>, dropping them into <code style="background: var(--bg-elev-2); padding: 1px 6px;">imports/</code> to auto-import.
        <br><br>
        <strong>Per-store + time-windowed:</strong> each store's order form only exists ~7pm the night before its order day until that day's deadline, so a run polls every mapped store and imports whichever are available.
        <br><br>
        <strong>Not yet auto-scheduled:</strong> validate with "Test login" / "Run now" first; the nightly scheduler gets wired once it's proven. Credentials are encrypted at rest.
      </div>

      <div class="card" style="margin-bottom: 16px;">
        <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);"><strong>Credentials</strong></div>
        <div style="padding: 14px 16px; display: grid; grid-template-columns: 160px 1fr; gap: 10px 12px; align-items: center; max-width: 640px;">
          <label style="font-size: 12px; color: var(--text-dim);">Portal URL</label>
          <input id="ocs-base-url" type="text" value="${escapeHtml(cfg.base_url || 'https://www.ocswholesale.ca')}" style="font-size: 12px;">
          <label style="font-size: 12px; color: var(--text-dim);">Username (email)</label>
          <input id="ocs-username" type="text" value="${escapeHtml(cfg.username || '')}" style="font-size: 12px;">
          <label style="font-size: 12px; color: var(--text-dim);">Password</label>
          <input id="ocs-password" type="password" placeholder="${cfg.configured ? 'leave blank to keep current' : 'OCS password'}" style="font-size: 12px;">
          <label style="font-size: 12px; color: var(--text-dim);">Order Fill format</label>
          <input id="ocs-format" type="text" value="${escapeHtml(cfg.order_fill_format || 'Packs')}" style="font-size: 12px;">
          <label style="font-size: 12px; color: var(--text-dim);">Active</label>
          <label style="font-size: 12px;"><input id="ocs-active" type="checkbox" ${cfg.is_active ? 'checked' : ''}> enable scheduled runs (once wired)</label>
        </div>
        <div style="padding: 0 16px 14px; display: flex; gap: 10px; align-items: center;">
          <button class="btn btn-primary" id="ocs-save">Save</button>
          <span id="ocs-save-status" style="font-size: 11px; color: var(--text-dim);">${escapeHtml(last)}</span>
        </div>
      </div>

      <div class="card" style="margin-bottom: 16px;">
        <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);"><strong>Validate</strong></div>
        <div style="padding: 14px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          <button class="btn" id="ocs-test">Test login</button>
          <button class="btn" id="ocs-fetch-retailers">Fetch retailer list</button>
          <button class="btn" id="ocs-run">Run now</button>
          <span id="ocs-action-status" style="font-size: 11px; color: var(--text-dim);"></span>
        </div>
        <div id="ocs-retailers" style="padding: 0 16px 16px;"></div>
      </div>

      <div class="card" style="margin-bottom: 16px;">
        <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
          <strong>Manual Order Fill import</strong>
          <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">Fallback — use only if the nightly auto-pull missed a store's order window</span>
        </div>
        <div style="padding: 14px 16px;">
          <div style="display: flex; gap: 10px; align-items: end; flex-wrap: wrap;">
            <div>
              <label style="display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;">Store</label>
              <select id="ocs-imp-store" style="min-width: 200px;">
                ${locs.map(l => `<option value="${l.id}">${escapeHtml(l.short_name || l.name)} (${l.id})</option>`).join("")}
              </select>
            </div>
            <div>
              <label style="display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;">OrderExport (.xlsx)</label>
              <input type="file" id="ocs-imp-file" accept=".xlsx" style="font-size: 12px;">
            </div>
            <button class="btn btn-primary" id="ocs-imp-run" style="height: 34px;">Import</button>
            <span id="ocs-imp-status" style="font-size: 11px; color: var(--text-dim);"></span>
          </div>
          <div style="font-size: 11px; color: var(--text-dim); margin-top: 8px;">
            Per-store. Updates that store's flow-through / back-in-stock availability on the Reorder Report. The connector normally does this automatically each evening.
          </div>
        </div>
      </div>
    `;

    const setStatus = (id, msg, ok) => {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.color = ok === true ? "#6dab84" : ok === false ? "var(--critical)" : "var(--text-dim)";
    };

    document.getElementById("ocs-save").addEventListener("click", async () => {
      const body = {
        base_url: document.getElementById("ocs-base-url").value.trim(),
        username: document.getElementById("ocs-username").value.trim(),
        order_fill_format: document.getElementById("ocs-format").value.trim() || "Packs",
        is_active: document.getElementById("ocs-active").checked,
      };
      const pw = document.getElementById("ocs-password").value;
      if (pw) body.password = pw;
      setStatus("ocs-save-status", "Saving...");
      try {
        const res = await fetch("/api/ocs/config", { method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (res.ok) setStatus("ocs-save-status", "Saved.", true);
        else { const e = await res.json(); setStatus("ocs-save-status", "Failed: " + (e.detail || "?"), false); }
      } catch (e) { setStatus("ocs-save-status", "Error: " + e.message, false); }
    });

    document.getElementById("ocs-test").addEventListener("click", async () => {
      setStatus("ocs-action-status", "Testing login...");
      try {
        const res = await fetch("/api/ocs/test-login", { method: "POST", credentials: "include" });
        const d = await res.json();
        setStatus("ocs-action-status", d.ok ? "Login OK." : "Login failed: " + (d.error || d.detail || "?"), !!d.ok);
      } catch (e) { setStatus("ocs-action-status", "Error: " + e.message, false); }
    });

    document.getElementById("ocs-run").addEventListener("click", async () => {
      setStatus("ocs-action-status", "Running sync (this can take a minute)...");
      try {
        const res = await fetch("/api/ocs/run-now", { method: "POST", credentials: "include" });
        const d = await res.json();
        if (d.status === "ok") setStatus("ocs-action-status", `Done. Imported: ${(d.imported || []).join(', ') || 'nothing'}`, true);
        else if (d.status === "skipped") setStatus("ocs-action-status", "Skipped: " + (d.reason || "inactive"), null);
        else setStatus("ocs-action-status", "Error: " + (d.error || d.detail || "?"), false);
      } catch (e) { setStatus("ocs-action-status", "Error: " + e.message, false); }
    });

    document.getElementById("ocs-fetch-retailers").addEventListener("click", async () => {
      setStatus("ocs-action-status", "Fetching retailer list...");
      try {
        const res = await fetch("/api/ocs/retailers", { credentials: "include" });
        const d = await res.json();
        if (!d.ok) { setStatus("ocs-action-status", "Failed: " + (d.error || d.detail || "?"), false); return; }
        setStatus("ocs-action-status", `Found ${d.retailers.length} retailer(s) — map each to a store, then Save mapping.`, true);
        renderOcsRetailerMap(d.retailers, cfg.store_map || []);
      } catch (e) { setStatus("ocs-action-status", "Error: " + e.message, false); }
    });

    // Manual Order Fill import (fallback)
    const impRun = document.getElementById("ocs-imp-run");
    if (impRun) impRun.addEventListener("click", async () => {
      const file = document.getElementById("ocs-imp-file").files[0];
      const store = document.getElementById("ocs-imp-store").value;
      if (!file) { setStatus("ocs-imp-status", "Select an OrderExport_*.xlsx file.", false); return; }
      if (!store) { setStatus("ocs-imp-status", "Pick the store this Order Fill is for.", false); return; }
      setStatus("ocs-imp-status", "Importing\\u2026");
      impRun.disabled = true;
      try {
        const fd = new FormData();
        fd.append("file", file);
        fd.append("location_id", store);
        const res = await fetch("/api/order-fill/import", { method: "POST", body: fd, credentials: "same-origin" });
        const d = await res.json().catch(() => ({ detail: res.statusText }));
        if (!res.ok) throw new Error(d.detail || "Import failed");
        setStatus("ocs-imp-status", `Imported ${fmtN(d.rows)} SKUs for ${store} (generated ${d.generated_at || "?"}).`, true);
      } catch (e) {
        setStatus("ocs-imp-status", "Error: " + e.message, false);
      } finally {
        impRun.disabled = false;
      }
    });
  } catch (e) { showError(e); }
}

function renderOcsRetailerMap(retailers, existing) {
  const locs = window._ocsLocs || [];
  const mapByRid = {}; existing.forEach(m => mapByRid[m.ocs_retailer_id] = m.location_id);
  const opt = (sel) => `<option value="">— unmapped —</option>` +
    locs.map(l => `<option value="${l.id}" ${sel === l.id ? 'selected' : ''}>${escapeHtml(l.short_name || l.name)} (${l.id})</option>`).join("");
  const box = document.getElementById("ocs-retailers");
  box.innerHTML = `
    <table style="font-size: 12px; margin: 8px 0;">
      <thead><tr><th>OCS #</th><th>Name</th><th>Address</th><th>Our store</th></tr></thead>
      <tbody>
        ${retailers.map(r => `
          <tr>
            <td>${escapeHtml(r.store_number || r.retailer_id)}</td>
            <td>${escapeHtml(r.name || '')}</td>
            <td style="font-size: 11px; color: var(--text-dim);">${escapeHtml(r.address || '')}</td>
            <td><select class="ocs-map-sel" data-rid="${escapeHtml(r.retailer_id)}" data-name="${escapeHtml(r.name || '')}" style="font-size: 12px;">${opt(mapByRid[r.retailer_id] || '')}</select></td>
          </tr>`).join('')}
      </tbody>
    </table>
    <button class="btn btn-primary" id="ocs-save-map">Save mapping</button>
    <span id="ocs-map-status" style="font-size: 11px; color: var(--text-dim); margin-left: 10px;"></span>
  `;
  document.getElementById("ocs-save-map").addEventListener("click", async () => {
    const mappings = [...document.querySelectorAll(".ocs-map-sel")]
      .filter(s => s.value)
      .map(s => ({ ocs_retailer_id: s.dataset.rid, location_id: s.value, label: s.dataset.name }));
    const st = document.getElementById("ocs-map-status");
    st.textContent = "Saving...";
    try {
      const res = await fetch("/api/ocs/store-map", { method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mappings }) });
      const d = await res.json();
      st.textContent = res.ok ? `Saved ${d.count} mapping(s).` : "Failed";
      st.style.color = res.ok ? "#6dab84" : "var(--critical)";
    } catch (e) { st.textContent = "Error: " + e.message; st.style.color = "var(--critical)"; }
  });
}

        });
        if (res.ok) renderEmailScraper(); else { const e = await res.json(); alert("Failed: " + (e.detail || "unknown")); }
      } catch (e) { alert("Error: " + e.message); }
    });

    document.querySelectorAll(".es-poll-btn").forEach(b => {
      b.addEventListener("click", async () => {
        b.disabled = true; b.textContent = "Polling...";
        try {
          const res = await fetch(`/api/email-scraper/accounts/${b.dataset.id}/poll`, {
            method: "POST", credentials: "include",
          });
          const data = await res.json();
          if (data.ok) {
            alert(`Poll complete:\n\nChecked: ${data.messages_checked}\nImported: ${data.imported}\nSkipped: ${data.skipped}\nErrors: ${data.errors}${data.files_saved && data.files_saved.length ? '\n\nFiles saved:\n' + data.files_saved.join('\n') : ''}`);
          } else {
            alert("Poll failed: " + (data.error || "unknown"));
          }
          renderEmailScraper();
        } catch (e) { alert("Error: " + e.message); }
      });
    });

    document.querySelectorAll(".es-delete-btn").forEach(b => {
      b.addEventListener("click", async () => {
        if (!confirm(`Delete account "${b.dataset.label}"? This doesn't delete past log entries.`)) return;
        const res = await fetch(`/api/email-scraper/accounts/${b.dataset.id}`, {
          method: "DELETE", credentials: "include",
        });
        if (res.ok) renderEmailScraper(); else alert("Delete failed");
      });
    });
  } catch (e) { showError(e); }
}

// ========================================================================
// System Health — operational visibility
// ========================================================================
// Single page that answers: "Is this system healthy right now?"
// Sections: data freshness per source, per-store coverage, DB stats,
// recent activity stream, backup status, manual backup button.
//
// Polls /api/system/health on tab load. Refresh button re-polls.

async function renderSystemHealth() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">CHECKING SYSTEM HEALTH...</div>`;
  try {
    const data = await api("/api/system/health");

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <div>
            <div class="kicker">Admin · Operational Visibility</div>
            <h2 style="white-space: nowrap;">System Health</h2>
          </div>
          <div>
            <button class="btn" id="sh-refresh">Refresh</button>
            <button class="btn" id="sh-backup-now" style="margin-left: 6px;">Backup now</button>
          </div>
        </div>
        <div style="font-size: 11px; color: var(--text-dim);">Last checked: ${escapeHtml(data.checked_at)}</div>
      </div>

      <div class="hint-box" style="margin-bottom: 14px;">
        <strong>Quick read:</strong> green = healthy, yellow = aging, red = stale. If anything is red, click into the relevant import workflow and refresh that data source.
      </div>

      <div id="sh-content"></div>
    `;

    document.getElementById("sh-refresh").addEventListener("click", renderSystemHealth);
    document.getElementById("sh-backup-now").addEventListener("click", async () => {
      const btn = document.getElementById("sh-backup-now");
      btn.disabled = true; btn.textContent = "Backing up...";
      try {
        const res = await fetch(`${API}/api/system/backup-now`, { method: 'POST' });
        if (!res.ok) {
          const err = await res.json();
          alert("Backup failed: " + (err.detail || "unknown"));
        } else {
          const result = await res.json();
          alert(`Backup created: ${result.path}\nSize: ${(result.size_bytes / 1024).toFixed(1)} KB\n${result.pruned ? `Pruned ${result.pruned} old backups` : 'No old backups to prune'}`);
          await renderSystemHealth();
          return;
        }
      } catch (e) {
        alert("Backup failed: " + e.message);
      } finally {
        btn.disabled = false; btn.textContent = "Backup now";
      }
    });

    renderSystemHealthContent(data);
  } catch (e) { showError(e); }
}

function renderSystemHealthContent(data) {
  const container = document.getElementById("sh-content");

  // Status pill helper. Returns colored tag based on age vs thresholds.
  const sourceTag = (src) => {
    if (src.age_days === null || src.age_days === undefined) {
      if (src.row_count > 0) return '<span class="tag" style="background: rgba(120, 120, 120, 0.15); color: var(--text-dim); font-size: 10px;">UNTRACKED</span>';
      return '<span class="tag" style="background: rgba(214, 100, 100, 0.15); color: #d66464; font-size: 10px;">EMPTY</span>';
    }
    if (src.age_days <= (src.expected_cadence_days || 1)) return '<span class="tag" style="background: rgba(80, 180, 100, 0.15); color: #6dab84; font-size: 10px;">FRESH</span>';
    if (src.age_days <= (src.stale_after_days || 30)) return '<span class="tag" style="background: rgba(214, 180, 70, 0.15); color: #c89b32; font-size: 10px;">AGING</span>';
    return '<span class="tag" style="background: rgba(214, 100, 100, 0.15); color: #d66464; font-size: 10px;">STALE</span>';
  };

  const storeFreshnessTag = (ageDays, thresholdDays) => {
    if (ageDays === null || ageDays === undefined) return '<span style="color: var(--text-faint);">—</span>';
    if (ageDays <= thresholdDays) return `<span style="color: #6dab84;">${ageDays}d</span>`;
    if (ageDays <= thresholdDays * 3) return `<span style="color: #c89b32;">${ageDays}d</span>`;
    return `<span style="color: #d66464; font-weight: 600;">${ageDays}d</span>`;
  };

  // ----- Build sections -----
  let html = '';

  // 1. Data sources
  html += `
    <div class="card" style="margin-bottom: 16px;">
      <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
        <strong>Data Sources</strong>
        <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">${data.sources.length} sources tracked</span>
      </div>
      <table style="font-size: 12px; margin: 0;">
        <thead>
          <tr>
            <th>Source</th>
            <th>Last update</th>
            <th class="num">Age</th>
            <th class="num">Rows</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${data.sources.map(s => `
            <tr>
              <td><strong>${escapeHtml(s.label)}</strong>${s.note ? `<div class="sku">${escapeHtml(s.note)}</div>` : ''}</td>
              <td>${s.last_update || '<span style="color: var(--text-faint);">—</span>'}</td>
              <td class="num">${s.age_days !== null && s.age_days !== undefined ? `${s.age_days}d` : '—'}</td>
              <td class="num">${(s.row_count !== undefined ? s.row_count : (s.snapshot_count !== undefined ? s.snapshot_count : 0)).toLocaleString()}</td>
              <td>${sourceTag(s)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  // 2. Per-store coverage
  html += `
    <div class="card" style="margin-bottom: 16px;">
      <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
        <strong>Per-store coverage</strong>
        <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">Last data per store, age in days</span>
      </div>
      <table style="font-size: 12px; margin: 0;">
        <thead>
          <tr>
            <th>Store</th>
            <th>Last IOH</th>
            <th class="num">IOH age</th>
            <th>Last Sales</th>
            <th class="num">Sales age</th>
            <th class="num">MI imports</th>
            <th class="num">MI age</th>
          </tr>
        </thead>
        <tbody>
          ${data.per_store.length === 0 ? `
            <tr><td colspan="7" style="padding: 16px; color: var(--text-dim); text-align: center;">No active stores configured.</td></tr>
          ` : data.per_store.map(s => `
            <tr>
              <td><strong>${escapeHtml(s.store_name)}</strong></td>
              <td style="font-size: 11px;">${s.last_ioh ? s.last_ioh.split(' ')[0] : '<span style="color: var(--text-faint);">—</span>'}</td>
              <td class="num">${storeFreshnessTag(s.ioh_age_days, 3)}</td>
              <td style="font-size: 11px;">${s.last_sales || '<span style="color: var(--text-faint);">—</span>'}</td>
              <td class="num">${storeFreshnessTag(s.sales_age_days, 2)}</td>
              <td class="num">${s.mi_imports || 0}</td>
              <td class="num">${storeFreshnessTag(s.mi_age_days, 21)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  // 3. DB stats + backups
  if (data.db_stats && !data.db_stats.error) {
    const top10 = Object.entries(data.db_stats.table_counts || {})
      .filter(([_, c]) => c !== null && c > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 10);

    html += `
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div class="card">
          <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
            <strong>Database</strong>
          </div>
          <div style="padding: 14px;">
            <div style="font-size: 12px; line-height: 1.7;">
              <div><strong>Size:</strong> ${escapeHtml(data.db_stats.db_size_human)}</div>
              <div><strong>Total rows:</strong> ${data.db_stats.total_rows.toLocaleString()}</div>
              <div><strong>Last modified:</strong> ${escapeHtml(data.db_stats.modified_at)}</div>
              <div style="margin-top: 8px; font-weight: 600; font-size: 11px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em;">Top 10 tables</div>
              ${top10.map(([t, c]) => `
                <div style="display: flex; justify-content: space-between; font-size: 11px;">
                  <code>${escapeHtml(t)}</code>
                  <span class="num">${c.toLocaleString()}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="card">
          <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
            <strong>Backups</strong>
          </div>
          <div style="padding: 14px;">
            ${data.backup_summary && data.backup_summary.count > 0 ? `
              <div style="font-size: 12px; line-height: 1.7;">
                <div><strong>Backup count:</strong> ${data.backup_summary.count}</div>
                <div><strong>Latest:</strong> ${escapeHtml(data.backup_summary.latest.filename)}</div>
                <div><strong>Latest age:</strong> ${escapeHtml(data.backup_summary.latest.created_at)}</div>
                <div><strong>Total size:</strong> ${(data.backup_summary.total_size_bytes / 1024 / 1024).toFixed(2)} MB</div>
                <div style="font-size: 11px; color: var(--text-dim); margin-top: 8px;">
                  Nightly automatic at 3am. Retention: 30 daily + 13 weekly Sundays.
                  Stored in <code>backups/</code> folder.
                </div>
              </div>
            ` : `
              <div style="font-size: 12px; color: var(--text-dim);">
                No backups yet. Click "Backup now" above to create the first one,
                or wait for the nightly 3am scheduler.
              </div>
            `}
          </div>
        </div>
      </div>
    `;
  }

  // 4. Recent activity
  html += `
    <div class="card" style="margin-bottom: 16px;">
      <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
        <strong>Recent activity</strong>
        <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">Last 20 events across all sources</span>
      </div>
      ${data.recent_activity.length === 0 ? `
        <div style="padding: 16px; color: var(--text-dim); font-size: 12px;">
          No recent activity logged.
        </div>
      ` : `
        <table style="font-size: 12px; margin: 0;">
          <thead><tr><th>When</th><th>Kind</th><th>Detail</th></tr></thead>
          <tbody>
            ${data.recent_activity.map(e => `
              <tr>
                <td style="color: var(--text-dim); font-size: 11px;">${escapeHtml(e.timestamp || '?')}</td>
                <td><span class="tag" style="font-size: 9px;">${escapeHtml(e.kind)}</span></td>
                <td>${escapeHtml(e.summary)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    </div>
  `;

  container.innerHTML = html;
}

// ========================================================================
// Settings — engine tuning UI
// ========================================================================
// Lets the user tweak engine parameters (reorder ceilings, velocity floor,
// pack-size threshold, hero classification, promo cascade, etc.) without
// touching code. Every change is logged in app_settings_history.
//
// UX:
//   - Settings grouped by section (Reorder Engine, Hero Classification, etc.)
//   - Each row: label + tooltip + value input + "Default: X" + "Reset" link
//   - Modified settings are highlighted (different background)
//   - Save button at the bottom of each section commits all changes in that section
//   - Recent changes panel shows the audit trail

async function renderSettings() {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">LOADING SETTINGS...</div>`;
  try {
    const data = await api("/api/settings");
    const sections = data.sections || {};
    const sectionNames = Object.keys(sections);

    main.innerHTML = `
      <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <div>
            <div class="kicker">Admin · Engine Tuning</div>
            <h2 style="white-space: nowrap;">Settings</h2>
          </div>
          <div style="font-size: 11px; color: var(--text-dim);">
            Logged in as: <strong id="settings-author-display">${escapeHtml(getAuthor() || 'click to set name')}</strong>
            <button id="settings-set-author" class="btn-link" style="margin-left: 8px;">change</button>
          </div>
        </div>
      </div>

      <div class="hint-box" style="margin-bottom: 14px;">
        Every change here flows through to the reorder engine on the next /api/reorder call. No restart needed.
        Changes are logged to the audit trail at the bottom. If you need to undo something, "Reset to default" is one click away.
      </div>

      <div id="settings-sections">
        ${sectionNames.map(name => renderSettingsSection(name, sections[name])).join("")}
      </div>

      <div class="card" style="margin-top: 24px;">
        <div style="padding: 16px; border-bottom: 1px solid var(--border);">
          <strong>Recent Changes</strong>
          <span style="font-size: 11px; color: var(--text-dim); margin-left: 8px;">Audit trail of settings modifications</span>
        </div>
        <div id="settings-history" style="padding: 8px;">
          <div style="color: var(--text-faint); font-size: 11px; padding: 16px;">Loading…</div>
        </div>
      </div>
    `;

    document.getElementById("settings-set-author").addEventListener("click", () => {
      const n = (prompt("Your name:", getAuthor() || "") || "").trim();
      if (n) {
        setAuthor(n);
        document.getElementById("settings-author-display").textContent = n;
      }
    });

    wireUpSettingsControls();
    loadSettingsHistory();
  } catch (e) { showError(e); }
}

function renderSettingsSection(sectionName, settings) {
  const rows = settings.map(s => {
    const inputId = `setting-${s.key.replace(/\./g, "-")}`;
    const isPercent = s.value_type === "percent";
    const isInt = s.value_type === "int" || s.value_type === "days";
    const step = isInt ? "1" : (s.value_type === "float" ? "0.01" : "0.1");
    const suffix = isPercent ? "%" : (s.value_type === "days" ? " days" : "");
    const modifiedStyle = s.is_modified
      ? 'background: rgba(214, 180, 70, 0.06); border-left: 2px solid var(--warning, #c89b32);'
      : '';

    return `
      <div class="setting-row" data-key="${escapeHtml(s.key)}" style="display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); ${modifiedStyle}">
        <div>
          <div style="font-size: 12px;">
            <strong>${escapeHtml(s.label)}</strong>
            ${s.is_modified ? '<span class="tag" style="font-size: 9px; padding: 1px 5px; margin-left: 6px; background: rgba(214,180,70,0.15); color: #c89b32;">MODIFIED</span>' : ''}
          </div>
          ${s.description ? `<div style="font-size: 11px; color: var(--text-dim); margin-top: 2px;">${escapeHtml(s.description)}</div>` : ''}
          <div style="font-size: 10px; color: var(--text-faint); margin-top: 2px;">
            Default: ${s.default_value}${suffix}
            ${s.min_value !== null ? ` · min: ${s.min_value}${suffix}` : ''}
            ${s.max_value !== null ? ` · max: ${s.max_value}${suffix}` : ''}
            · key: <code>${escapeHtml(s.key)}</code>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 4px;">
          <input type="number" id="${inputId}" class="setting-input" data-key="${escapeHtml(s.key)}"
                 value="${isInt ? Math.round(s.value) : s.value}"
                 step="${step}"
                 min="${s.min_value !== null ? s.min_value : ''}"
                 max="${s.max_value !== null ? s.max_value : ''}"
                 style="width: 80px; text-align: right;">
          <span style="font-size: 11px; color: var(--text-dim);">${suffix}</span>
        </div>
        <div style="display: flex; gap: 6px;">
          <button class="btn setting-save" data-key="${escapeHtml(s.key)}" style="font-size: 11px;">Save</button>
          ${s.is_modified ? `<button class="btn-link setting-reset" data-key="${escapeHtml(s.key)}" style="font-size: 11px;">Reset</button>` : ''}
        </div>
      </div>
    `;
  }).join("");

  return `
    <div class="card" style="margin-bottom: 16px;">
      <div style="padding: 14px; border-bottom: 1px solid var(--border); background: var(--bg-elev-2);">
        <strong>${escapeHtml(sectionName)}</strong>
      </div>
      ${rows}
    </div>
  `;
}

function wireUpSettingsControls() {
  // Save individual setting
  document.querySelectorAll(".setting-save").forEach(btn => {
    btn.addEventListener("click", () => saveSetting(btn.dataset.key));
  });
  // Reset to default
  document.querySelectorAll(".setting-reset").forEach(btn => {
    btn.addEventListener("click", () => resetSetting(btn.dataset.key));
  });
  // Save on Enter key in input
  document.querySelectorAll(".setting-input").forEach(input => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        saveSetting(input.dataset.key);
      }
    });
  });
}

async function saveSetting(key) {
  const input = document.querySelector(`.setting-input[data-key="${CSS.escape(key)}"]`);
  if (!input) return;
  const value = parseFloat(input.value);
  if (isNaN(value)) { alert("Invalid number"); return; }
  const author = ensureAuthor() || "anonymous";

  try {
    const res = await fetch(`${API}/api/settings/${encodeURIComponent(key)}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value, changed_by: author }),
    });
    if (!res.ok) {
      const err = await res.json();
      alert("Save failed: " + (err.detail || "unknown"));
      return;
    }
    // Quick visual feedback
    const row = document.querySelector(`.setting-row[data-key="${CSS.escape(key)}"]`);
    if (row) {
      row.style.transition = "background 600ms";
      const orig = row.style.background;
      row.style.background = "rgba(80, 180, 100, 0.2)";
      setTimeout(() => { row.style.background = orig; }, 600);
    }
    // Refresh the page state so Modified tag + Reset button update
    setTimeout(() => renderSettings(), 700);
  } catch (e) { alert("Save failed: " + e.message); }
}

async function resetSetting(key) {
  if (!confirm(`Reset ${key} to default?`)) return;
  const author = ensureAuthor() || "anonymous";
  try {
    const res = await fetch(`${API}/api/settings/${encodeURIComponent(key)}/reset`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ changed_by: author }),
    });
    if (!res.ok) {
      const err = await res.json();
      alert("Reset failed: " + (err.detail || "unknown"));
      return;
    }
    await renderSettings();
  } catch (e) { alert("Reset failed: " + e.message); }
}

async function loadSettingsHistory() {
  try {
    const data = await api("/api/settings/_history?limit=50");
    const container = document.getElementById("settings-history");
    if (!container) return;
    if (data.items.length === 0) {
      container.innerHTML = '<div style="color: var(--text-faint); font-size: 11px; padding: 16px;">No changes yet.</div>';
      return;
    }
    container.innerHTML = `
      <table style="font-size: 11px;">
        <thead><tr>
          <th>When</th>
          <th>Setting</th>
          <th class="num">Old</th>
          <th class="num">New</th>
          <th>By</th>
          <th>Note</th>
        </tr></thead>
        <tbody>
          ${data.items.map(h => `
            <tr>
              <td style="color: var(--text-dim);">${h.changed_at}</td>
              <td><code>${escapeHtml(h.key)}</code></td>
              <td class="num" style="color: var(--text-faint);">${h.old_value !== null ? h.old_value : '—'}</td>
              <td class="num"><strong>${h.new_value}</strong></td>
              <td>${escapeHtml(h.changed_by || '—')}</td>
              <td style="color: var(--text-dim);">${escapeHtml(h.note || '')}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  } catch (e) {
    const container = document.getElementById("settings-history");
    if (container) {
      container.innerHTML = `<div class="error" style="padding: 16px; font-size: 11px;">Couldn't load history: ${escapeHtml(e.message)}</div>`;
    }
  }
}

function goto(page) {
  document.querySelectorAll("nav button[data-page]").forEach(b => b.classList.remove("active"));
  const btn = document.querySelector(`nav button[data-page="${page}"]`);
  if (btn) btn.classList.add("active");
  if (routes[page]) routes[page]();
}

// Page-navigation buttons (those with data-page attribute)
document.querySelectorAll("nav button[data-page]").forEach(btn => {
  btn.addEventListener("click", () => goto(btn.dataset.page));
});

// Collapsible group headers (data-toggle attribute)
document.querySelectorAll(".nav-group-header[data-toggle]").forEach(hdr => {
  hdr.addEventListener("click", () => {
    const group = hdr.closest(".nav-group");
    if (!group) return;
    group.classList.toggle("collapsed");
    // Persist collapse state per group in localStorage
    try {
      const groupName = hdr.dataset.toggle;
      const isCollapsed = group.classList.contains("collapsed");
      localStorage.setItem(`nav-group-${groupName}-collapsed`, isCollapsed ? "1" : "0");
    } catch (e) { /* private browsing — ignore */ }
  });
});

// Restore collapsed state from previous session
document.querySelectorAll(".nav-group[data-group]").forEach(group => {
  try {
    const groupName = group.dataset.group;
    if (localStorage.getItem(`nav-group-${groupName}-collapsed`) === "1") {
      group.classList.add("collapsed");
    }
  } catch (e) { /* ignore */ }
});

updateStatus();
ensureStoreNames().then(() => renderOverview());
loadCurrentUser();
</script>
</body>
</html>
